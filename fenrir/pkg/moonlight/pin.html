<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enter PIN · Fenrir</title>
    <link rel="stylesheet" href="/fenrir.css">
    <script src="/fenrir-pin.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="shell">
            <a class="brand" href="/dashboard">Fenrir</a>
            <nav aria-label="Main navigation">
                <a href="/dashboard" aria-current="true">Pair a device</a>
                <a href="/updates">Emulator updates</a>
            </nav>
        </div>
    </header>
    <main class="shell">
        <header class="page-heading">
            <h1>Enter your PIN</h1>
            <p class="muted">Use the four digits displayed in Moonlight.</p>
        </header>
        <div class="card stack pin-card">
            <form class="stack" aria-label="Pair device">
                <div>
                    <label for="pin">Moonlight PIN</label>
                    <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" aria-describedby="pin-status" required disabled>
                </div>
                <button class="button" type="submit" disabled>Pair device</button>
            </form>
            <p id="pin-status" class="caption" role="status">Checking pairing request…</p>
            <div class="actions">
                <button id="retry" class="button secondary" type="button" hidden>Retry connection</button>
                <a href="/dashboard">Back to pairing requests</a>
            </div>
            <noscript><p>Enable JavaScript to submit the PIN.</p></noscript>
        </div>
    </main>
</body>
</html>
