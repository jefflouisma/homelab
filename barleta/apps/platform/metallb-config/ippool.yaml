# MetalLB IP Pool Configuration
# Separate from Helm chart for GitOps sync ordering
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: game-streaming-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.220-192.168.1.230
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: game-streaming-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - game-streaming-pool
