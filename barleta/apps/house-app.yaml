# House ArgoCD Application
# Deploys all house services: Agent Zero, Jellyfin, Home Assistant, Prowlarr, Fenrir, NVIDIA
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: house
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefflouisma/homelab.git
    targetRevision: main
    path: barleta/apps/house
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: house
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
