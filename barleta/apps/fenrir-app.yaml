# Fenrir ArgoCD Application
# Deploys all Fenrir components to the house namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fenrir
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jefflouisma/homelab.git
    targetRevision: main
    path: barleta/apps/house/fenrir
    directory:
      recurse: true
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: house
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
