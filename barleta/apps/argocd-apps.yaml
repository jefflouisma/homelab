---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barleta-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jefflouisma/homelab.git
    targetRevision: main
    path: barleta/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
