---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-test
  labels:
    app: gitops-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-test
  namespace: gitops-test
  labels:
    app: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-test
  namespace: gitops-test
spec:
  type: NodePort
  selector:
    app: gitops-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
