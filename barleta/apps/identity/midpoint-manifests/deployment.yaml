---
apiVersion: v1
kind: Secret
metadata:
  name: midpoint-db-secret
  namespace: identity
type: Opaque
stringData:
  password: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: midpoint-admin-secret
  namespace: identity
type: Opaque
stringData:
  password: "admin123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: midpoint-config
  namespace: identity
data:
  config.xml: |
    <?xml version="1.0"?>
    <configuration>
        <midpoint>
            <repository>
                <type>native</type>
                <database>postgresql</database>
                <jdbcUrl>jdbc:postgresql://postgresql.identity.svc.cluster.local:5432/midpoint</jdbcUrl>
                <jdbcUsername>postgres</jdbcUsername>
                <jdbcPassword>changeme</jdbcPassword>
            </repository>
            <audit>
                <auditService>
                    <auditServiceFactoryClass>com.evolveum.midpoint.repo.sqale.audit.SqaleAuditServiceFactory</auditServiceFactoryClass>
                </auditService>
            </audit>
            <keystore>
                <keyStorePath>${midpoint.home}/keystore.jceks</keyStorePath>
                <keyStorePassword>changeit</keyStorePassword>
                <encryptionKeyAlias>default</encryptionKeyAlias>
            </keystore>
            <icf>
                <scanClasspath>true</scanClasspath>
                <scanDirectory>${midpoint.home}/icf-connectors</scanDirectory>
            </icf>
            <administrator>
                <initialPassword>admin123</initialPassword>
            </administrator>
        </midpoint>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: midpoint
  namespace: identity
  labels:
    app: midpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midpoint
  template:
    metadata:
      labels:
        app: midpoint
    spec:
      containers:
        - name: midpoint
          image: evolveum/midpoint:4.8.4-alpine
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MP_ENTRY_POINT
              value: /opt/midpoint-dirs-docker-entrypoint
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: midpoint-home
              mountPath: /opt/midpoint/var
            - name: midpoint-config-volume
              mountPath: /opt/midpoint/var/config.xml
              subPath: config.xml
          livenessProbe:
            httpGet:
              path: /midpoint/actuator/health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /midpoint/actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
      volumes:
        - name: midpoint-home
          persistentVolumeClaim:
            claimName: midpoint-data
        - name: midpoint-config-volume
          configMap:
            name: midpoint-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: midpoint-data
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: midpoint
  namespace: identity
spec:
  selector:
    app: midpoint
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: midpoint
  namespace: identity
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - midpoint.barleta.local
      secretName: midpoint-tls
  rules:
    - host: midpoint.barleta.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: midpoint
                port:
                  number: 8080
