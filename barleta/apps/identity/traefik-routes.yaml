---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: identity
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`keycloak.barleta.local`)
      kind: Rule
      services:
        - name: keycloak
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: midpoint
  namespace: identity
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`midpoint.barleta.local`)
      kind: Rule
      services:
        - name: midpoint
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: testapp
  namespace: test-app
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`testapp.barleta.local`)
      kind: Rule
      services:
        - name: test-app
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`argocd.barleta.local`)
      kind: Rule
      services:
        - name: argocd-server
          # argocd-server serves HTTPS; if Traefik connects over HTTP you'll get a 307 redirect loop.
          port: 443
          scheme: https
          serversTransport: argocd-transport
  tls: {}
---
# Traefik -> ArgoCD uses a self-signed cert by default; skip backend verification.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-transport
  namespace: argocd
spec:
  insecureSkipVerify: true
