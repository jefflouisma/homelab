---
# Keycloak SSO/IAM (Fresh Deployment)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: "*"
    helm:
      valuesObject:
        auth:
          adminUser: admin
          adminPassword: "changeme"  # Override in secret
        postgresql:
          enabled: false
        externalDatabase:
          host: postgresql.identity.svc.cluster.local
          port: 5432
          user: postgres
          password: "changeme"  # Override in secret
          database: keycloak
        production: true
        proxy: edge
        proxyHeaders: xforwarded
        httpRelativePath: /
        ingress:
          enabled: true
          ingressClassName: traefik
          hostname: keycloak.barleta.local
          tls: true
          annotations:
            cert-manager.io/cluster-issuer: selfsigned-issuer
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
