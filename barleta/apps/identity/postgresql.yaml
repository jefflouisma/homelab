---
# PostgreSQL for Identity Stack (Keycloak, MidPoint)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 16.4.1
    helm:
      valuesObject:
        global:
          postgresql:
            auth:
              postgresPassword: "changeme"  # Override in secret
              database: keycloak
        primary:
          persistence:
            enabled: true
            size: 10Gi
            storageClass: harvester-longhorn
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        metrics:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
