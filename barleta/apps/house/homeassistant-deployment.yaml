---
apiVersion: v1
kind: Namespace
metadata:
  name: house
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: house
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-config
  namespace: house
data:
  proxy.yaml: |
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/8
        - 192.168.0.0/16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: house
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      initContainers:
        - name: configure-proxy
          image: ghcr.io/home-assistant/home-assistant:stable
          command:
            - python3
            - -c
            - |
              from pathlib import Path
              import re
              config = Path('/config/configuration.yaml')
              content = config.read_text() if config.exists() else 'default_config:\n'
              if not re.search(r'^http\s*:', content, re.MULTILINE):
                  config.write_text(content.rstrip() + '\n\n' + Path('/proxy/proxy.yaml').read_text())
          volumeMounts:
            - name: config
              mountPath: /config
            - name: proxy
              mountPath: /proxy
              readOnly: true
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - containerPort: 8123
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: proxy
          configMap:
            name: homeassistant-config
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: house
spec:
  selector:
    app: homeassistant
  ports:
    - port: 8123
      targetPort: 8123
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant
  namespace: house
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`homeassistant.barleta.local`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
