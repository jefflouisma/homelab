# Prowlarr + FlareSolverr Stack for House
# Prowlarr: Indexer manager for *arr apps
# FlareSolverr: Cloudflare bypass proxy using headless Chrome
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: house
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr-stack
  namespace: house
  labels:
    app: prowlarr-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr-stack
  template:
    metadata:
      labels:
        app: prowlarr-stack
    spec:
      containers:
        # -----------------------------------
        # Container 1: Prowlarr (Indexer Manager)
        # -----------------------------------
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          ports:
            - containerPort: 9696
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
            - name: UMASK
              value: "002"
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 10

        # -----------------------------------
        # Container 2: FlareSolverr (Cloudflare Bypass)
        # -----------------------------------
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          ports:
            - containerPort: 8191
              name: solver
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "America/Los_Angeles"
            - name: CAPTCHA_SOLVER
              value: "none"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
# ClusterIP Service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: house
spec:
  selector:
    app: prowlarr-stack
  ports:
    - name: http
      port: 9696
      targetPort: 9696
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: house
spec:
  selector:
    app: prowlarr-stack
  ports:
    - name: solver
      port: 8191
      targetPort: 8191
  type: ClusterIP
---
# NodePort Services for direct IP access (192.168.1.X network)
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-nodeport
  namespace: house
spec:
  type: NodePort
  selector:
    app: prowlarr-stack
  ports:
    - name: http
      port: 9696
      targetPort: 9696
      nodePort: 30696
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr-nodeport
  namespace: house
spec:
  type: NodePort
  selector:
    app: prowlarr-stack
  ports:
    - name: solver
      port: 8191
      targetPort: 8191
      nodePort: 30191
---
# IngressRoute for hostname-based access (optional)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: house
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prowlarr.barleta.local`)
      kind: Rule
      services:
        - name: prowlarr
          port: 9696
