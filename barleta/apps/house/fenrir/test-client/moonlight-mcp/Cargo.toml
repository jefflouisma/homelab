[package]
name = "moonlight-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP tool for Moonlight E2E testing with AI validation"

[[bin]]
name = "moonlight-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for OpenRouter API and native mTLS
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Base64 encoding for images
base64 = "0.22"

# Environment file parsing
dotenvy = "0.15"

# Image handling
image = "0.25"

# Async process spawning
async-process = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Path expansion
shellexpand = "3"

# Crypto for native pairing protocol
rcgen = "0.13"          # Self-signed cert generation
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
aes = "0.8"
rand = "0.8"
hex = "0.4"
x509-parser = "0.16"

# Native TLS with client certs
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# Directories for config storage
dirs = "5"

# UUID generation for pairing requests
uuid = { version = "1", features = ["v4"] }

# PEM parsing
pem = "3"

# Date/time formatting for screenshot names
chrono = "0.4"

# AES-128 GCM encryption for control stream
aes-gcm = "0.10"
