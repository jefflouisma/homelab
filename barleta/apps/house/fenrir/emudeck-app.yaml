# Fenrir EmuDeck Application
# ES-DE frontend with standalone emulators via AppImage Extract Pattern
# + RetroArch cores for retro systems
---
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: emudeck
  namespace: house
spec:
  id: 2
  title: "EmuDeck"
  isHDRSupported: false
  wolfConfig:
    startVirtualCompositor: true
    startAudioServer: true
    runner:
      type: process
      runCommand: "sleep infinity"
  # Minimal 1x1 transparent WebP placeholder (base64)
  appAssetWebP: "UklGRlAAAABXRUJQVlA4IEQAAADwAQCdASoBAAEAAkA4JZQCdAEO/hOMAAD+9f/e/fn3/vf+7/3v/e/94AAAAAAA"
  template:
    spec:
      initContainers:
        # Fix permissions on all PVC mounts for UID 1000
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /Emulation/saves && chmod -R 755 /Emulation/saves
              chown -R 1000:1000 /Emulation/bios && chmod -R 755 /Emulation/bios
              # Don't chown roms — large volume, and read-only is fine
          volumeMounts:
            - name: saves
              mountPath: /Emulation/saves
            - name: bios
              mountPath: /Emulation/bios
          securityContext:
            runAsUser: 0
      containers:
        - name: emudeck
          image: ghcr.io/jefflouisma/fenrir-emudeck:11144ad
          command:
            - /bin/bash
            - -c
            - |
              set -e
              RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/.X11-unix}"
              export XDG_RUNTIME_DIR="$RUNTIME_DIR"
              mkdir -p "$RUNTIME_DIR"
              chmod 700 "$RUNTIME_DIR" 2>/dev/null || true

              PULSE_COOKIE_PATH="${RUNTIME_DIR}/.config/pulse/cookie"
              export PULSE_COOKIE="$PULSE_COOKIE_PATH"
              HOME_DIR="/home/retro"
              mkdir -p "$HOME_DIR"
              export HOME="$HOME_DIR"
              if [ -r "$PULSE_COOKIE_PATH" ]; then
                  mkdir -p "$HOME_DIR/.config/pulse"
                  cp -f "$PULSE_COOKIE_PATH" "$HOME_DIR/.config/pulse/cookie" || true
                  chmod 600 "$HOME_DIR/.config/pulse/cookie" 2>/dev/null || true
              fi

              export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-wayland}"
              export QT_QPA_PLATFORM=wayland

              # Handle both relative (wayland-0) and absolute paths
              WAYLAND_DISPLAY_VAL="${WAYLAND_DISPLAY:-wayland-0}"
              if [[ "$WAYLAND_DISPLAY_VAL" = /* ]]; then
                  WAYLAND_SOCKET="$WAYLAND_DISPLAY_VAL"
              else
                  WAYLAND_SOCKET="${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY_VAL}"
              fi
              echo "Waiting for Wayland display at ${WAYLAND_SOCKET}..."
              TIMEOUT=30
              WAITED=0
              while [ ! -S "${WAYLAND_SOCKET}" ] && [ $WAITED -lt $TIMEOUT ]; do
                  sleep 1
                  WAITED=$((WAITED + 1))
                  echo "Waiting for wayland socket... ($WAITED/$TIMEOUT)"
              done

              if [ ! -S "${WAYLAND_SOCKET}" ]; then
                  echo "ERROR: Wayland display not available after ${TIMEOUT}s"
                  exit 1
              fi

              PULSE_SOCKET="${XDG_RUNTIME_DIR}/pulse-socket"
              echo "Waiting for PulseAudio socket at ${PULSE_SOCKET}..."
              TIMEOUT=30
              WAITED=0
              while [ ! -S "${PULSE_SOCKET}" ] && [ $WAITED -lt $TIMEOUT ]; do
                  sleep 1
                  WAITED=$((WAITED + 1))
                  echo "Waiting for pulse socket... ($WAITED/$TIMEOUT)"
              done

              if [ ! -S "${PULSE_SOCKET}" ]; then
                  echo "ERROR: PulseAudio socket not available after ${TIMEOUT}s"
                  exit 1
              fi

              export PULSE_SERVER="${PULSE_SERVER:-unix:${PULSE_SOCKET}}"
              PULSE_SINK_NAME="$(pactl list sinks short 2>/dev/null | awk '$2 ~ /^virtual_sink/ {print $2; exit}')"
              if [ -n "${PULSE_SINK_NAME}" ]; then
                  export PULSE_SINK="${PULSE_SINK_NAME}"
                  export PULSE_SOURCE="${PULSE_SINK_NAME}.monitor"
                  pactl set-default-sink "${PULSE_SINK_NAME}" || true
                  pactl set-default-source "${PULSE_SINK_NAME}.monitor" || true
                  echo "Using PulseAudio sink ${PULSE_SINK_NAME}"
              else
                  echo "WARN: No virtual_sink found; using default PulseAudio sink"
              fi

              # Set up ES-DE directories
              ln -sfn /Emulation/roms "$HOME_DIR/ROMs"

              # ES-DE config
              ESDE_CONFIG_DIR="$HOME_DIR/.config/es-de"
              mkdir -p "$ESDE_CONFIG_DIR"
              if [ ! -f "$ESDE_CONFIG_DIR/es_settings.xml" ]; then
                  cp /etc/es-de/es_settings.xml "$ESDE_CONFIG_DIR/es_settings.xml"
              fi

              # RetroArch config
              RETROARCH_CONFIG_DIR="$HOME_DIR/.config/retroarch"
              mkdir -p "$RETROARCH_CONFIG_DIR"
              if [ ! -f "$RETROARCH_CONFIG_DIR/retroarch.cfg" ]; then
                  cp /etc/retroarch.cfg "$RETROARCH_CONFIG_DIR/retroarch.cfg"
              fi

              # Ensure save subdirectories exist
              mkdir -p /Emulation/saves/retroarch/{saves,states} 2>/dev/null || true
              mkdir -p /Emulation/saves/pcsx2/memcards 2>/dev/null || true
              mkdir -p /Emulation/saves/ppsspp 2>/dev/null || true
              mkdir -p /Emulation/saves/duckstation 2>/dev/null || true
              mkdir -p /Emulation/saves/rpcs3 2>/dev/null || true
              mkdir -p /Emulation/saves/shadps4 2>/dev/null || true

              # RPCS3 / PS3 configuration
              # Copy custom ES-DE system definitions (RPCS3 Directory as default PS3 command + PS4 shadPS4)
              ESDE_CUSTOM_DIR="$HOME_DIR/.config/es-de/custom_systems"
              mkdir -p "$ESDE_CUSTOM_DIR"
              if [ -d /etc/es-de/custom_systems ]; then
                  cp -r /etc/es-de/custom_systems/* "$ESDE_CUSTOM_DIR/" 2>/dev/null || true
                  echo "Copied custom ES-DE system definitions"
              fi

              # Set up RPCS3 config directory
              RPCS3_CONFIG_DIR="$HOME_DIR/.config/rpcs3"
              mkdir -p "$RPCS3_CONFIG_DIR/dev_flash/sys"

              # NOTE: PS3 firmware is NOT installed at startup. rpcs3 --installfw
              # opens a Qt GUI that hijacks the Wayland display, then crashes,
              # destroying the socket before ES-DE can launch.
              # Firmware installs on first PS3 game launch via RPCS3's own prompt.

              # PS4 game name resolution — generate named symlinks from param.sfo
              if [ -d "/Emulation/roms/ps4" ]; then
                  echo "Generating PS4 game shortcuts..."
                  generate-ps4-shortcuts.sh /Emulation/roms/ps4 /Emulation/storage/ps4-games
              fi

              # ── Virtual Controller (non-blocking) ─────────────────────────
              # Wolf-agent writes device signal files to /etc/wolf/devices/
              # when it receives PlugDeviceEvent via SSE. A background watcher
              # polls for those files and mknods devices into /dev/input/.
              # ES-DE launches immediately — controller appears when ready.
              mkdir -p /etc/wolf/devices /etc/wolf/devices/.done /dev/input 2>/dev/null || true

              # Background device watcher — uses Wolf's fake-udev for SDL2 detection
              # mknod alone is insufficient: SDL2/libudev needs netlink udev events
              # to discover new input devices. Wolf's fake-udev binary sends
              # NETLINK_KOBJECT_UEVENT messages that libudev picks up.
              (
                  FAKE_UDEV="/etc/wolf/fake-udev"

                  # Ensure /run/udev/control exists — libudev checks this to confirm
                  # udev is "running" before it listens for events
                  mkdir -p /run/udev/data 2>/dev/null || true
                  touch /run/udev/control 2>/dev/null || true
                  chmod 777 /run/udev/control 2>/dev/null || true
                  # Fix ownership so UID 1000 can write device database entries
                  chown -R 1000:1000 /run/udev 2>/dev/null || true

                  # Wait for fake-udev binary (copied by wolf container at startup)
                  echo "CONTROLLER: Waiting for fake-udev binary..."
                  FUDEV_WAIT=0
                  while [ ! -x "$FAKE_UDEV" ] && [ $FUDEV_WAIT -lt 30 ]; do
                      sleep 1
                      FUDEV_WAIT=$((FUDEV_WAIT + 1))
                  done
                  if [ -x "$FAKE_UDEV" ]; then
                      echo "CONTROLLER: fake-udev ready at $FAKE_UDEV"
                  else
                      echo "CONTROLLER: WARNING - fake-udev not found, falling back to udevadm"
                  fi

                  process_device_file() {
                      local sigfile="$1"
                      [ -f "$sigfile" ] || return 1
                      local devname major minor
                      devname=$(grep -o '"DEVNAME"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                      major=$(grep -o '"MAJOR"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                      minor=$(grep -o '"MINOR"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                      [ -z "$devname" ] || [ -z "$major" ] || [ -z "$minor" ] && return 1
                      case "$devname" in /dev/input/*) ;; *) return 0 ;; esac
                      if [ ! -e "$devname" ]; then
                          # Step 1: Create the device node
                          mknod "$devname" c "$major" "$minor" 2>/dev/null || true
                          chmod 666 "$devname" 2>/dev/null || true
                          echo "CONTROLLER: Created $devname (major=$major, minor=$minor)"

                          # Step 2: Create udev hwdb entry so libudev can look up device properties
                          local udev_db="/run/udev/data/c${major}:${minor}"
                          {
                              echo "E:ID_INPUT=1"
                              echo "E:ID_INPUT_JOYSTICK=1"
                              echo "E:ID_BUS=usb"
                              echo "G:input"
                          } > "$udev_db" 2>/dev/null || true

                          # Step 3: Send netlink udev event via fake-udev
                          if [ -x "$FAKE_UDEV" ]; then
                              # Construct null-separated KEY=VALUE message from signal JSON
                              # Strip leading /dev/ from DEVNAME for the udev event (udev convention)
                              local udev_devname="${devname#/dev/}"
                              local devpath action subsystem seqnum
                              devpath=$(grep -o '"DEVPATH"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                              action=$(grep -o '"ACTION"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                              subsystem=$(grep -o '"SUBSYSTEM"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                              seqnum=$(grep -o '"SEQNUM"[[:space:]]*:[[:space:]]*"[^"]*"' "$sigfile" | head -1 | sed 's/.*: *"//;s/"$//')
                              # Use defaults for missing optional fields
                              action="${action:-add}"
                              subsystem="${subsystem:-input}"
                              devpath="${devpath:-/devices/virtual/input/${udev_devname}}"
                              seqnum="${seqnum:-$$}"

                              local udev_msg
                              udev_msg=$(printf "ACTION=%s\0DEVNAME=%s\0DEVPATH=%s\0SUBSYSTEM=%s\0MAJOR=%s\0MINOR=%s\0SEQNUM=%s\0ID_INPUT=1\0ID_INPUT_JOYSTICK=1\0" \
                                  "$action" "$udev_devname" "$devpath" "$subsystem" "$major" "$minor" "$seqnum" | base64 -w0)

                              "$FAKE_UDEV" -m "$udev_msg" 2>/dev/null && \
                                  echo "CONTROLLER: fake-udev event sent for $devname" || \
                                  echo "CONTROLLER: fake-udev failed for $devname"
                          else
                              # Fallback: try udevadm (won't work for virtual devices but log it)
                              udevadm trigger --subsystem-match=input --action=add 2>/dev/null || true
                              echo "CONTROLLER: udevadm trigger fallback for $devname"
                          fi
                      fi
                      # Move processed signal file to .done/ to prevent re-processing
                      mv "$sigfile" /etc/wolf/devices/.done/ 2>/dev/null || true
                  }
                  while true; do
                      for f in /etc/wolf/devices/*.json; do
                          [ -f "$f" ] && process_device_file "$f"
                      done
                      sleep 5
                  done
              ) &

              echo "Launching ES-DE frontend..."
              exec es-de --resolution 1920 1080
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: roms
              mountPath: /Emulation/roms
              readOnly: true
            - name: saves
              mountPath: /Emulation/saves
            - name: bios
              mountPath: /Emulation/bios
              readOnly: true
            - name: esde-storage
              mountPath: /Emulation/storage
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: true

      volumes:
        - name: roms
          persistentVolumeClaim:
            claimName: fenrir-games
        - name: saves
          persistentVolumeClaim:
            claimName: fenrir-saves
        - name: bios
          persistentVolumeClaim:
            claimName: fenrir-bios
        - name: esde-storage
          persistentVolumeClaim:
            claimName: fenrir-config

      restartPolicy: Always
