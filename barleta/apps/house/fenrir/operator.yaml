# Fenrir Operator - Wolf Kubernetes Controller
# Manages game streaming sessions on Kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fenrir-operator
  namespace: house
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fenrir-operator
rules:
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["apps", "sessions", "pairings", "users", "sessions/status"]
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      ["pods", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes", "udproutes"]
    verbs: ["*"]
  # Required for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fenrir-operator
subjects:
  - kind: ServiceAccount
    name: fenrir-operator
    namespace: house
roleRef:
  kind: ClusterRole
  name: fenrir-operator
  apiGroup: rbac.authorization.k8s.io
---
# Namespace-scoped Role for leader election leases
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fenrir-leader-election
  namespace: house
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fenrir-leader-election
  namespace: house
subjects:
  - kind: ServiceAccount
    name: fenrir-operator
    namespace: house
roleRef:
  kind: Role
  name: fenrir-leader-election
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenrir-operator
  namespace: house
  labels:
    app: fenrir-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fenrir-operator
  template:
    metadata:
      labels:
        app: fenrir-operator
    spec:
      serviceAccountName: fenrir-operator
      containers:
        - name: operator
          # Operator with /run/udev mount for SDL2 joystick hotplug detection
          image: ghcr.io/jefflouisma/fenrir-operator:23c9c08
          imagePullPolicy: Always
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WOLF_IMAGE
              # Wolf with EGL fence error handling fix (cd4d8e7 in gst-wayland-display)
              value: ghcr.io/jefflouisma/fenrir-wolf:23c9c08
            - name: IMAGE_PULL_SECRET
              value: ghcr-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
