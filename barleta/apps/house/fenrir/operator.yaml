# Fenrir Operator - Wolf Kubernetes Controller
# Manages game streaming sessions on Kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fenrir-operator
  namespace: house
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fenrir-operator
rules:
  - apiGroups: ["direwolf.games-on-whales.github.io"]
    resources: ["apps", "sessions", "pairings", "users"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes", "udproutes"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fenrir-operator
subjects:
  - kind: ServiceAccount
    name: fenrir-operator
    namespace: house
roleRef:
  kind: ClusterRole
  name: fenrir-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fenrir-operator
  namespace: house
  labels:
    app: fenrir-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fenrir-operator
  template:
    metadata:
      labels:
        app: fenrir-operator
    spec:
      serviceAccountName: fenrir-operator
      containers:
        - name: operator
          # Custom-built Fenrir operator image
          image: ghcr.io/jefflouisma/fenrir-operator:latest
          imagePullPolicy: Always
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
