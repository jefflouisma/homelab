# Moonlight Proxy - Entry point for Moonlight clients
# Handles pairing, app lists, and session orchestration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moonlight-proxy-config
  namespace: house
data:
  config.yaml: |
    # Moonlight Proxy Configuration
    server:
      httpPort: 47989
      httpsPort: 47984

    # Kubernetes integration
    kubernetes:
      namespace: house
      sessionCRD: sessions.wolf.games-on-whales.io
      appCRD: apps.wolf.games-on-whales.io
      pairingCRD: pairings.wolf.games-on-whales.io

    # TLS configuration
    tls:
      certFile: /etc/moonlight/tls.crt
      keyFile: /etc/moonlight/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonlight-proxy
  namespace: house
  labels:
    app: moonlight-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moonlight-proxy
  template:
    metadata:
      labels:
        app: moonlight-proxy
    spec:
      serviceAccountName: fenrir-operator
      containers:
        - name: moonlight-proxy
          # Custom-built moonlight-proxy image
          image: ghcr.io/jefflouisma/fenrir-moonlight-proxy:2a4ddde
          imagePullPolicy: Always
          ports:
            - containerPort: 47984
              name: https
            - containerPort: 47989
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/moonlight-config
            - name: tls
              mountPath: /etc/moonlight-tls
              readOnly: true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_PATH
              value: /etc/moonlight-config/config.yaml
            - name: TLS_CERT_FILE
              value: /etc/moonlight-tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/moonlight-tls/tls.key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: moonlight-proxy-config
        - name: tls
          secret:
            secretName: moonlight-tls
---
apiVersion: v1
kind: Service
metadata:
  name: moonlight-proxy
  namespace: house
  annotations:
    # Allow sessions to share this LoadBalancer IP so clients can reach RTSP
    # ports on the same IP they connect to for pairing/serverinfo
    # Key must match operator's --lb-sharing-key (defaults to POD_NAMESPACE)
    metallb.universe.tf/allow-shared-ip: house
    lbipam.cilium.io/sharing-key: house
spec:
  type: LoadBalancer
  selector:
    app: moonlight-proxy
  ports:
    - name: https
      port: 47984
      targetPort: 47984
    - name: http
      port: 47989
      targetPort: 47989
---
# Self-signed certificate for Moonlight pairing
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: moonlight-tls
  namespace: house
spec:
  secretName: moonlight-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: moonlight.barleta.local
  dnsNames:
    - moonlight.barleta.local
  ipAddresses:
    - "192.168.1.220"
