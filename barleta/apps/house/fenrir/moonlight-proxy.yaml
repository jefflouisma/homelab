# Moonlight Proxy - Entry point for Moonlight clients
# Handles pairing, app lists, and session orchestration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moonlight-proxy-config
  namespace: house
data:
  config.yaml: |
    # Moonlight Proxy Configuration
    server:
      httpPort: 47989
      httpsPort: 47984
    
    # Kubernetes integration
    kubernetes:
      namespace: house
      sessionCRD: sessions.wolf.games-on-whales.io
      appCRD: apps.wolf.games-on-whales.io
      pairingCRD: pairings.wolf.games-on-whales.io
    
    # TLS configuration
    tls:
      certFile: /etc/moonlight/tls.crt
      keyFile: /etc/moonlight/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonlight-proxy
  namespace: house
  labels:
    app: moonlight-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moonlight-proxy
  template:
    metadata:
      labels:
        app: moonlight-proxy
    spec:
      serviceAccountName: fenrir-operator
      containers:
        - name: moonlight-proxy
          # TODO: Build and push custom proxy image
          image: ghcr.io/games-on-whales/moonlight-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 47984
              name: https
            - containerPort: 47989
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/moonlight/config.yaml
              subPath: config.yaml
            - name: tls
              mountPath: /etc/moonlight
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: moonlight-proxy-config
        - name: tls
          secret:
            secretName: moonlight-tls
---
apiVersion: v1
kind: Service
metadata:
  name: moonlight-proxy
  namespace: house
spec:
  type: LoadBalancer
  selector:
    app: moonlight-proxy
  ports:
    - name: https
      port: 47984
      targetPort: 47984
    - name: http
      port: 47989
      targetPort: 47989
---
