# Fenrir Game Applications
# Apps for Moonlight clients using the Direwolf API
---
# RetroArch multi-system emulator
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: retroarch
  namespace: house
spec:
  id: 1
  title: "RetroArch"
  isHDRSupported: false
  wolfConfig:
    startVirtualCompositor: true
    startAudioServer: true
    runner:
      type: process
      runCommand: "sleep infinity"
  # Minimal 1x1 transparent WebP placeholder (base64)
  appAssetWebP: "UklGRlAAAABXRUJQVlA4IEQAAADwAQCdASoBAAEAAkA4JZQCdAEO/hOMAAD+9f/e/fn3/vf+7/3v/e/94AAAAAAA"
  template:
    spec:
      # Fix permissions on saves volume for UID 1000 (Dolphin needs to create User dirs)
      initContainers:
        - name: fix-saves-permissions
          image: busybox
          command: ['sh', '-c', 'chown -R 1000:1000 /saves && chmod -R 755 /saves']
          volumeMounts:
            - name: saves
              mountPath: /saves
          securityContext:
            runAsUser: 0
      containers:
        # Only app container - operator adds wolf, pulseaudio, wolf-agent
        - name: retroarch
          # RetroArch with Wolf X-Box autoconfig profile for controller support
          image: ghcr.io/jefflouisma/fenrir-retroarch:f633cbd
          command:
            - /bin/bash
            - -c
            - |
              set -e
              RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/.X11-unix}"
              export XDG_RUNTIME_DIR="$RUNTIME_DIR"
              mkdir -p "$RUNTIME_DIR"
              chmod 700 "$RUNTIME_DIR" 2>/dev/null || true

              PULSE_COOKIE_PATH="${RUNTIME_DIR}/.config/pulse/cookie"
              export PULSE_COOKIE="$PULSE_COOKIE_PATH"
              HOME_DIR="/tmp"
              mkdir -p "$HOME_DIR"
              export HOME="$HOME_DIR"
              if [ -r "$PULSE_COOKIE_PATH" ]; then
                  mkdir -p "$HOME_DIR/.config/pulse"
                  cp -f "$PULSE_COOKIE_PATH" "$HOME_DIR/.config/pulse/cookie" || true
                  chmod 600 "$HOME_DIR/.config/pulse/cookie" 2>/dev/null || true
              fi

              export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-wayland}"
              # Handle both relative (wayland-0) and absolute (/tmp/.X11-unix/wayland-1) paths
              WAYLAND_DISPLAY_VAL="${WAYLAND_DISPLAY:-wayland-0}"
              if [[ "$WAYLAND_DISPLAY_VAL" = /* ]]; then
                  WAYLAND_SOCKET="$WAYLAND_DISPLAY_VAL"
              else
                  WAYLAND_SOCKET="${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY_VAL}"
              fi
              echo "Waiting for Wayland display at ${WAYLAND_SOCKET}..."
              TIMEOUT=30
              WAITED=0
              while [ ! -S "${WAYLAND_SOCKET}" ] && [ $WAITED -lt $TIMEOUT ]; do
                  sleep 1
                  WAITED=$((WAITED + 1))
                  echo "Waiting for wayland socket... ($WAITED/$TIMEOUT)"
              done

              if [ ! -S "${WAYLAND_SOCKET}" ]; then
                  echo "ERROR: Wayland display not available after ${TIMEOUT}s"
                  exit 1
              fi

              PULSE_SOCKET="${XDG_RUNTIME_DIR}/pulse-socket"
              echo "Waiting for PulseAudio socket at ${PULSE_SOCKET}..."
              TIMEOUT=30
              WAITED=0
              while [ ! -S "${PULSE_SOCKET}" ] && [ $WAITED -lt $TIMEOUT ]; do
                  sleep 1
                  WAITED=$((WAITED + 1))
                  echo "Waiting for pulse socket... ($WAITED/$TIMEOUT)"
              done

              if [ ! -S "${PULSE_SOCKET}" ]; then
                  echo "ERROR: PulseAudio socket not available after ${TIMEOUT}s"
                  exit 1
              fi

              export PULSE_SERVER="${PULSE_SERVER:-unix:${PULSE_SOCKET}}"
              PULSE_SINK_NAME="$(pactl list sinks short 2>/dev/null | awk '$2 ~ /^virtual_sink/ {print $2; exit}')"
              if [ -n "${PULSE_SINK_NAME}" ]; then
                  export PULSE_SINK="${PULSE_SINK_NAME}"
                  export PULSE_SOURCE="${PULSE_SINK_NAME}.monitor"
                  pactl set-default-sink "${PULSE_SINK_NAME}" || true
                  pactl set-default-source "${PULSE_SINK_NAME}.monitor" || true
                  echo "Using PulseAudio sink ${PULSE_SINK_NAME}"
              else
                  echo "WARN: No virtual_sink found; using default PulseAudio sink"
              fi

              echo "Wayland display ready, launching RetroArch..."
              if [ ! -f /config/retroarch.cfg ]; then
                  cp /config-template/retroarch.cfg /config/retroarch.cfg
              fi
              chmod u+rw /config/retroarch.cfg
              exec retroarch --config /config/retroarch.cfg
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: retroarch-config
              mountPath: /config
            - name: retroarch-config-template
              mountPath: /config-template/retroarch.cfg
              subPath: retroarch.cfg
            - name: roms
              mountPath: /roms
              readOnly: true
            - name: saves
              mountPath: /saves
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: true

      volumes:
        - name: retroarch-config
          emptyDir: {}
        - name: retroarch-config-template
          configMap:
            name: retroarch-config
        - name: roms
          persistentVolumeClaim:
            claimName: fenrir-games
        - name: saves
          persistentVolumeClaim:
            claimName: fenrir-saves

      restartPolicy: Always
---
# Wolf config for session pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-session-config
  namespace: house
data:
  wolf.conf: |
    # Wolf configuration for game streaming
    [server]
    port = 47989
    https_port = 47984

    [encoder]
    # Use software encoder if no GPU
    encoder = nvenc
    fallback_encoder = vaapi

    [display]
    width = 1920
    height = 1080
    fps = 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retroarch-config
  namespace: house
data:
  retroarch.cfg: |
    # RetroArch Configuration for Fenrir/Wolf Streaming
    # Optimized for game streaming via Moonlight

    # Video settings - Wayland + Vulkan for NVIDIA
    video_driver = "vulkan"
    video_context_driver = "wayland"
    video_fullscreen = "true"
    video_vsync = "true"
    video_frame_delay = "0"

    # Let compositor control resolution (adapts to Moonlight client)
    video_windowed_fullscreen = "true"

    # Audio settings for PulseAudio streaming
    audio_driver = "pulse"
    audio_latency = "64"
    audio_sync = "true"

    # Input settings - SDL2 for reliable controller input
    # linuxraw has KNOWN BUG where devices detected but input doesn't register (libretro/RetroArch#16767)
    # SDL2 properly handles input events and works with virtual controllers
    input_driver = "sdl2"
    input_autodetect_enable = "true"
    input_joypad_driver = "sdl2"
    # Point to autoconfig dir containing Wolf Xbox controller profile
    joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
    gamemode_enable = "false"

    # Save directories
    savefile_directory = "/saves"
    savestate_directory = "/saves/states"
    screenshot_directory = "/screenshots"

    # System/BIOS directory (Dolphin Sys folder baked into image here)
    system_directory = "/usr/share/retroarch/system"

    # Content directories
    rgui_browser_directory = "/roms"

    # Core/Library paths (required for cores to be visible)
    libretro_directory = "/usr/lib/libretro"
    libretro_info_path = "/usr/share/retroarch/info"

    # Database for content scanning
    content_database_path = "/usr/share/retroarch/database/rdb"
    playlist_directory = "/config/playlists"

    # Auto-load core overrides and configs
    auto_overrides_enable = "true"
    auto_remaps_enable = "true"
    
    # When loading content, automatically select matching core
    load_dummy_on_core_retro = "false"
    
    # Menu settings
    menu_driver = "ozone"
    menu_show_online_updater = "false"
    menu_show_core_updater = "false"

    # UI Scaling (DPI-based, responsive to screen size)
    menu_scale_factor = "1.0"
    video_windowed_fullscreen = "true"

    # Disable analytics
    analytics_enabled = "false"

    # Wayland/GPU compatibility
    video_shared_context = "false"
    driver_switch_enable = "false"
    # Vulkan works with PSP (Dolphin has separate compatibility issues)
    video_driver = "vulkan"

    # Logging - enabled for Grafana/Loki debugging
    log_verbosity = "true"
    log_to_file = "false"


