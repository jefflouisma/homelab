# Fenrir Game Applications
# Apps for Moonlight clients using the Direwolf API
---
# RetroArch multi-system emulator
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: retroarch
  namespace: house
spec:
  id: 1
  title: "RetroArch"
  isHDRSupported: false
  # Minimal 1x1 transparent WebP placeholder (base64)
  appAssetWebP: "UklGRlAAAABXRUJQVlA4IEQAAADwAQCdASoBAAEAAkA4JZQCdAEO/hOMAAD+9f/e/fn3/vf+7/3v/e/94AAAAAAA"
  template:
    spec:
      containers:
        # Only app container - operator adds wolf, pulseaudio, wolf-agent
        - name: retroarch
          image: ghcr.io/jefflouisma/fenrir-retroarch:latest
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      
      restartPolicy: Always
---
# Wolf config for session pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: wolf-session-config
  namespace: house
data:
  wolf.conf: |
    # Wolf configuration for game streaming
    [server]
    port = 47989
    https_port = 47984
    
    [encoder]
    # Use software encoder if no GPU
    encoder = nvenc
    fallback_encoder = vaapi
    
    [display]
    width = 1920
    height = 1080
    fps = 60
