# Fenrir CRDs - Wolf Kubernetes Operator
# Custom Resource Definitions for managing game streaming sessions
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.wolf.games-on-whales.io
spec:
  group: wolf.games-on-whales.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                image:
                  type: string
                cmd:
                  type: array
                  items:
                    type: string
                gpu:
                  type: boolean
                audio:
                  type: boolean
                volumes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      hostPath:
                        type: string
                      mountPath:
                        type: string
  scope: Namespaced
  names:
    plural: apps
    singular: app
    kind: App
    shortNames:
      - wolfapp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.wolf.games-on-whales.io
spec:
  group: wolf.games-on-whales.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                app:
                  type: string
                user:
                  type: string
                pairing:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                rtspUrl:
                  type: string
                podName:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: sessions
    singular: session
    kind: Session
    shortNames:
      - wolfsession
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pairings.wolf.games-on-whales.io
spec:
  group: wolf.games-on-whales.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clientCertFingerprint:
                  type: string
                user:
                  type: string
                deviceName:
                  type: string
  scope: Namespaced
  names:
    plural: pairings
    singular: pairing
    kind: Pairing
    shortNames:
      - wolfpairing
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.wolf.games-on-whales.io
spec:
  group: wolf.games-on-whales.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                email:
                  type: string
  scope: Namespaced
  names:
    plural: users
    singular: user
    kind: User
    shortNames:
      - wolfuser
