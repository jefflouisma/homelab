# RetroArch Configuration
# Optimized for game streaming via Moonlight

# Video Settings
video_driver = "vulkan"
video_fullscreen = "true"
video_vsync = "true"
video_max_swapchain_images = "2"
video_frame_delay = "0"
video_scale_integer = "false"
video_smooth = "true"
video_font_size = "32"
video_msg_pos_x = "0.05"
video_msg_pos_y = "0.95"

# Audio Settings
audio_driver = "pulse"
audio_latency = "64"
audio_sync = "true"

# Input Settings - Controller Optimized
input_driver = "udev"
input_joypad_driver = "udev"
input_max_users = "4"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "6"

# Player 1 Controls (Xbox-style layout)
input_player1_joypad_index = "0"
input_player1_a_btn = "1"
input_player1_b_btn = "0"
input_player1_x_btn = "3"
input_player1_y_btn = "2"
input_player1_start_btn = "7"
input_player1_select_btn = "6"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_axis = "+2"
input_player1_r2_axis = "+5"
input_player1_l3_btn = "8"
input_player1_r3_btn = "9"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+3"
input_player1_r_x_minus_axis = "-3"
input_player1_r_y_plus_axis = "+4"
input_player1_r_y_minus_axis = "-4"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"

# Menu Settings
menu_driver = "ozone"
menu_show_sublabels = "true"
menu_show_core_updater = "true"
menu_show_load_core = "true"
menu_show_load_content = "true"
menu_show_configurations = "true"
menu_show_help = "false"
menu_show_quit_retroarch = "true"
menu_show_restart_retroarch = "true"
menu_show_reboot = "false"
menu_show_shutdown = "false"
menu_swap_ok_cancel_buttons = "false"
menu_pointer_enable = "false"
menu_mouse_enable = "false"

# Core/Path Settings
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/retroarch/assets"
savefile_directory = "/saves/retroarch/saves"
savestate_directory = "/saves/retroarch/states"
screenshot_directory = "/saves/retroarch/screenshots"
system_directory = "/config/retroarch/system"

# Network Settings
network_cmd_enable = "false"
network_cmd_port = "55355"
