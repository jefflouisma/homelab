# RetroArch Configuration for Fenrir/Wolf Streaming
# Optimized for game streaming via Moonlight

# Video settings - use Vulkan for best performance
video_driver = "vulkan"
video_fullscreen = "true"
video_vsync = "true"
video_max_swapchain_images = "2"
video_frame_delay = "0"

# Use 1080p by default (streaming resolution)
video_fullscreen_x = "1920"
video_fullscreen_y = "1080"

# Audio settings for PulseAudio streaming
audio_driver = "pulse"
audio_latency = "64"
audio_sync = "true"

# Input settings
input_autodetect_enable = "true"
input_joypad_driver = "udev"

# Save directories
savefile_directory = "/saves"
savestate_directory = "/saves/states"
screenshot_directory = "/screenshots"

# System/BIOS directory
system_directory = "/roms/system"

# Content directories
rgui_browser_directory = "/roms"

# Menu settings
menu_driver = "ozone"
menu_show_online_updater = "false"
menu_show_core_updater = "false"

# Disable analytics
analytics_enabled = "false"

# Logging
log_verbosity = "false"
