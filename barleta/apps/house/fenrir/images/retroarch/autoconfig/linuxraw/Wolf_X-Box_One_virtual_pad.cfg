# Wolf X-Box One (virtual) pad - linuxraw autoconfig for RetroArch
# Based on official Xbox Wireless Controller profile from libretro
# https://github.com/libretro/retroarch-joypad-autoconfig/blob/master/linuxraw/Xbox%20Wireless%20Controller.cfg

input_driver = "linuxraw"
input_device = "Wolf X-Box One (virtual) pad"
input_device_display_name = "Wolf Virtual Xbox Controller"

# Face buttons - Xbox layout
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "4"

# Shoulder buttons
input_l_btn = "6"
input_r_btn = "7"

# Start/Select
input_select_btn = "10"
input_start_btn = "11"

# Stick clicks
input_l3_btn = "13"
input_r3_btn = "14"

# D-pad (as axes, not hat buttons)
input_up_axis = "-7"
input_down_axis = "+7"
input_left_axis = "-6"
input_right_axis = "+6"

# Analog sticks
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Triggers (as axes)
input_l2_axis = "+5"
input_r2_axis = "+4"

# Labels
input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "Left Bumper"
input_r_btn_label = "Right Bumper"
input_select_btn_label = "Back"
input_start_btn_label = "Start"
input_l3_btn_label = "Left Thumb"
input_r3_btn_label = "Right Thumb"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_l2_axis_label = "Left Trigger"
input_r2_axis_label = "Right Trigger"
