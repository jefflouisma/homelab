# Cove TV shell. Fenrir mounts a separate persistent per-user profile.
apiVersion: direwolf.games-on-whales.github.io/v1alpha1
kind: App
metadata:
  name: cove
  namespace: house
spec:
  id: 4
  title: Cove
  isHDRSupported: false
  wolfConfig:
    startVirtualCompositor: true
    startAudioServer: true
    runner:
      type: process
      runCommand: sleep infinity
  appAssetWebP: 
  template:
    spec:
      securityContext:
        supplementalGroups:
        - 996
      initContainers:
      - name: remote-input
        image: ghcr.io/jefflouisma/fenrir-cove:5c8251c
        restartPolicy: Always
        command:
        - python3
        - -u
        - /usr/local/lib/fenrir/init-remote-pointer.py
        env:
        - name: DISPLAY
          value: :0
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: wolf-cfg
          mountPath: /etc/wolf
          readOnly: true
        - name: wolf-runtime
          mountPath: /tmp/.X11-unix
          readOnly: true
      containers:
      - name: cove
        image: ghcr.io/jefflouisma/fenrir-cove:5c8251c
        command:
        - /usr/local/bin/start-cove
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '6'
            memory: 8Gi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          privileged: true
      restartPolicy: Always
