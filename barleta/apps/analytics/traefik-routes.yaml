---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airflow
  namespace: analytics
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`airflow.barleta.local`)
      kind: Rule
      services:
        - name: airflow-webserver
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: superset
  namespace: analytics
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`superset.barleta.local`)
      kind: Rule
      services:
        - name: superset
          port: 8088
