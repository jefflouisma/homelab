---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uci-data-loader
  namespace: analytics
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: loader
              image: ghcr.io/jefflouisma/uci-data-loader:772ffcf
              env:
                - name: PGHOST
                  value: postgresql.identity.svc.cluster.local
                - name: PGUSER
                  value: analytics
                - name: PGPASSWORD
                  value: Analytics2024!
                - name: PGDATABASE
                  value: midpoint
