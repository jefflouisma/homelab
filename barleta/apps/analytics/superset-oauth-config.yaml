---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: analytics
data:
  superset_config.py: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    
    # Superset specific config
    ROW_LIMIT = 5000
    SECRET_KEY = os.environ.get('SUPERSET_SECRET_KEY', 'SupersetBarleta2024SecretKeyLongEnough!')
    SQLALCHEMY_DATABASE_URI = os.environ.get('SQLALCHEMY_DATABASE_URI', 'postgresql://superset:Superset2024!@postgresql.identity.svc.cluster.local:5432/superset')
    
    # Flask-WTF flag for CSRF
    WTF_CSRF_ENABLED = True
    WTF_CSRF_EXEMPT_LIST = []
    WTF_CSRF_TIME_LIMIT = 60 * 60 * 24 * 365
    
    # OAuth Configuration
    AUTH_TYPE = AUTH_OAUTH
    
    OAUTH_PROVIDERS = [
        {
            'name': 'keycloak',
            'icon': 'fa-key',
            'token_key': 'access_token',
            'remote_app': {
                'client_id': 'superset',
                'client_secret': 'bn7Ueb6QmyBMtHwByabmCUHHvDEpBwJi',
                'api_base_url': 'http://keycloak.identity.svc.cluster.local:8080/realms/barleta/protocol/openid-connect/',
                'access_token_url': 'http://keycloak.identity.svc.cluster.local:8080/realms/barleta/protocol/openid-connect/token',
                'authorize_url': 'http://keycloak.barleta.local:31665/realms/barleta/protocol/openid-connect/auth',
                'userinfo_endpoint': 'http://keycloak.identity.svc.cluster.local:8080/realms/barleta/protocol/openid-connect/userinfo',
                'client_kwargs': {
                    'scope': 'openid email profile'
                },
            }
        }
    ]
    
    # Will allow user self registration
    AUTH_USER_REGISTRATION = True
    
    # The default user self registration role
    AUTH_USER_REGISTRATION_ROLE = "Gamma"
    
    # Map Keycloak roles to Superset roles
    AUTH_ROLE_ADMIN = 'Admin'
    AUTH_ROLE_PUBLIC = 'Public'
    
    # Custom security manager for Keycloak
    from superset.security import SupersetSecurityManager
    
    class CustomSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == 'keycloak':
                me = self.appbuilder.sm.oauth_remotes[provider].get('userinfo')
                me_json = me.json()
                return {
                    'username': me_json.get('preferred_username', ''),
                    'email': me_json.get('email', ''),
                    'first_name': me_json.get('given_name', ''),
                    'last_name': me_json.get('family_name', ''),
                }
            return {}
    
    CUSTOM_SECURITY_MANAGER = CustomSecurityManager
