---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: analytics
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "lKgHitWGLWXoLXV7vbM27C6oPiLDFYOE"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: analytics
data:
  grafana.ini: |
    [server]
    root_url = http://grafana.barleta.local:31664
    
    [auth]
    disable_login_form = false
    
    [auth.generic_oauth]
    enabled = true
    name = Keycloak
    allow_sign_up = true
    client_id = grafana
    scopes = openid profile email
    auth_url = http://keycloak.barleta.local:31664/realms/barleta/protocol/openid-connect/auth
    token_url = http://keycloak.identity.svc.cluster.local:8080/realms/barleta/protocol/openid-connect/token
    api_url = http://keycloak.identity.svc.cluster.local:8080/realms/barleta/protocol/openid-connect/userinfo
    role_attribute_path = contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || 'Viewer'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-house
              mountPath: /var/lib/grafana/dashboards/house
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
        - name: grafana-storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards-house
          configMap:
            name: grafana-dashboards-house
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: analytics
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31664
  type: NodePort
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: analytics
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.barleta.local`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
