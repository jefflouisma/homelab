apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-userspace-libs
  namespace: kube-system
  labels:
    app: nvidia-userspace-libs
spec:
  selector:
    matchLabels:
      app: nvidia-userspace-libs
  template:
    metadata:
      labels:
        app: nvidia-userspace-libs
    spec:
      hostPID: true
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
          limits:
            cpu: 10m
            memory: 10Mi
      initContainers:
      - name: install-nvidia-libs
        image: ubuntu:22.04
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          set -e
          echo "=== Installing NVIDIA User-Space Libraries ==="
          
          # Check if nvidia module is loaded
          if ! grep -q "^nvidia " /proc/modules; then
            echo "NVIDIA module not loaded, skipping library installation"
            exit 0
          fi
          
          # Check if libraries already installed
          if [ -f /host-lib/libnvidia-glcore.so.580.119.02 ]; then
            echo "Libraries already installed"
            exit 0
          fi
          
          # Install dependencies
          apt-get update && apt-get install -y wget libarchive-tools
          
          # Download the NVIDIA driver package
          DRIVER_VERSION="580.119.02"
          DRIVER_URL="https://download.nvidia.com/XFree86/Linux-x86_64/${DRIVER_VERSION}/NVIDIA-Linux-x86_64-${DRIVER_VERSION}.run"
          
          echo "Downloading NVIDIA driver..."
          wget -q "$DRIVER_URL" -O /tmp/nvidia-driver.run
          chmod +x /tmp/nvidia-driver.run
          
          echo "Extracting libraries..."
          /tmp/nvidia-driver.run --extract-only --target /tmp/nvidia
          
          # Copy ALL user-space libraries (not kernel modules)
          echo "Installing ALL libraries to host..."
          DRIVER_VERSION="580.119.02"
          
          # Copy all .so files from extracted driver
          for lib in /tmp/nvidia/*.so.*; do
            if [ -f "$lib" ]; then
              cp -v "$lib" /host-lib/ 2>/dev/null || true
            fi
          done
          
          # Also copy .so files without version suffix
          for lib in /tmp/nvidia/*.so; do
            if [ -f "$lib" ]; then
              cp -v "$lib" /host-lib/ 2>/dev/null || true
            fi
          done
          
          # Create critical symlinks
          cd /host-lib
          ln -sf libEGL_nvidia.so.${DRIVER_VERSION} libEGL_nvidia.so.0
          ln -sf libGLESv2_nvidia.so.${DRIVER_VERSION} libGLESv2_nvidia.so.2
          ln -sf libGLX_nvidia.so.${DRIVER_VERSION} libGLX_nvidia.so.0
          ln -sf libcuda.so.${DRIVER_VERSION} libcuda.so.1
          ln -sf libcuda.so.1 libcuda.so
          ln -sf libnvidia-ml.so.${DRIVER_VERSION} libnvidia-ml.so.1
          ln -sf libnvidia-ml.so.1 libnvidia-ml.so
          ln -sf libnvcuvid.so.${DRIVER_VERSION} libnvcuvid.so.1
          ln -sf libnvcuvid.so.1 libnvcuvid.so
          ln -sf libnvidia-encode.so.${DRIVER_VERSION} libnvidia-encode.so.1
          ln -sf libnvidia-encode.so.1 libnvidia-encode.so
          
          # === Load nvidia-uvm kernel module for CUDA support ===
          echo "=== Loading nvidia-uvm kernel module ==="
          if ! grep -q "^nvidia_uvm " /proc/modules; then
            # Find nvidia-uvm.ko in extracted driver (can be in kernel/ or kernel-open/)
            UVM_KO=$(find /tmp/nvidia -name 'nvidia-uvm.ko' 2>/dev/null | head -1)
            if [ -n "$UVM_KO" ]; then
              echo "Found nvidia-uvm.ko at: $UVM_KO"
              # Copy to host for persistence
              cp -v "$UVM_KO" /host-lib/nvidia-uvm.ko
              # Load module into host kernel using nsenter
              nsenter -t 1 -m -u -i -n insmod /var/lib/nvidia-userspace/nvidia-uvm.ko && echo "nvidia-uvm loaded successfully!" || echo "insmod failed (may already be loaded or version mismatch)"
              
              # Verify and create device nodes if loaded
              sleep 1
              if grep -q "nvidia_uvm" /proc/modules; then
                echo "nvidia-uvm module is now loaded!"
                # Get major number from /proc/devices
                MAJOR=$(nsenter -t 1 -m grep nvidia-uvm /proc/devices 2>/dev/null | awk '{print $1}')
                if [ -n "$MAJOR" ]; then
                  echo "Creating /dev/nvidia-uvm device nodes with major $MAJOR"
                  nsenter -t 1 -m mknod -m 666 /dev/nvidia-uvm c $MAJOR 0 2>/dev/null || true
                  nsenter -t 1 -m mknod -m 666 /dev/nvidia-uvm-tools c $MAJOR 1 2>/dev/null || true
                  nsenter -t 1 -m ls -la /dev/nvidia-uvm* 2>/dev/null || true
                fi
              else
                echo "WARNING: nvidia-uvm module did not load"
              fi
            else
              echo "WARNING: nvidia-uvm.ko not found in extracted driver"
              find /tmp/nvidia -name '*.ko' 2>/dev/null | head -10
            fi
          else
            echo "nvidia-uvm already loaded"
            nsenter -t 1 -m ls -la /dev/nvidia-uvm* 2>/dev/null || true
          fi
          
          # Create EGL vendor ICD file for NVIDIA
          cat > /host-lib/10_nvidia.json << 'EOFJ'
          {
              "file_format_version" : "1.0.0",
              "ICD" : {
                  "library_path" : "libEGL_nvidia.so.0"
              }
          }
          EOFJ
          
          # Create Vulkan ICD file
          cat > /host-lib/nvidia_icd.json << 'EOFV'
          {
              "file_format_version" : "1.0.0",
              "ICD": {
                  "library_path": "libGLX_nvidia.so.0",
                  "api_version" : "1.3"
              }
          }
          EOFV
          
          # Create libraries listing
          echo "=== Installed libraries ==="
          ls /host-lib/*.so* | wc -l
          ls /host-lib/libnvidia* | head -20
          
        volumeMounts:
        - name: host-lib
          mountPath: /host-lib
        - name: host-etc
          mountPath: /host-etc
        - name: host-root
          mountPath: /host-root
        - name: proc
          mountPath: /proc
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      volumes:
      - name: host-lib
        hostPath:
          path: /var/lib/nvidia-userspace
          type: DirectoryOrCreate
      - name: host-etc
        hostPath:
          path: /etc
      - name: host-root
        hostPath:
          path: /
      - name: proc
        hostPath:
          path: /proc
