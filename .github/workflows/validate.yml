name: Validate project

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      TMPDIR: /Volumes/4TB_Drive/tmp/fenrir-go
      GOTMPDIR: /Volumes/4TB_Drive/tmp/fenrir-go/build-tmp
      GOCACHE: /Volumes/4TB_Drive/tmp/fenrir-go/cache
      GOMODCACHE: /Volumes/4TB_Drive/tmp/fenrir-go/mod
    steps:
      - name: Prepare Go temporary drive path
        run: |
          sudo mkdir -p "$GOTMPDIR"
          sudo chown -R "$(id -u):$(id -g)" "$TMPDIR"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fenrir/go.mod
          cache-dependency-path: fenrir/go.sum
      - run: go test -race ./...
        working-directory: fenrir
      - run: go vet ./...
        working-directory: fenrir
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare temporary drive path
        run: |
          sudo mkdir -p /Volumes/4TB_Drive/tmp/homelab-rosefish
          sudo chown -R "$(id -u):$(id -g)" /Volumes/4TB_Drive/tmp
      - run: cargo fmt --check
        working-directory: moonlight-mcp
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: moonlight-mcp
      - run: cargo test --all-targets
        working-directory: moonlight-mcp
  manifests-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - uses: azure/setup-kubectl@v4
      - run: python scripts/validate-project.py
      - name: Test emulator profile initialization
        env:
          TMPDIR: /Volumes/4TB_Drive/tmp/homelab-rosefish
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo mkdir -p "$TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$TMPDIR"
          python -m unittest discover -s barleta/apps/house/fenrir/images/emudeck -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Cove remote input
        env:
          TMPDIR: /Volumes/4TB_Drive/tmp/homelab-cove-remote
        run: |
          sudo mkdir -p "$TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$TMPDIR"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
          COVE_DOCKERFILE=barleta/apps/house/fenrir/images/cove/Dockerfile
          COVE_VERSION=$(sed -n 's/^ARG COVE_VERSION=//p' "$COVE_DOCKERFILE")
          COVE_SHA256=$(sed -n 's/^ARG COVE_SHA256=//p' "$COVE_DOCKERFILE")
          curl -fLsS "https://github.com/coveninja/cove/releases/download/v${COVE_VERSION}/cove-linux-amd64.tar.gz" -o "$TMPDIR/cove.tar.gz"
          echo "$COVE_SHA256  $TMPDIR/cove.tar.gz" | sha256sum -c -
          mkdir -p "$TMPDIR/cove"
          tar -xzf "$TMPDIR/cove.tar.gz" -C "$TMPDIR/cove"
          bash barleta/apps/house/fenrir/images/cove/remote/build.sh "$TMPDIR/build" "$TMPDIR/cove/lib/cove/Cove/lib/app"
          python barleta/apps/house/fenrir/images/cove/remote/build-tv-back.py "$TMPDIR/cove/lib/cove/Cove/lib/app" "$TMPDIR/build"
          python barleta/apps/house/fenrir/images/cove/patch-remote-launcher.py "$TMPDIR/cove/lib/cove/Cove" \
            "$TMPDIR/build/cove-remote.jar" \
            "$TMPDIR/build/back/com/coveninja/cove/ui/platform/PlaybackBackHandler_desktopKt.class" "$TMPDIR/build/tv"
          COVE_REMOTE_INPUT=1 xvfb-run -a java -javaagent:"$TMPDIR/build/cove-remote.jar" \
            -cp "$TMPDIR/build/classes" games.fenrir.cove.RemoteGuiTest
          mkdir -p "$TMPDIR/runtime" "$TMPDIR/data"
          chmod 700 "$TMPDIR/runtime"
          COVE_REMOTE_INPUT=1 COVE_DATA_DIR="$TMPDIR/data" XDG_RUNTIME_DIR="$TMPDIR/runtime" \
            JAVA_TOOL_OPTIONS="-Dskiko.renderApi=SOFTWARE -Djava.io.tmpdir=$TMPDIR" \
            timeout 20s xvfb-run -a "$TMPDIR/cove/bin/cove" --backend-mode fixtures --tv --smoke-seconds 3
