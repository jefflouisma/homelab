name: Build Fenrir Cove
on:
  push:
    branches: [main]
    paths:
      - "barleta/apps/house/fenrir/images/cove/**"
      - ".github/workflows/fenrir-cove.yml"
  workflow_dispatch: {}
permissions:
  contents: write
  packages: write
concurrency:
  group: fenrir-cove-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build-and-update:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: barleta/apps/house/fenrir/images/cove
          tags: ghcr.io/jefflouisma/fenrir-cove:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=fenrir-cove
          cache-to: type=gha,mode=max,scope=fenrir-cove
      - name: Update app image when manifest exists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          TAG='${{ steps.vars.outputs.tag }}'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            MANIFEST=barleta/apps/house/fenrir/cove-app.yaml
            if [ ! -f "$MANIFEST" ]; then exit 0; fi
            sed -i -E "s|(ghcr.io/jefflouisma/fenrir-cove:)[^[:space:]]+|\1${TAG}|g" "$MANIFEST"
            git add "$MANIFEST"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(fenrir): bump Cove to ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
