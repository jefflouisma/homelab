name: Build nvidia-uvm.ko

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel version (e.g., 6.4.0-36-default)'
        required: true
        default: '6.4.0-36-default'
      driver_version:
        description: 'NVIDIA driver version'
        required: true
        default: '580.119.02'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nvidia-uvm-builder

jobs:
  build-uvm-module:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nvidia-uvm.ko
        run: |
          cd nvidia-driver-toolkit
          
          # Build the builder image
          docker build \
            --build-arg KERNEL_VERSION=${{ inputs.kernel_version }} \
            --build-arg DRIVER_VERSION=${{ inputs.driver_version }} \
            -f Dockerfile.uvm-builder \
            -t nvidia-uvm-builder:local \
            .
          
          # Extract the built modules
          mkdir -p ./output
          docker run --rm nvidia-uvm-builder:local tar -cf - -C /output . | tar -xf - -C ./output/
          
          echo "=== Built modules ==="
          ls -la ./output/
          
          # Verify nvidia-uvm.ko exists
          if [ -f "./output/nvidia-uvm.ko" ]; then
            echo "SUCCESS: nvidia-uvm.ko built successfully!"
            file ./output/nvidia-uvm.ko
          else
            echo "ERROR: nvidia-uvm.ko not found!"
            exit 1
          fi

      - name: Upload nvidia-uvm.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-modules-${{ inputs.kernel_version }}-${{ inputs.driver_version }}
          path: nvidia-driver-toolkit/output/*.ko
          retention-days: 90
