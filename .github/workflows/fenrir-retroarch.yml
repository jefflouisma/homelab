name: "Build Fenrir RetroArch"

on:
  push:
    branches: [main]
    paths:
      - "barleta/apps/house/fenrir/images/retroarch/**"
      - "barleta/apps/house/fenrir/images/emudeck/stream_scaling.py"
      - "barleta/apps/house/fenrir/images/emudeck/probe-core-options.py"
      - ".github/workflows/fenrir-retroarch.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: fenrir-retroarch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/push fenrir-retroarch
        uses: docker/build-push-action@v6
        with:
          context: barleta/apps/house/fenrir/images
          file: barleta/apps/house/fenrir/images/retroarch/Dockerfile
          tags: ghcr.io/jefflouisma/fenrir-retroarch:${{ steps.vars.outputs.tag }}
          push: true
          pull: true
          build-args: UPSTREAM_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=fenrir-retroarch
          cache-to: type=gha,mode=max,scope=fenrir-retroarch

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.vars.outputs.tag }}"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-retroarch:)[^[:space:]]+|${1}'"${TAG}"'|g' barleta/apps/house/fenrir/retroarch-apps.yaml
            git add barleta/apps/house/fenrir/retroarch-apps.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(fenrir): bump retroarch to ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          exit 1
