name: "Build Fenrir RetroArch"

on:
  push:
    branches: [main]
    paths:
      - "barleta/apps/house/fenrir/images/retroarch/**"
      - ".github/workflows/fenrir-retroarch.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: fenrir-retroarch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/push fenrir-retroarch
        uses: docker/build-push-action@v6
        with:
          context: barleta/apps/house/fenrir/images/retroarch
          file: barleta/apps/house/fenrir/images/retroarch/Dockerfile
          tags: ghcr.io/jefflouisma/fenrir-retroarch:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=fenrir-retroarch
          cache-to: type=gha,mode=max,scope=fenrir-retroarch

      - name: Update GitOps manifests
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-retroarch:)[^[:space:]]+|${1}'"${TAG}"'|g' barleta/apps/house/fenrir/apps.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barleta/apps/house/fenrir/apps.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(fenrir): bump retroarch to ${{ steps.vars.outputs.tag }}"
          git push
