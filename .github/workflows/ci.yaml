# CI/CD Pipeline for Homelab V2 (Multi-Environment)
#
# ARCHITECTURE:
# - Self-hosted runners on K3s clusters (deployed via manual bootstrap)
# - Runners have direct LAN access to OPNsense API
# - ArgoCD handles GitOps for Kubernetes apps (auto-sync on push)
# - Ansible handles OPNsense configuration changes
#
# ENVIRONMENTS:
# - HomePractice: Isolated sandbox behind OPNsense (runners: homepractice)
# - HomeProd: Production on home LAN (runners: homeprod)
#
# TRIGGER:
# - Push to main: Auto-deploy changed environments
# - Manual dispatch: Select environment and action

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - homepractice
          - homeprod
          - both
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy-apps'
        type: choice
        options:
          - deploy-apps
          - ansible-opnsense
          - ansible-full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANSIBLE_HOST_KEY_CHECKING: "false"
  ANSIBLE_STDOUT_CALLBACK: "yaml"

jobs:
  # ============================================================================
  # Detect Changes
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      homepractice: ${{ steps.filter.outputs.homepractice }}
      homeprod: ${{ steps.filter.outputs.homeprod }}
      modules: ${{ steps.filter.outputs.modules }}
      ansible_practice: ${{ steps.filter.outputs.ansible_practice }}
      ansible_prod: ${{ steps.filter.outputs.ansible_prod }}
      apps_practice: ${{ steps.filter.outputs.apps_practice }}
      apps_prod: ${{ steps.filter.outputs.apps_prod }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            homepractice:
              - 'homepractice/**'
            homeprod:
              - 'homeprod/**'
            modules:
              - 'modules/**'
            ansible_practice:
              - 'homepractice/ansible/**'
            ansible_prod:
              - 'homeprod/ansible/**'
            apps_practice:
              - 'homepractice/apps/**'
            apps_prod:
              - 'homeprod/apps/**'

  # ============================================================================
  # HomePractice Environment
  # ============================================================================
  deploy-practice:
    name: Deploy HomePractice
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.homepractice == 'true' || 
      needs.detect-changes.outputs.modules == 'true' || 
      github.event.inputs.environment == 'homepractice' || 
      github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homepractice]
    
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner environment
        run: |
          echo "🔍 Runner Environment Check"
          echo "Hostname: $(hostname)"
          echo "kubectl: $(command -v kubectl && kubectl version --client --short 2>/dev/null || echo 'not found')"
          echo "ansible: $(command -v ansible && ansible --version | head -1 || echo 'not found')"
          echo ""
          echo "🌐 Network connectivity to OPNsense LAN:"
          curl -sk --connect-timeout 5 https://10.10.10.1/api/core/firmware/status > /dev/null && echo "✅ OPNsense API reachable" || echo "❌ OPNsense API not reachable"

      - name: Validate Kubernetes manifests
        run: |
          echo "📋 Validating HomePractice Kubernetes manifests..."
          for f in $(find homepractice/apps/ -name '*.yaml' 2>/dev/null); do
            echo "  Checking: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 | grep -v "configured" || true
          done

      - name: Install Ansible
        if: |
          needs.detect-changes.outputs.ansible_practice == 'true' || 
          github.event.inputs.action == 'ansible-opnsense' || 
          github.event.inputs.action == 'ansible-full'
        run: |
          pip install --quiet ansible httpx
          ansible-galaxy collection install ansibleguy.opnsense --force

      - name: Run Ansible - OPNsense Configuration
        if: |
          needs.detect-changes.outputs.ansible_practice == 'true' || 
          github.event.inputs.action == 'ansible-opnsense' || 
          github.event.inputs.action == 'ansible-full'
        env:
          OPNSENSE_API_KEY: ${{ secrets.OPNSENSE_API_KEY }}
          OPNSENSE_API_SECRET: ${{ secrets.OPNSENSE_API_SECRET }}
        run: |
          echo "🔧 Running OPNsense configuration via API..."
          cd homepractice/ansible
          
          ansible-playbook playbooks/opnsense-configure.yml \
            -e "opnsense_api_key=${OPNSENSE_API_KEY}" \
            -e "opnsense_api_secret=${OPNSENSE_API_SECRET}" \
            -e "opnsense_api_host=10.10.10.1"

      - name: ArgoCD Sync Status
        run: |
          echo "🔄 HomePractice: ArgoCD will auto-sync app changes"
          echo "Commit: ${{ github.sha }}"
          echo ""
          if [ "${{ needs.detect-changes.outputs.apps_practice }}" == "true" ]; then
            echo "📦 App changes detected - ArgoCD will sync automatically"
          else
            echo "📦 No app changes - ArgoCD sync not triggered"
          fi

  # ============================================================================
  # HomeProd Environment
  # ============================================================================
  deploy-prod:
    name: Deploy HomeProd
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.homeprod == 'true' || 
      needs.detect-changes.outputs.modules == 'true' || 
      github.event.inputs.environment == 'homeprod' || 
      github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homeprod]
    
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner environment
        run: |
          echo "🔍 Runner Environment Check"
          echo "Hostname: $(hostname)"
          echo "kubectl: $(command -v kubectl && kubectl version --client --short 2>/dev/null || echo 'not found')"
          echo ""
          echo "🌐 Network connectivity:"
          ping -c 1 192.168.1.254 > /dev/null && echo "✅ Gateway reachable" || echo "❌ Gateway not reachable"

      - name: Validate Kubernetes manifests
        run: |
          echo "📋 Validating HomeProd Kubernetes manifests..."
          for f in $(find homeprod/apps/ -name '*.yaml' 2>/dev/null); do
            echo "  Checking: $f"
            kubectl apply --dry-run=client -f "$f" 2>&1 | grep -v "configured" || true
          done

      - name: Run Ansible Configuration
        if: |
          needs.detect-changes.outputs.ansible_prod == 'true' || 
          github.event.inputs.action == 'ansible-full'
        run: |
          echo "🔧 Running HomeProd Ansible configuration..."
          cd homeprod/ansible
          ansible-playbook site.yml || echo "No site.yml or playbook failed"

      - name: ArgoCD Sync Status
        run: |
          echo "🔄 HomeProd: ArgoCD will auto-sync app changes"
          echo "Commit: ${{ github.sha }}"
          echo ""
          if [ "${{ needs.detect-changes.outputs.apps_prod }}" == "true" ]; then
            echo "📦 App changes detected - ArgoCD will sync automatically"
          else
            echo "📦 No app changes - ArgoCD sync not triggered"
          fi

  # ============================================================================
  # Pipeline Summary
  # ============================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-practice, deploy-prod]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║         Pipeline Summary               ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ HomePractice changes: ${{ needs.detect-changes.outputs.homepractice || 'false' }}"
          echo "║ HomeProd changes: ${{ needs.detect-changes.outputs.homeprod || 'false' }}"
          echo "║ Module changes: ${{ needs.detect-changes.outputs.modules || 'false' }}"
          echo "╠════════════════════════════════════════╣"
          echo "║ Deploy Practice: ${{ needs.deploy-practice.result || 'skipped' }}"
          echo "║ Deploy Prod: ${{ needs.deploy-prod.result || 'skipped' }}"
          echo "╚════════════════════════════════════════╝"
          
          # Fail if any deployment failed
          if [ "${{ needs.deploy-practice.result }}" == "failure" ] || [ "${{ needs.deploy-prod.result }}" == "failure" ]; then
            echo "❌ One or more deployments failed"
            exit 1
          fi

