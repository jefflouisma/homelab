# CI/CD Pipeline for Homelab V2 (Multi-Environment)
#
# SECURITY CONFIGURATION:
# - Only triggers on push to main (NOT on pull requests)
# - Uses self-hosted ephemeral runners per environment
# - Secrets are stored in GitHub Secrets (not in repo)
#
# ENVIRONMENTS:
# - HomePractice: Isolated sandbox (runners: homepractice)
# - HomeProd: Production (runners: homeprod)
#
# IaC TOOLS:
# - Terraform: Infrastructure provisioning (VMs)
# - Ansible: Configuration management (OPNsense, K3s)
# - ArgoCD: GitOps for Kubernetes applications

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - homepractice
          - homeprod
          - both
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy-apps'
        type: choice
        options:
          - deploy-apps
          - full-infra
          - ansible-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which environments have changes
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      homepractice: ${{ steps.filter.outputs.homepractice }}
      homeprod: ${{ steps.filter.outputs.homeprod }}
      modules: ${{ steps.filter.outputs.modules }}
      infra: ${{ steps.filter.outputs.infra }}
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            homepractice:
              - 'homepractice/**'
            homeprod:
              - 'homeprod/**'
            modules:
              - 'modules/**'
            infra:
              - '**/infrastructure/**'
            ansible:
              - '**/ansible/**'

  # HomePractice Environment
  validate-practice:
    name: Validate HomePractice
    needs: detect-changes
    if: needs.detect-changes.outputs.homepractice == 'true' || needs.detect-changes.outputs.modules == 'true' || github.event.inputs.environment == 'homepractice' || github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homepractice]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Tools
        run: |
          command -v kubectl || echo "kubectl not found"
          command -v ansible || echo "ansible not found"

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating HomePractice Kubernetes manifests..."
          find homepractice/apps/ -name '*.yaml' -exec echo "Checking: {}" \; -exec kubectl apply --dry-run=client -f {} \; 2>/dev/null || true

      - name: Validate Ansible playbooks
        run: |
          echo "Validating Ansible syntax..."
          cd homepractice/ansible
          ansible-playbook --syntax-check site.yml 2>/dev/null || true

  deploy-practice:
    name: Deploy HomePractice
    needs: [detect-changes, validate-practice]
    if: needs.detect-changes.outputs.homepractice == 'true' || needs.detect-changes.outputs.modules == 'true' || github.event.inputs.environment == 'homepractice' || github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homepractice]
    steps:
      - uses: actions/checkout@v4

      - name: Run Ansible Configuration (if ansible changes)
        if: needs.detect-changes.outputs.ansible == 'true' || github.event.inputs.action == 'ansible-only' || github.event.inputs.action == 'full-infra'
        run: |
          cd homepractice/ansible
          ansible-playbook site.yml -e "opnsense_password=${{ secrets.OPNSENSE_PASSWORD }}"

      - name: Trigger ArgoCD Sync
        run: |
          echo "🔄 HomePractice: ArgoCD will auto-sync changes..."
          echo "Commit: ${{ github.sha }}"

  # HomeProd Environment
  validate-prod:
    name: Validate HomeProd
    needs: detect-changes
    if: needs.detect-changes.outputs.homeprod == 'true' || needs.detect-changes.outputs.modules == 'true' || github.event.inputs.environment == 'homeprod' || github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homeprod]
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Kubernetes manifests
        run: |
          echo "Validating HomeProd Kubernetes manifests..."
          find homeprod/apps/ -name '*.yaml' -exec echo "Checking: {}" \; -exec kubectl apply --dry-run=client -f {} \; 2>/dev/null || true

  deploy-prod:
    name: Deploy HomeProd
    needs: [detect-changes, validate-prod]
    if: needs.detect-changes.outputs.homeprod == 'true' || needs.detect-changes.outputs.modules == 'true' || github.event.inputs.environment == 'homeprod' || github.event.inputs.environment == 'both'
    runs-on: [self-hosted, homeprod]
    steps:
      - uses: actions/checkout@v4

      - name: Run Ansible Configuration (if ansible changes)
        if: needs.detect-changes.outputs.ansible == 'true' || github.event.inputs.action == 'ansible-only' || github.event.inputs.action == 'full-infra'
        run: |
          cd homeprod/ansible
          ansible-playbook site.yml

      - name: Trigger ArgoCD Sync
        run: |
          echo "🔄 HomeProd: ArgoCD will auto-sync changes..."
          echo "Commit: ${{ github.sha }}"

  # Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-practice, deploy-prod]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "=========================================="
          echo "Pipeline Summary"
          echo "=========================================="
          echo "HomePractice changes: ${{ needs.detect-changes.outputs.homepractice }}"
          echo "HomeProd changes: ${{ needs.detect-changes.outputs.homeprod }}"
          echo "Infrastructure changes: ${{ needs.detect-changes.outputs.infra }}"
          echo "Ansible changes: ${{ needs.detect-changes.outputs.ansible }}"
          echo ""
          echo "Deploy Practice: ${{ needs.deploy-practice.result || 'skipped' }}"
          echo "Deploy Prod: ${{ needs.deploy-prod.result || 'skipped' }}"
          echo "=========================================="

