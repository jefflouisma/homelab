name: "Build Fenrir Operator"

on:
  push:
    branches: [main]
    paths:
      - "fenrir/**"
      - "!fenrir/images/**"
      - ".github/workflows/fenrir-operator.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: fenrir-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/push fenrir-operator
        uses: docker/build-push-action@v6
        with:
          context: fenrir
          file: fenrir/Dockerfile
          build-args: APP_NAME=operator
          tags: ghcr.io/jefflouisma/fenrir-operator:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=fenrir-operator
          cache-to: type=gha,mode=max,scope=fenrir-operator

      - name: Build/push fenrir-moonlight-proxy
        uses: docker/build-push-action@v6
        with:
          context: fenrir
          file: fenrir/Dockerfile
          build-args: APP_NAME=moonlight-proxy
          tags: ghcr.io/jefflouisma/fenrir-moonlight-proxy:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=fenrir-moonlight-proxy
          cache-to: type=gha,mode=max,scope=fenrir-moonlight-proxy

      - name: Update GitOps manifests
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-operator:)[^[:space:]]+|${1}'"${TAG}"'|g' barleta/apps/house/fenrir/wolf-operator.yaml
          perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-moonlight-proxy:)[^[:space:]]+|${1}'"${TAG}"'|g' barleta/apps/house/fenrir/moonlight-proxy.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barleta/apps/house/fenrir/wolf-operator.yaml \
                  barleta/apps/house/fenrir/moonlight-proxy.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(fenrir): bump operator + proxy to ${{ steps.vars.outputs.tag }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
