name: "Build Fenrir Wolf"

on:
  push:
    branches: [main]
    paths:
      - "fenrir/images/wolf/**"
      - ".github/workflows/fenrir-wolf.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: fenrir-wolf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/push fenrir-wolf
        uses: docker/build-push-action@v6
        with:
          context: fenrir/images/wolf
          file: fenrir/images/wolf/docker/wolf.Dockerfile
          tags: ghcr.io/jefflouisma/fenrir-wolf:${{ steps.vars.outputs.tag }}
          push: true
          cache-from: type=gha,scope=fenrir-wolf
          cache-to: type=gha,mode=max,scope=fenrir-wolf

