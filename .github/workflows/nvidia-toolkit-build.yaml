name: Build NVIDIA Driver Toolkit

on:
  push:
    paths:
      - 'nvidia-driver-toolkit/**'
    branches:
      - main
  pull_request:
    paths:
      - 'nvidia-driver-toolkit/**'
  workflow_dispatch:
    inputs:
      driver_version:
        description: 'NVIDIA Driver Version'
        required: false
        default: '590.48.01'

env:
  REGISTRY: ghcr.io
  # Use jefflouisma/nvidia-driver-toolkit (the one user made public)
  IMAGE_NAME: ${{ github.repository_owner }}/nvidia-driver-toolkit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.driver_version || '590.48.01' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: nvidia-driver-toolkit
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DRIVER_VERSION=${{ inputs.driver_version || '590.48.01' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
