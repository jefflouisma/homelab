name: "Build Fenrir EmuDeck"

on:
  push:
    branches: [main]
    paths:
      - "barleta/apps/house/fenrir/images/emudeck/**"
      - "!barleta/apps/house/fenrir/images/emudeck/test_*.py"
      - "!barleta/apps/house/fenrir/images/emudeck/emulator_test_support.py"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: fenrir-emudeck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build-and-update:
    needs: validate
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/push fenrir-emudeck
        uses: docker/build-push-action@v6
        with:
          context: barleta/apps/house/fenrir/images/emudeck
          file: barleta/apps/house/fenrir/images/emudeck/Dockerfile
          tags: ghcr.io/jefflouisma/fenrir-emudeck:${{ steps.vars.outputs.tag }}
          push: true
          pull: true
          build-args: UPSTREAM_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=fenrir-emudeck
          cache-to: type=gha,mode=max,scope=fenrir-emudeck

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.vars.outputs.tag }}"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-emudeck:)[^[:space:]]+|${1}'"${TAG}"'|g' barleta/apps/house/fenrir/emudeck-app.yaml
            git add barleta/apps/house/fenrir/emudeck-app.yaml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(fenrir): bump emudeck to ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          exit 1
