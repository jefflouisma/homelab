name: Build EmuDeck Container Image

on:
  push:
    branches: [main]
    paths:
      - 'barleta/apps/house/fenrir/images/emudeck/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fenrir-emudeck

jobs:
  build-emudeck:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract short SHA
        id: vars
        run: echo "tag=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: barleta/apps/house/fenrir/images/emudeck
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps manifest
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          perl -pi -e 's|(ghcr.io/jefflouisma/fenrir-emudeck:)[^\s]+|${1}'"${TAG}"'|g' \
            barleta/apps/house/fenrir/emudeck-app.yaml

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barleta/apps/house/fenrir/emudeck-app.yaml
          git diff --staged --quiet || git commit -m "ci: update fenrir-emudeck image to ${{ steps.vars.outputs.tag }}"
          git push
