# ArgoCD Repository Secret for Private Repo Access
# 
# This secret allows ArgoCD to access your private GitHub repository.
# 
# SETUP INSTRUCTIONS:
# 1. Generate a new SSH key pair:
#    ssh-keygen -t ed25519 -C "argocd-deploy-key" -f argocd-deploy-key -N ""
#
# 2. Add the PUBLIC key to your GitHub repo:
#    GitHub → Repo → Settings → Deploy Keys → Add Deploy Key
#    Paste contents of: argocd-deploy-key.pub
#    (Read access only is sufficient for ArgoCD)
#
# 3. Base64 encode the PRIVATE key:
#    cat argocd-deploy-key | base64 | tr -d '\n'
#
# 4. Replace REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY below with the output
#
# 5. Apply this secret:
#    kubectl apply -f infrastructure/argocd-repo-secret.yaml
#
# 6. Delete the local key files (they're now in the cluster):
#    rm argocd-deploy-key argocd-deploy-key.pub
#
# SECURITY NOTE: 
# - This file is gitignored to prevent accidental commits of the private key
# - Keep a backup of the private key in a secure location (password manager)
# - Deploy keys have read-only access by default (recommended)
---
apiVersion: v1
kind: Secret
metadata:
  name: homelab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:jefflouisma/homelab.git
  sshPrivateKey: |
    REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY
---
# Alternative: If you want to use the HTTPS URL with a PAT token instead of SSH
# Uncomment this and comment out the SSH secret above
