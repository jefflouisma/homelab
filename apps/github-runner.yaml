# GitHub Runners ArgoCD Application
# This Application depends on ARC being installed first
# Sync-wave ensures it runs after ARC Application creates the CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runners
  namespace: argocd
  annotations:
    # Run after ARC controller is healthy (wave 2, ARC is wave -1)
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jefflouisma/homelab.git
    targetRevision: HEAD
    path: infrastructure/github-runners
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Skip validation since CRD may not exist until ARC is installed
      - SkipDryRunOnMissingResource=true
