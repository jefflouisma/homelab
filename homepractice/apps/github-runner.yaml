# GitHub Runners App - HomePractice Environment
# This Application syncs runner resources AFTER ARC installs the CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:jefflouisma/homelab.git
    targetRevision: HEAD
    path: homepractice/apps/runners
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
