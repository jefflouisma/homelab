apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: midpoint
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:jefflouisma/homelab.git
    targetRevision: HEAD
    path: homepractice/apps/identity/midpoint
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
