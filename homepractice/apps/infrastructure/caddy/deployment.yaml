---
apiVersion: v1
kind: Namespace
metadata:
  name: caddy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: caddy
data:
  Caddyfile: |
    {
      email admin@practice.local
      acme_ca https://step-ca-step-certificates.step-ca.svc.cluster.local/acme/acme/directory
      acme_ca_root /etc/caddy/certs/root_ca.crt
      log {
        level INFO
      }
    }

    # Keycloak
    keycloak.practice.local {
      reverse_proxy keycloak.identity.svc.cluster.local:80
    }

    # Test App
    testapp.practice.local {
      reverse_proxy test-app.test-app.svc.cluster.local:80
    }

    # NetBird Dashboard
    netbird.practice.local {
      reverse_proxy netbird-dashboard.netbird.svc.cluster.local:80
    }

    # NetBird Management API (HTTP + gRPC)
    netbird-api.practice.local {
      reverse_proxy netbird-management.netbird.svc.cluster.local:8080 {
        transport http {
          versions h2c 2
        }
      }
    }

    # NetBird Signal (gRPC)
    netbird-signal.practice.local {
      reverse_proxy netbird-signal.netbird.svc.cluster.local:8080 {
        transport http {
          versions h2c 2
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy
  namespace: caddy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: caddy
  labels:
    app: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      serviceAccountName: caddy
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 2019
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
            - name: step-ca-root
              mountPath: /etc/caddy/certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 2019
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 2019
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config-dir
          emptyDir: {}
        - name: step-ca-root
          configMap:
            name: step-ca-root-ca
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: caddy
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.10.10.231"
spec:
  type: LoadBalancer
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
