---
apiVersion: v1
kind: Namespace
metadata:
  name: caddy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: caddy
data:
  Caddyfile: |
    {
      log {
        level INFO
      }
    }

    # Keycloak
    keycloak.practice.local {
      tls /etc/caddy/tls/keycloak/tls.crt /etc/caddy/tls/keycloak/tls.key
      reverse_proxy keycloak.identity.svc.cluster.local:80
    }

    # Test App
    testapp.practice.local {
      tls /etc/caddy/tls/testapp/tls.crt /etc/caddy/tls/testapp/tls.key
      reverse_proxy test-app.test-app.svc.cluster.local:80
    }

    # NetBird Dashboard
    netbird.practice.local {
      tls /etc/caddy/tls/netbird/tls.crt /etc/caddy/tls/netbird/tls.key
      reverse_proxy netbird-dashboard.netbird.svc.cluster.local:80
    }

    # NetBird Management API (HTTP + gRPC)
    netbird-api.practice.local {
      tls /etc/caddy/tls/netbird-api/tls.crt /etc/caddy/tls/netbird-api/tls.key
      reverse_proxy netbird-management.netbird.svc.cluster.local:443 {
        transport http {
          versions h2c 2
        }
      }
    }

    # NetBird Signal (gRPC)
    netbird-signal.practice.local {
      tls /etc/caddy/tls/netbird-signal/tls.crt /etc/caddy/tls/netbird-signal/tls.key
      reverse_proxy netbird-signal.netbird.svc.cluster.local:8080 {
        transport http {
          versions h2c 2
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy
  namespace: caddy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: caddy
  labels:
    app: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      serviceAccountName: caddy
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 2019
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config-dir
              mountPath: /config
            - name: step-ca-root
              mountPath: /etc/caddy/certs
              readOnly: true
            - name: keycloak-tls
              mountPath: /etc/caddy/tls/keycloak
              readOnly: true
            - name: testapp-tls
              mountPath: /etc/caddy/tls/testapp
              readOnly: true
            - name: netbird-tls
              mountPath: /etc/caddy/tls/netbird
              readOnly: true
            - name: netbird-api-tls
              mountPath: /etc/caddy/tls/netbird-api
              readOnly: true
            - name: netbird-signal-tls
              mountPath: /etc/caddy/tls/netbird-signal
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: caddy-config
          configMap:
            name: caddy-config
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config-dir
          emptyDir: {}
        - name: step-ca-root
          configMap:
            name: step-ca-root-ca
        - name: keycloak-tls
          secret:
            secretName: keycloak-tls
        - name: testapp-tls
          secret:
            secretName: testapp-tls
        - name: netbird-tls
          secret:
            secretName: netbird-tls
        - name: netbird-api-tls
          secret:
            secretName: netbird-api-tls
        - name: netbird-signal-tls
          secret:
            secretName: netbird-signal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: caddy
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.10.10.230"
spec:
  type: LoadBalancer
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
