apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: stepca
spec:
  acme:
    server: https://step-ca-step-certificates.step-ca.svc.cluster.local/acme/acme/directory
    email: admin@practice.local
    privateKeySecretRef:
      name: stepca-account-key
    caBundle: 
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
