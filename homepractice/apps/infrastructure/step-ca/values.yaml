# step-ca Helm values for HomePractice PKI
# Deployed via ArgoCD

replicaCount: 1

image:
  repository: smallstep/step-ca
  tag: "0.27.2"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 443
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.10.10.232"

# CA initialization settings
bootstrap:
  secrets: true
  enabled: true
  configmaps: true

# CA configuration
inject:
  enabled: true
  config:
    files:
      defaults.json:
        ca-url: https://ca.practice.local
        ca-config: /home/step/config/ca.json
        fingerprint: ""
        root: /home/step/certs/root_ca.crt
      ca.json:
        root: /home/step/certs/root_ca.crt
        federateRoots: []
        crt: /home/step/certs/intermediate_ca.crt
        key: /home/step/secrets/intermediate_ca_key
        address: ":9000"
        insecureAddress: ""
        dnsNames:
          - ca.practice.local
          - step-ca.step-ca.svc.cluster.local
          - step-ca
          - localhost
        logger:
          format: json
        db:
          type: badgerv2
          dataSource: /home/step/db
        authority:
          provisioners:
            - type: ACME
              name: acme
              claims:
                maxTLSCertDuration: 2160h
                defaultTLSCertDuration: 720h
        tls:
          cipherSuites:
            - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
            - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          minVersion: 1.2
          maxVersion: 1.3
          renegotiation: false

  certificates:
    enabled: true
    intermediate_ca: ""
    root_ca: ""

  secrets:
    enabled: true
    ca_password: ""
    provisioner_password: ""

    x509:
      enabled: true
      intermediate_ca_key: ""
      root_ca_key: ""

existingSecrets:
  enabled: true
  ca_password:
    name: step-ca-password
    key: password
  provisioner_password:
    name: step-ca-provisioner
    key: password

persistence:
  enabled: true
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
