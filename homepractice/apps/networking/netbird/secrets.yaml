apiVersion: v1
kind: Secret
metadata:
  name: netbird-secrets
  namespace: netbird
type: Opaque
stringData:
  # Keycloak OIDC client secret for backend service account
  IDP_CLIENT_SECRET: "keycloak-netbird-backend-secret-change-me"
  
  # TURN server credentials
  TURN_PASSWORD: "turn-secret-change-me"
  
  # DataStore encryption key (32 bytes base64)
  # Generate with: openssl rand -base64 32
  DATASTORE_ENCRYPTION_KEY: "Y2hhbmdlLXRoaXMtdG8tYS1yZWFsLTMyLWJ5dGUta2V5"
