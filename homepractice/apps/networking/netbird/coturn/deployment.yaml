apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: netbird
  labels:
    app: coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2-alpine
          args:
            - -n
            - --log-file=stdout
            - --listening-port=3478
            - --tls-listening-port=5349
            - --min-port=49152
            - --max-port=65535
            - --realm=practice.local
            - --server-name=turn.practice.local
            - --fingerprint
            - --lt-cred-mech
            - --user=netbird:$(TURN_PASSWORD)
            - --no-cli
            - --no-software-attribute
            - --pidfile=/tmp/turnserver.pid
          env:
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: TURN_PASSWORD
          ports:
            - containerPort: 3478
              name: turn-udp
              protocol: UDP
            - containerPort: 3478
              name: turn-tcp
              protocol: TCP
            - containerPort: 5349
              name: turn-tls
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: netbird
spec:
  type: LoadBalancer
  selector:
    app: coturn
  ports:
    - port: 3478
      targetPort: 3478
      name: turn-udp
      protocol: UDP
    - port: 3478
      targetPort: 3478
      name: turn-tcp
      protocol: TCP
    - port: 5349
      targetPort: 5349
      name: turn-tls
      protocol: TCP
