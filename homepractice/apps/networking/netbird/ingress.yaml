# NetBird TLS Certificates (managed by cert-manager)
# Routing is handled by Caddy reverse proxy
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-dashboard-cert
  namespace: netbird
spec:
  secretName: netbird-dashboard-tls
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: step-issuer
  dnsNames:
    - netbird.practice.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-api-cert
  namespace: netbird
spec:
  secretName: netbird-api-tls
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: step-issuer
  dnsNames:
    - netbird-api.practice.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-signal-cert
  namespace: netbird
spec:
  secretName: netbird-signal-tls
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: step-issuer
  dnsNames:
    - netbird-signal.practice.local
