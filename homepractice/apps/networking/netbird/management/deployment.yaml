apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-management
  namespace: netbird
  labels:
    app: netbird-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-management
  template:
    metadata:
      labels:
        app: netbird-management
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z identity-postgres-postgresql.identity.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
        - name: setup-ca
          image: alpine:3.19
          env:
            - name: IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_CLIENT_SECRET
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: TURN_PASSWORD
          command:
            - sh
            - -c
            - |
              apk add --no-cache jq
              cp /etc/ssl/certs/ca-certificates.crt /certs/ca-certificates.crt
              cat /step-ca/root_ca.crt >> /certs/ca-certificates.crt
              echo "Added step-ca root certificate"
              
              # Inject secrets into config
              jq --arg secret "$IDP_CLIENT_SECRET" --arg turn "$TURN_PASSWORD" \
                '.IdpManagerConfig.ClientConfig.ClientSecret = $secret | .TURNConfig.Turns[0].Password = $turn' \
                /config-ro/management.json > /config/management.json
              chmod 644 /config/management.json
              echo "Config prepared with secrets"
          volumeMounts:
            - name: step-ca-cert
              mountPath: /step-ca
            - name: ca-certs
              mountPath: /certs
            - name: config-ro
              mountPath: /config-ro
            - name: config
              mountPath: /config
      containers:
        - name: management
          image: netbirdio/management:latest
          args:
            - --port=8080
            - --log-level=info
            - --log-file=console
            - --disable-anonymous-metrics=true
            - --single-account-mode-domain=practice.local
            - --dns-domain=netbird.practice.local
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 33073
              name: grpc
          env:
            - name: NETBIRD_STORE_ENGINE
              value: "postgres"
            - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
              value: "postgresql://netbird:NetBirdDB2024!@identity-postgres-postgresql.identity.svc.cluster.local:5432/netbird?sslmode=disable"
            - name: NETBIRD_DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: DATASTORE_ENCRYPTION_KEY
            - name: SSL_CERT_FILE
              value: "/certs/ca-certificates.crt"
            - name: NETBIRD_IDP_MGMT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
            - name: ca-certs
              mountPath: /certs
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config-ro
          configMap:
            name: netbird-management-config
        - name: config
          emptyDir: {}
        - name: step-ca-cert
          configMap:
            name: step-ca-root-cert
        - name: ca-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-management
  namespace: netbird
spec:
  type: LoadBalancer
  selector:
    app: netbird-management
  ports:
    - port: 443
      targetPort: 8080
      name: http
    - port: 33073
      targetPort: 33073
      name: grpc
