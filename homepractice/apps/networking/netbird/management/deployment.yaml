apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-management
  namespace: netbird
  labels:
    app: netbird-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-management
  template:
    metadata:
      labels:
        app: netbird-management
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z identity-postgres-postgresql.identity.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: management
          image: netbirdio/management:latest
          args:
            - --port=8080
            - --log-level=info
            - --log-file=console
            - --disable-anonymous-metrics=true
            - --single-account-mode-domain=practice.local
            - --dns-domain=netbird.practice.local
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
          env:
            - name: NETBIRD_STORE_ENGINE
              value: "postgres"
            - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
              value: "postgresql://netbird:NetBirdDB2024!@identity-postgres-postgresql.identity.svc.cluster.local:5432/netbird?sslmode=disable"
            - name: NETBIRD_DATASTORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: DATASTORE_ENCRYPTION_KEY
          envFrom:
            - configMapRef:
                name: netbird-management-config
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/accounts
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/accounts
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: netbird-management-config
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-management
  namespace: netbird
spec:
  selector:
    app: netbird-management
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8081
      targetPort: 8081
      name: grpc
