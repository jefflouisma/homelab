apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app: netbird-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:latest
          ports:
            - containerPort: 80
              name: http
          env:
            # NetBird API endpoint
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: "https://netbird-api.practice.local"
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: "https://netbird-api.practice.local"
            
            # Keycloak OIDC configuration
            - name: AUTH_AUTHORITY
              value: "https://keycloak.practice.local/realms/practice"
            - name: AUTH_CLIENT_ID
              value: "netbird-dashboard"
            - name: AUTH_AUDIENCE
              value: "netbird"
            - name: AUTH_SUPPORTED_SCOPES
              value: "openid profile email offline_access"
            - name: USE_AUTH0
              value: "false"
            
            # Disable telemetry
            - name: NETBIRD_DISABLE_LETSENCRYPT
              value: "true"
            - name: NETBIRD_TOKEN_SOURCE
              value: "idToken"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  selector:
    app: netbird-dashboard
  ports:
    - port: 80
      targetPort: 80
      name: http
