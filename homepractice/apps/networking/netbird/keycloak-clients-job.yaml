apiVersion: batch/v1
kind: Job
metadata:
  name: netbird-keycloak-clients
  namespace: netbird
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine:3.19
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-password
                  optional: true
            - name: IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_CLIENT_SECRET
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              
              echo "=========================================="
              echo "Creating NetBird Keycloak Clients"
              echo "=========================================="
              
              # Wait for Keycloak
              echo "Waiting for Keycloak..."
              until curl -sf ${KEYCLOAK_URL}/realms/master >/dev/null 2>&1; do
                sleep 5
              done
              
              # Get admin token from identity namespace secret
              # First try to get password from identity namespace
              if [ -z "$KEYCLOAK_ADMIN_PASSWORD" ]; then
                echo "Keycloak admin password not available, skipping client creation"
                echo "Please create clients manually or ensure secret access"
                exit 0
              fi
              
              TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -d "username=admin&password=${KEYCLOAK_ADMIN_PASSWORD}&grant_type=password&client_id=admin-cli" | jq -r '.access_token')
              
              if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
                echo "Failed to get admin token"
                exit 1
              fi
              echo "Got admin token"
              
              # Check if practice realm exists
              if ! curl -sf -H "Authorization: Bearer ${TOKEN}" "${KEYCLOAK_URL}/admin/realms/practice" >/dev/null 2>&1; then
                echo "Practice realm does not exist, skipping"
                exit 0
              fi
              
              # 1. Create netbird-dashboard client (browser OIDC)
              echo ""
              echo "Creating netbird-dashboard client..."
              DASHBOARD_EXISTS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/clients?clientId=netbird-dashboard" | jq -r '.[0].id // empty')
              
              if [ -z "$DASHBOARD_EXISTS" ]; then
                curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/clients" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "clientId": "netbird-dashboard",
                    "name": "NetBird Dashboard",
                    "enabled": true,
                    "publicClient": true,
                    "standardFlowEnabled": true,
                    "directAccessGrantsEnabled": true,
                    "serviceAccountsEnabled": false,
                    "protocol": "openid-connect",
                    "rootUrl": "https://netbird.practice.local",
                    "baseUrl": "/",
                    "redirectUris": [
                      "https://netbird.practice.local/*"
                    ],
                    "webOrigins": [
                      "https://netbird.practice.local"
                    ],
                    "attributes": {
                      "pkce.code.challenge.method": "S256"
                    }
                  }'
                echo "✅ Created netbird-dashboard client"
              else
                echo "netbird-dashboard client already exists"
              fi
              
              # 2. Create netbird-backend client (service account)
              echo ""
              echo "Creating netbird-backend client..."
              BACKEND_EXISTS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/clients?clientId=netbird-backend" | jq -r '.[0].id // empty')
              
              if [ -z "$BACKEND_EXISTS" ]; then
                curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/clients" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"clientId\": \"netbird-backend\",
                    \"name\": \"NetBird Backend\",
                    \"enabled\": true,
                    \"publicClient\": false,
                    \"standardFlowEnabled\": false,
                    \"directAccessGrantsEnabled\": false,
                    \"serviceAccountsEnabled\": true,
                    \"protocol\": \"openid-connect\",
                    \"secret\": \"${IDP_CLIENT_SECRET}\"
                  }"
                echo "✅ Created netbird-backend client"
                
                # Assign view-users role to service account
                BACKEND_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/practice/clients?clientId=netbird-backend" | jq -r '.[0].id')
                
                # Get service account user
                SA_USER=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/practice/clients/${BACKEND_ID}/service-account-user" | jq -r '.id')
                
                # Get realm-management client ID
                REALM_MGMT_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/practice/clients?clientId=realm-management" | jq -r '.[0].id')
                
                # Get view-users role
                VIEW_USERS_ROLE=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/practice/clients/${REALM_MGMT_ID}/roles/view-users")
                
                # Assign role
                curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/users/${SA_USER}/role-mappings/clients/${REALM_MGMT_ID}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "[${VIEW_USERS_ROLE}]"
                echo "✅ Assigned view-users role to service account"
              else
                echo "netbird-backend client already exists"
              fi
              
              # 3. Create netbird-client (device/CLI - public client)
              echo ""
              echo "Creating netbird-client..."
              CLIENT_EXISTS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/clients?clientId=netbird-client" | jq -r '.[0].id // empty')
              
              if [ -z "$CLIENT_EXISTS" ]; then
                curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/clients" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "clientId": "netbird-client",
                    "name": "NetBird Client",
                    "description": "NetBird desktop/mobile client",
                    "enabled": true,
                    "publicClient": true,
                    "standardFlowEnabled": true,
                    "directAccessGrantsEnabled": true,
                    "protocol": "openid-connect",
                    "redirectUris": [
                      "http://localhost:53000",
                      "urn:ietf:wg:oauth:2.0:oob"
                    ],
                    "webOrigins": [
                      "+"
                    ],
                    "attributes": {
                      "oauth2.device.authorization.grant.enabled": "true",
                      "pkce.code.challenge.method": "S256"
                    },
                    "defaultClientScopes": [
                      "openid",
                      "profile",
                      "email",
                      "offline_access"
                    ]
                  }'
                echo "✅ Created netbird-client"
              else
                echo "netbird-client already exists"
              fi
              
              echo ""
              echo "=========================================="
              echo "NetBird Keycloak Clients Created"
              echo "=========================================="
              echo ""
              echo "Clients:"
              echo "  - netbird-dashboard (browser login)"
              echo "  - netbird-backend (service account with view-users)"
              echo "  - netbird-client (device/CLI - public)"
