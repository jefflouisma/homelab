---
# Traefik Ingress Controller - ArgoCD Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jefflouisma/homelab
    targetRevision: HEAD
    path: homepractice/apps/infrastructure/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
