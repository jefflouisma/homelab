apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # First source: namespace and secrets from Git
    - repoURL: git@github.com:jefflouisma/homelab.git
      targetRevision: HEAD
      path: homepractice/apps/infrastructure/step-ca
    # Second source: step-certificates Helm chart
    - repoURL: https://smallstep.github.io/helm-charts
      chart: step-certificates
      targetRevision: "1.26.1"
      helm:
        valueFiles:
          - $values/homepractice/apps/infrastructure/step-ca/values.yaml
    # Values file reference
    - repoURL: git@github.com:jefflouisma/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: step-ca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
