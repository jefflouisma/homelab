apiVersion: batch/v1
kind: Job
metadata:
  name: midpoint-freeipa-setup
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: setup
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl openldap-clients jq >/dev/null 2>&1
          
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          AUTH="administrator:2MEcz|Ra"
          IPA_SERVER="10.10.10.212"
          DM_PASSWORD="DirectoryServer2024!"
          
          echo "=========================================="
          echo "MidPoint FreeIPA Complete Setup"
          echo "Two-Stage REST API Approach"
          echo "=========================================="
          
          # =============================================
          # Stage 0: Setup FreeIPA ACIs for service accounts
          # =============================================
          echo ""
          echo "Stage 0: Setting up FreeIPA ACIs..."
          
          # ACI for midpoint-service (write access)
          cat > /tmp/midpoint-aci.ldif << 'LDIFEOF'
          dn: cn=users,cn=accounts,dc=practice,dc=local
          changetype: modify
          add: aci
          aci: (targetattr="*")(version 3.0; acl "MidPoint user management"; allow (read,write,add,delete) userdn="ldap:///uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local";)
          LDIFEOF
          
          ldapmodify -x -H ldap://${IPA_SERVER}:389 -D "cn=Directory Manager" -w "${DM_PASSWORD}" -f /tmp/midpoint-aci.ldif 2>&1 || echo "ACI may already exist"
          
          # ACI for keycloak-service (read access)
          cat > /tmp/keycloak-aci.ldif << 'LDIFEOF'
          dn: cn=users,cn=accounts,dc=practice,dc=local
          changetype: modify
          add: aci
          aci: (targetattr="*")(version 3.0; acl "Keycloak user read"; allow (read,search,compare) userdn="ldap:///uid=keycloak-service,cn=sysaccounts,cn=etc,dc=practice,dc=local";)
          LDIFEOF
          
          ldapmodify -x -H ldap://${IPA_SERVER}:389 -D "cn=Directory Manager" -w "${DM_PASSWORD}" -f /tmp/keycloak-aci.ldif 2>&1 || echo "ACI may already exist"
          
          echo "✅ FreeIPA ACIs configured"
          
          # =============================================
          # Stage 1: Get LDAP Connector OID
          # =============================================
          echo ""
          echo "Stage 1: Getting LDAP Connector OID..."
          
          CONNECTOR_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" \
            "${MIDPOINT_URL}/ws/rest/connectors" | \
            grep -B5 "com.evolveum.polygon.connector.ldap.LdapConnector</connectorType>" | \
            grep -v "AdLdap" | grep "oid=" | head -1 | \
            sed 's/.*oid="\([^"]*\)".*/\1/')
          
          echo "LDAP Connector OID: $CONNECTOR_OID"
          
          # =============================================
          # Stage 2: Create Minimal Resource
          # =============================================
          echo ""
          echo "Stage 2: Creating minimal FreeIPA resource..."
          
          # Check if resource exists
          EXISTING=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/resources" | grep "FreeIPA")
          
          if [ -n "$EXISTING" ]; then
            RESOURCE_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/resources" | \
              grep -B1 "FreeIPA" | grep "oid=" | head -1 | sed 's/.*oid="\([^"]*\)".*/\1/')
            echo "Resource already exists: $RESOURCE_OID"
          else
            cat > /tmp/resource.xml << XMLEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <resource xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3"
                    xmlns:icfc="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/connector-schema-3"
                    xmlns:icfcldap="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/bundle/com.evolveum.polygon.connector-ldap/com.evolveum.polygon.connector.ldap.LdapConnector">
              <name>FreeIPA LDAP</name>
              <description>FreeIPA Identity Server</description>
              <connectorRef oid="$CONNECTOR_OID" type="c:ConnectorType"/>
              <connectorConfiguration>
                  <icfc:configurationProperties>
                      <icfcldap:host>10.10.10.212</icfcldap:host>
                      <icfcldap:port>389</icfcldap:port>
                      <icfcldap:connectionSecurity>none</icfcldap:connectionSecurity>
                      <icfcldap:baseContext>dc=practice,dc=local</icfcldap:baseContext>
                      <icfcldap:bindDn>uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local</icfcldap:bindDn>
                      <icfcldap:bindPassword>
                          <t:clearValue>MidPointLDAP2024!</t:clearValue>
                      </icfcldap:bindPassword>
                      <icfcldap:pagingStrategy>auto</icfcldap:pagingStrategy>
                  </icfc:configurationProperties>
              </connectorConfiguration>
          </resource>
          XMLEOF
          
            RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
              -H "Content-Type: application/xml" \
              -X POST "${MIDPOINT_URL}/ws/rest/resources" \
              -d @/tmp/resource.xml)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            
            if [ "$HTTP_CODE" = "201" ]; then
              RESOURCE_OID=$(echo "$RESPONSE" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//')
              echo "✅ Resource created: $RESOURCE_OID"
            else
              echo "Failed to create resource: $HTTP_CODE"
              exit 1
            fi
          fi
          
          # =============================================
          # Stage 3: Test Connection (discovers schema)
          # =============================================
          echo ""
          echo "Stage 3: Testing connection and discovering schema..."
          
          TEST=$(curl -s -u "$AUTH" -H "Accept: application/xml" \
            -X POST "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}/test")
          
          if echo "$TEST" | grep -q "<status>success</status>"; then
            echo "✅ Connection test successful, schema discovered"
          else
            echo "Connection test failed"
            echo "$TEST" | grep -E "<message>" | head -3
            exit 1
          fi
          
          # =============================================
          # Stage 4: Add schemaHandling
          # =============================================
          echo ""
          echo "Stage 4: Adding schemaHandling..."
          
          cat > /tmp/schema.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <objectModification xmlns="http://midpoint.evolveum.com/xml/ns/public/common/api-types-3"
                              xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                              xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3"
                              xmlns:ri="http://midpoint.evolveum.com/xml/ns/public/resource/instance-3">
              <itemDelta>
                  <t:modificationType>replace</t:modificationType>
                  <t:path>c:schemaHandling</t:path>
                  <t:value>
                      <c:objectType>
                          <c:kind>account</c:kind>
                          <c:intent>default</c:intent>
                          <c:displayName>FreeIPA User Account</c:displayName>
                          <c:default>true</c:default>
                          <c:objectClass>ri:inetOrgPerson</c:objectClass>
                          <c:attribute>
                              <c:ref>ri:dn</c:ref>
                              <c:outbound>
                                  <c:source><c:path>name</c:path></c:source>
                                  <c:expression>
                                      <c:script><c:code>"uid=" + name + ",cn=users,cn=accounts,dc=practice,dc=local"</c:code></c:script>
                                  </c:expression>
                              </c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:uid</c:ref>
                              <c:outbound><c:strength>strong</c:strength><c:source><c:path>name</c:path></c:source></c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:cn</c:ref>
                              <c:outbound><c:source><c:path>fullName</c:path></c:source></c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:sn</c:ref>
                              <c:outbound><c:source><c:path>familyName</c:path></c:source></c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:givenName</c:ref>
                              <c:outbound><c:source><c:path>givenName</c:path></c:source></c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:mail</c:ref>
                              <c:outbound><c:source><c:path>emailAddress</c:path></c:source></c:outbound>
                          </c:attribute>
                      </c:objectType>
                  </t:value>
              </itemDelta>
          </objectModification>
          XMLEOF
          
          PATCH=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
            -H "Content-Type: application/xml" \
            -X PATCH "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}" \
            -d @/tmp/schema.xml)
          
          PATCH_CODE=$(echo "$PATCH" | tail -1)
          if [ "$PATCH_CODE" = "200" ] || [ "$PATCH_CODE" = "204" ]; then
            echo "✅ schemaHandling applied"
          else
            echo "schemaHandling may already exist or had partial error"
          fi
          
          # =============================================
          # Stage 5: Create FreeIPA User Role
          # =============================================
          echo ""
          echo "Stage 5: Creating FreeIPA User role..."
          
          ROLE_EXISTS=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/roles" | grep "FreeIPA User")
          
          if [ -n "$ROLE_EXISTS" ]; then
            ROLE_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/roles" | \
              grep -B1 "FreeIPA User" | grep "oid=" | head -1 | sed 's/.*oid="\([^"]*\)".*/\1/')
            echo "Role already exists: $ROLE_OID"
          else
            cat > /tmp/role.xml << XMLEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <role xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3">
              <name>FreeIPA User</name>
              <description>Role that provisions users to FreeIPA LDAP</description>
              <inducement>
                  <construction>
                      <resourceRef oid="$RESOURCE_OID" type="c:ResourceType"/>
                      <kind>account</kind>
                      <intent>default</intent>
                  </construction>
              </inducement>
          </role>
          XMLEOF
          
            ROLE_RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
              -H "Content-Type: application/xml" \
              -X POST "${MIDPOINT_URL}/ws/rest/roles" \
              -d @/tmp/role.xml)
            
            ROLE_CODE=$(echo "$ROLE_RESPONSE" | tail -1)
            if [ "$ROLE_CODE" = "201" ]; then
              ROLE_OID=$(echo "$ROLE_RESPONSE" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//')
              echo "✅ Role created: $ROLE_OID"
            else
              echo "Role creation returned: $ROLE_CODE"
            fi
          fi
          
          echo ""
          echo "=========================================="
          echo "MidPoint FreeIPA Setup Complete"
          echo "=========================================="
          echo "Resource OID: $RESOURCE_OID"
          echo "Role OID: $ROLE_OID"
          echo ""
          echo "Users assigned the 'FreeIPA User' role will"
          echo "be provisioned to FreeIPA automatically."
          echo "=========================================="
      restartPolicy: OnFailure
  backoffLimit: 3
