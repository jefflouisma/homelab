apiVersion: batch/v1
kind: Job
metadata:
  name: identity-e2e-test
  namespace: identity
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: e2e-test
          image: alpine:3.19
          env:
            - name: IPA_SERVER
              value: "10.10.10.212"
            - name: KEYCLOAK_URL
              value: "http://10.10.10.210"
            - name: MIDPOINT_URL
              value: "http://10.10.10.211/midpoint"
            - name: IPA_DM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin-secret
                  key: ds-password
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-password
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl openldap-clients jq
              
              echo "=========================================="
              echo "Identity Stack End-to-End Test"
              echo "=========================================="
              
              # Test 1: FreeIPA LDAP connectivity
              echo ""
              echo "[TEST 1] FreeIPA LDAP Connectivity..."
              if ldapsearch -x -H ldap://${IPA_SERVER}:389 -b "" -s base "(objectclass=*)" >/dev/null 2>&1; then
                echo "✅ FreeIPA LDAP is accessible"
              else
                echo "❌ FreeIPA LDAP is NOT accessible"
                exit 1
              fi
              
              # Test 2: Create test user in FreeIPA
              echo ""
              echo "[TEST 2] Creating test user in FreeIPA..."
              TEST_USER="testuser-$(date +%s)"
              cat > /tmp/testuser.ldif << EOF
              dn: uid=${TEST_USER},cn=users,cn=accounts,dc=practice,dc=local
              changetype: add
              objectClass: top
              objectClass: person
              objectClass: organizationalPerson
              objectClass: inetOrgPerson
              objectClass: posixAccount
              uid: ${TEST_USER}
              cn: Test User
              sn: User
              givenName: Test
              mail: ${TEST_USER}@practice.local
              uidNumber: 50001
              gidNumber: 50001
              homeDirectory: /home/${TEST_USER}
              loginShell: /bin/bash
              userPassword: TestPassword123!
              EOF
              
              if ldapmodify -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                -f /tmp/testuser.ldif 2>&1; then
                echo "✅ Test user ${TEST_USER} created in FreeIPA"
              else
                echo "⚠️ Could not create test user (may already exist or FreeIPA not ready)"
              fi
              
              # Test 3: Verify user exists in FreeIPA
              echo ""
              echo "[TEST 3] Verifying test user in FreeIPA..."
              if ldapsearch -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                -b "cn=users,cn=accounts,dc=practice,dc=local" \
                "(uid=${TEST_USER})" uid mail 2>&1 | grep -q "${TEST_USER}"; then
                echo "✅ Test user found in FreeIPA LDAP"
              else
                echo "❌ Test user NOT found in FreeIPA"
              fi
              
              # Test 4: Keycloak health check
              echo ""
              echo "[TEST 4] Keycloak Health Check..."
              if curl -sf ${KEYCLOAK_URL}/realms/master >/dev/null 2>&1; then
                echo "✅ Keycloak is accessible"
              else
                echo "❌ Keycloak is NOT accessible"
                exit 1
              fi
              
              # Test 5: Keycloak practice realm exists
              echo ""
              echo "[TEST 5] Keycloak Practice Realm..."
              if curl -sf ${KEYCLOAK_URL}/realms/practice >/dev/null 2>&1; then
                echo "✅ Practice realm exists"
              else
                echo "❌ Practice realm does NOT exist"
              fi
              
              # Test 6: Get Keycloak admin token
              echo ""
              echo "[TEST 6] Keycloak Admin Authentication..."
              TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=admin" \
                -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | jq -r '.access_token')
              
              if [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ]; then
                echo "✅ Got Keycloak admin token"
              else
                echo "❌ Failed to get Keycloak admin token"
              fi
              
              # Test 7: Check LDAP federation in practice realm
              echo ""
              echo "[TEST 7] Keycloak LDAP Federation..."
              LDAP_FED=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/components?type=org.keycloak.storage.UserStorageProvider" | jq -r '.[0].name // "none"')
              
              if [ "$LDAP_FED" != "none" ] && [ -n "$LDAP_FED" ]; then
                echo "✅ LDAP federation configured: ${LDAP_FED}"
              else
                echo "⚠️ LDAP federation not configured yet"
              fi
              
              # Test 8: Trigger LDAP user sync in Keycloak
              echo ""
              echo "[TEST 8] Triggering Keycloak LDAP Sync..."
              LDAP_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/components?type=org.keycloak.storage.UserStorageProvider" | jq -r '.[0].id // ""')
              
              if [ -n "$LDAP_ID" ]; then
                curl -s -X POST -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/practice/user-storage/${LDAP_ID}/sync?action=triggerFullSync" || true
                echo "✅ LDAP sync triggered"
              else
                echo "⚠️ No LDAP provider to sync"
              fi
              
              # Test 9: MidPoint health check
              echo ""
              echo "[TEST 9] MidPoint Health Check..."
              if curl -sf ${MIDPOINT_URL}/actuator/health 2>&1 | grep -q "UP"; then
                echo "✅ MidPoint is healthy"
              else
                echo "❌ MidPoint is NOT healthy"
              fi
              
              # Test 10: MidPoint REST API
              echo ""
              echo "[TEST 10] MidPoint REST API..."
              MP_RESPONSE=$(curl -s -u administrator:5ecr3t \
                -H "Accept: application/json" \
                "${MIDPOINT_URL}/ws/rest/self" 2>&1)
              
              if echo "$MP_RESPONSE" | grep -q "administrator"; then
                echo "✅ MidPoint REST API working"
              else
                echo "⚠️ MidPoint REST API response: ${MP_RESPONSE}"
              fi
              
              # Cleanup: Delete test user
              echo ""
              echo "[CLEANUP] Removing test user..."
              ldapdelete -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                "uid=${TEST_USER},cn=users,cn=accounts,dc=practice,dc=local" 2>&1 || echo "Could not delete test user"
              
              echo ""
              echo "=========================================="
              echo "End-to-End Test Complete"
              echo "=========================================="
