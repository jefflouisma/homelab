apiVersion: batch/v1
kind: Job
metadata:
  name: midpoint-create-freeipa-resource
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: create-resource
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl >/dev/null 2>&1
          
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          AUTH="administrator:2MEcz|Ra"
          
          echo "Getting LDAP connector OID..."
          CONNECTOR_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/connectors" | \
            grep -B5 "LdapConnector</connectorType>" | grep -v "AdLdap" | grep "oid=" | head -1 | \
            sed 's/.*oid="\([^"]*\)".*/\1/')
          
          echo "LDAP Connector OID: $CONNECTOR_OID"
          
          if [ -z "$CONNECTOR_OID" ]; then
            echo "ERROR: Could not find LDAP connector"
            exit 1
          fi
          
          echo ""
          echo "Creating FreeIPA resource..."
          
          cat > /tmp/resource.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <resource xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:ri="http://midpoint.evolveum.com/xml/ns/public/resource/instance-3"
                    xmlns:icfc="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/connector-schema-3"
                    xmlns:icfcldap="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/bundle/com.evolveum.polygon.connector-ldap/com.evolveum.polygon.connector.ldap.LdapConnector">
              <name>FreeIPA LDAP</name>
              <description>FreeIPA Identity Server</description>
              <connectorRef oid="CONNECTOR_OID_PLACEHOLDER" type="c:ConnectorType"/>
              <connectorConfiguration>
                  <icfc:configurationProperties>
                      <icfcldap:host>10.10.10.212</icfcldap:host>
                      <icfcldap:port>389</icfcldap:port>
                      <icfcldap:connectionSecurity>none</icfcldap:connectionSecurity>
                      <icfcldap:baseContext>dc=practice,dc=local</icfcldap:baseContext>
                      <icfcldap:bindDn>uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local</icfcldap:bindDn>
                      <icfcldap:bindPassword>
                          <c:clearValue>MidPointLDAP2024!</c:clearValue>
                      </icfcldap:bindPassword>
                      <icfcldap:pagingStrategy>auto</icfcldap:pagingStrategy>
                  </icfc:configurationProperties>
              </connectorConfiguration>
              <schemaHandling>
                  <objectType>
                      <kind>account</kind>
                      <intent>default</intent>
                      <displayName>FreeIPA User Account</displayName>
                      <default>true</default>
                      <objectClass>ri:inetOrgPerson</objectClass>
                      <baseContext>cn=users,cn=accounts,dc=practice,dc=local</baseContext>
                      <attribute>
                          <ref>ri:uid</ref>
                          <displayName>Username</displayName>
                          <outbound>
                              <source>
                                  <path>$c:name</path>
                              </source>
                          </outbound>
                          <inbound>
                              <target>
                                  <path>$c:name</path>
                              </target>
                          </inbound>
                      </attribute>
                      <attribute>
                          <ref>ri:cn</ref>
                          <displayName>Full Name</displayName>
                          <outbound>
                              <source>
                                  <path>$c:fullName</path>
                              </source>
                          </outbound>
                      </attribute>
                      <attribute>
                          <ref>ri:givenName</ref>
                          <displayName>First Name</displayName>
                          <outbound>
                              <source>
                                  <path>$c:givenName</path>
                              </source>
                          </outbound>
                      </attribute>
                      <attribute>
                          <ref>ri:sn</ref>
                          <displayName>Last Name</displayName>
                          <outbound>
                              <source>
                                  <path>$c:familyName</path>
                              </source>
                          </outbound>
                      </attribute>
                      <attribute>
                          <ref>ri:mail</ref>
                          <displayName>Email</displayName>
                          <outbound>
                              <source>
                                  <path>$c:emailAddress</path>
                              </source>
                          </outbound>
                      </attribute>
                      <attribute>
                          <ref>ri:userPassword</ref>
                          <displayName>Password</displayName>
                          <outbound>
                              <source>
                                  <path>$c:password</path>
                              </source>
                          </outbound>
                          <passwordOutbound>
                              <source>
                                  <path>$c:password</path>
                              </source>
                          </passwordOutbound>
                      </attribute>
                  </objectType>
              </schemaHandling>
              <synchronization>
                  <objectSynchronization>
                      <kind>account</kind>
                      <intent>default</intent>
                      <focusType>c:UserType</focusType>
                      <correlation>
                          <correlationExpression>
                              <script>
                                  <code>account.getAttributeValue('uid')</code>
                              </script>
                          </correlationExpression>
                      </correlation>
                      <reaction>
                          <synchronize>true</synchronize>
                      </reaction>
                  </objectSynchronization>
              </synchronization>
          </resource>
          EOF
          
          # Replace the placeholder with actual connector OID
          sed -i "s/CONNECTOR_OID_PLACEHOLDER/$CONNECTOR_OID/g" /tmp/resource.xml
          
          echo "Submitting resource to MidPoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
            -H "Content-Type: application/xml" \
            -X POST "${MIDPOINT_URL}/ws/rest/resources" \
            -d @/tmp/resource.xml)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Response code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ FreeIPA resource created successfully"
            RESOURCE_OID=$(echo "$RESPONSE" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//g')
            echo "Resource OID: $RESOURCE_OID"
            echo ""
            echo "Resource ready for user provisioning"
          else
            echo "❌ Failed to create resource"
            echo "$RESPONSE" | head -50
            exit 1
          fi
      restartPolicy: OnFailure
  backoffLimit: 3
