apiVersion: batch/v1
kind: Job
metadata:
  name: midpoint-freeipa-resource-import
  namespace: identity
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: alpine:3.19
          env:
            - name: MIDPOINT_URL
              value: "http://midpoint.identity.svc.cluster.local/midpoint"
            - name: MIDPOINT_USER
              value: "administrator"
            - name: MIDPOINT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: midpoint-admin-secret
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              
              echo "=========================================="
              echo "MidPoint FreeIPA Resource Import"
              echo "=========================================="
              
              # Wait for MidPoint
              echo "Waiting for MidPoint..."
              until curl -sf ${MIDPOINT_URL}/actuator/health 2>&1 | grep -q "UP"; do
                sleep 10
              done
              echo "MidPoint is ready"
              
              # Check if resource already exists
              echo ""
              echo "Checking if FreeIPA resource exists..."
              RESOURCE_OID="00000000-0000-0000-0000-000000000100"
              
              EXISTING=$(curl -s -w "%{http_code}" -o /tmp/resource.xml \
                -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                -H "Accept: application/xml" \
                "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}" 2>&1)
              
              if [ "$EXISTING" = "200" ]; then
                echo "FreeIPA resource already exists"
              else
                echo "Importing FreeIPA LDAP resource..."
                
                # Create simplified resource XML for import
                cat > /tmp/freeipa-resource.xml << 'XMLEOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <resource xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                        xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                        xmlns:ri="http://midpoint.evolveum.com/xml/ns/public/resource/instance-3"
                        xmlns:icfc="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/connector-schema-3"
                        xmlns:icfcldap="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/bundle/com.evolveum.polygon.connector-ldap/com.evolveum.polygon.connector.ldap.LdapConnector"
                        xmlns:q="http://prism.evolveum.com/xml/ns/public/query-3"
                        oid="00000000-0000-0000-0000-000000000100">
                  <name>FreeIPA LDAP</name>
                  <description>FreeIPA Identity Server - LDAP Connector for User Provisioning</description>
                  
                  <connectorRef type="ConnectorType">
                      <filter>
                          <q:equal>
                              <q:path>connectorType</q:path>
                              <q:value>com.evolveum.polygon.connector.ldap.LdapConnector</q:value>
                          </q:equal>
                      </filter>
                  </connectorRef>
                  
                  <connectorConfiguration>
                      <icfc:configurationProperties>
                          <icfcldap:host>10.10.10.212</icfcldap:host>
                          <icfcldap:port>389</icfcldap:port>
                          <icfcldap:connectionSecurity>none</icfcldap:connectionSecurity>
                          <icfcldap:baseContext>dc=practice,dc=local</icfcldap:baseContext>
                          <icfcldap:bindDn>uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local</icfcldap:bindDn>
                          <icfcldap:bindPassword>
                              <c:clearValue>MidPointLDAP2024!</c:clearValue>
                          </icfcldap:bindPassword>
                      </icfc:configurationProperties>
                  </connectorConfiguration>
                  
                  <schemaHandling>
                      <objectType>
                          <kind>account</kind>
                          <intent>default</intent>
                          <displayName>FreeIPA User</displayName>
                          <default>true</default>
                          <objectClass>ri:inetOrgPerson</objectClass>
                          
                          <attribute>
                              <ref>ri:dn</ref>
                              <outbound>
                                  <source><path>name</path></source>
                                  <expression>
                                      <script><code>'uid=' + name + ',cn=users,cn=accounts,dc=practice,dc=local'</code></script>
                                  </expression>
                              </outbound>
                          </attribute>
                          
                          <attribute>
                              <ref>ri:uid</ref>
                              <outbound>
                                  <strength>strong</strength>
                                  <source><path>name</path></source>
                              </outbound>
                          </attribute>
                          
                          <attribute>
                              <ref>ri:cn</ref>
                              <outbound>
                                  <source><path>fullName</path></source>
                              </outbound>
                          </attribute>
                          
                          <attribute>
                              <ref>ri:sn</ref>
                              <outbound>
                                  <source><path>familyName</path></source>
                              </outbound>
                          </attribute>
                          
                          <attribute>
                              <ref>ri:givenName</ref>
                              <outbound>
                                  <source><path>givenName</path></source>
                              </outbound>
                          </attribute>
                          
                          <attribute>
                              <ref>ri:mail</ref>
                              <outbound>
                                  <source><path>emailAddress</path></source>
                              </outbound>
                          </attribute>
                          
                          <credentials>
                              <password>
                                  <outbound/>
                              </password>
                          </credentials>
                          
                          <activation>
                              <administrativeStatus>
                                  <outbound/>
                              </administrativeStatus>
                          </activation>
                      </objectType>
                  </schemaHandling>
                  
                  <synchronization>
                      <objectSynchronization>
                          <enabled>true</enabled>
                          <correlation>
                              <q:equal>
                                  <q:path>name</q:path>
                                  <expression>
                                      <path>$account/attributes/uid</path>
                                  </expression>
                              </q:equal>
                          </correlation>
                          <reaction>
                              <situation>linked</situation>
                              <synchronize>true</synchronize>
                          </reaction>
                          <reaction>
                              <situation>unlinked</situation>
                              <action>link</action>
                          </reaction>
                          <reaction>
                              <situation>unmatched</situation>
                              <action>addFocus</action>
                          </reaction>
                      </objectSynchronization>
                  </synchronization>
              </resource>
              XMLEOF
                
                RESPONSE=$(curl -s -w "\n%{http_code}" -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                  -H "Content-Type: application/xml" \
                  -X POST "${MIDPOINT_URL}/ws/rest/resources" \
                  -d @/tmp/freeipa-resource.xml 2>&1)
                
                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                  echo "✅ FreeIPA resource imported"
                else
                  echo "Import response: $HTTP_CODE"
                  echo "$RESPONSE" | head -20
                fi
              fi
              
              # Test resource connection
              echo ""
              echo "Testing resource connection..."
              curl -s -X POST -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}/test" 2>&1 | head -5
              
              # Get jeff's OID
              echo ""
              echo "Finding user jeff..."
              JEFF_DATA=$(curl -s -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                -H "Accept: application/json" \
                "${MIDPOINT_URL}/ws/rest/users?name=jeff" 2>&1)
              
              JEFF_OID=$(echo "$JEFF_DATA" | jq -r '.object[0].oid // empty')
              
              if [ -z "$JEFF_OID" ]; then
                echo "User jeff not found in MidPoint"
                exit 0
              fi
              
              echo "Jeff OID: $JEFF_OID"
              
              # Assign FreeIPA resource to jeff
              echo ""
              echo "Assigning FreeIPA resource to jeff..."
              
              cat > /tmp/jeff-assignment.xml << XMLEOF
              <?xml version="1.0" encoding="UTF-8"?>
              <objectModification xmlns="http://midpoint.evolveum.com/xml/ns/public/common/api-types-3"
                                  xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                                  xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3">
                  <itemDelta>
                      <t:modificationType>add</t:modificationType>
                      <t:path>c:assignment</t:path>
                      <t:value>
                          <c:construction>
                              <c:resourceRef oid="${RESOURCE_OID}" type="c:ResourceType"/>
                          </c:construction>
                      </t:value>
                  </itemDelta>
              </objectModification>
              XMLEOF
              
              ASSIGN_RESPONSE=$(curl -s -w "\n%{http_code}" -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                -H "Content-Type: application/xml" \
                -X PATCH "${MIDPOINT_URL}/ws/rest/users/${JEFF_OID}" \
                -d @/tmp/jeff-assignment.xml 2>&1)
              
              HTTP_CODE=$(echo "$ASSIGN_RESPONSE" | tail -1)
              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ FreeIPA resource assigned to jeff"
              else
                echo "Assignment response: $HTTP_CODE"
                echo "$ASSIGN_RESPONSE" | head -30
              fi
              
              echo ""
              echo "=========================================="
              echo "FreeIPA Resource Import Complete"
              echo "=========================================="
