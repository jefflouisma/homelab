apiVersion: batch/v1
kind: Job
metadata:
  name: midpoint-create-provisioning-role
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: create-role
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl >/dev/null 2>&1
          
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          AUTH="administrator:2MEcz|Ra"
          
          echo "Creating FreeIPA Provisioning Role..."
          
          cat > /tmp/role.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <role xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                xmlns:ri="http://midpoint.evolveum.com/xml/ns/public/resource/instance-3">
              <name>FreeIPA User</name>
              <description>Role that provisions users to FreeIPA LDAP</description>
              <inducement>
                  <construction>
                      <resourceRef oid="00000000-0000-0000-0000-000000000100" type="c:ResourceType"/>
                      <kind>account</kind>
                      <intent>default</intent>
                  </construction>
              </inducement>
          </role>
          EOF
          
          echo "Creating role..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
            -H "Content-Type: application/xml" \
            -X POST "${MIDPOINT_URL}/ws/rest/roles" \
            -d @/tmp/role.xml)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ FreeIPA Provisioning Role created"
            ROLE_OID=$(echo "$RESPONSE" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//g')
            echo "Role OID: $ROLE_OID"
          else
            echo "❌ Failed to create role"
            echo "$RESPONSE" | head -30
            exit 1
          fi
          
          echo ""
          echo "Now you can create users with this role assignment"
      restartPolicy: OnFailure
  backoffLimit: 3
