apiVersion: batch/v1
kind: Job
metadata:
  name: opnsense-nat-config
  namespace: identity
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: config
          image: alpine:3.19
          env:
            - name: OPNSENSE_URL
              value: "https://192.168.1.1"
            - name: OPNSENSE_KEY
              value: "your-api-key"
            - name: OPNSENSE_SECRET
              value: "your-api-secret"
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              
              echo "=========================================="
              echo "OPNsense NAT Configuration"
              echo "=========================================="
              echo ""
              echo "NAT port forwards need to be configured manually or via Ansible."
              echo ""
              echo "Required NAT rules for 192.168.1.x access:"
              echo ""
              echo "1. Keycloak (for SSO):"
              echo "   External: 192.168.1.210:8080 -> Internal: 10.10.10.210:8080"
              echo ""
              echo "2. Test App:"  
              echo "   External: 192.168.1.220:80 -> Internal: 10.10.10.220:80"
              echo ""
              echo "Add these to OPNsense via:"
              echo "  Firewall -> NAT -> Port Forward"
              echo ""
              echo "Or update the Ansible playbook:"
              echo "  homepractice/ansible/playbooks/opnsense-configure.yml"
              echo ""
              echo "=========================================="
