apiVersion: batch/v1
kind: Job
metadata:
  name: midpoint-freeipa-twostage
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: create-resource
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl jq >/dev/null 2>&1
          
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          AUTH="administrator:2MEcz|Ra"
          
          echo "=========================================="
          echo "MidPoint FreeIPA Resource - Two-Stage REST"
          echo "=========================================="
          
          # =============================================
          # Stage 0: Get LDAP Connector OID
          # =============================================
          echo ""
          echo "Stage 0: Getting LDAP Connector OID..."
          
          CONNECTOR_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" \
            "${MIDPOINT_URL}/ws/rest/connectors" | \
            grep -B5 "com.evolveum.polygon.connector.ldap.LdapConnector</connectorType>" | \
            grep -v "AdLdap" | grep "oid=" | head -1 | \
            sed 's/.*oid="\([^"]*\)".*/\1/')
          
          if [ -z "$CONNECTOR_OID" ]; then
            echo "ERROR: Could not find LDAP connector"
            exit 1
          fi
          
          echo "LDAP Connector OID: $CONNECTOR_OID"
          
          # =============================================
          # Stage 1: Create Minimal Resource (XML)
          # =============================================
          echo ""
          echo "Stage 1: Creating minimal FreeIPA resource..."
          
          # Check if resource already exists
          if curl -s -u "$AUTH" -H "Accept: application/xml" \
            "${MIDPOINT_URL}/ws/rest/resources" | grep -q "FreeIPA"; then
            echo "Resource already exists, getting OID..."
            RESOURCE_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" \
              "${MIDPOINT_URL}/ws/rest/resources" | \
              grep -B1 "FreeIPA" | grep "oid=" | head -1 | \
              sed 's/.*oid="\([^"]*\)".*/\1/')
            echo "Existing Resource OID: $RESOURCE_OID"
          else
            # Create minimal resource with proper namespaces
            cat > /tmp/stage1-resource.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <resource xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                    xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3"
                    xmlns:icfc="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/connector-schema-3"
                    xmlns:icfcldap="http://midpoint.evolveum.com/xml/ns/public/connector/icf-1/bundle/com.evolveum.polygon.connector-ldap/com.evolveum.polygon.connector.ldap.LdapConnector">
              <name>FreeIPA LDAP</name>
              <description>FreeIPA Identity Server - Stage 1 Minimal</description>
              <connectorRef oid="CONNECTOR_OID_PLACEHOLDER" type="c:ConnectorType"/>
              <connectorConfiguration>
                  <icfc:configurationProperties>
                      <icfcldap:host>10.10.10.212</icfcldap:host>
                      <icfcldap:port>389</icfcldap:port>
                      <icfcldap:connectionSecurity>none</icfcldap:connectionSecurity>
                      <icfcldap:baseContext>dc=practice,dc=local</icfcldap:baseContext>
                      <icfcldap:bindDn>uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local</icfcldap:bindDn>
                      <icfcldap:bindPassword>
                          <t:clearValue>MidPointLDAP2024!</t:clearValue>
                      </icfcldap:bindPassword>
                      <icfcldap:pagingStrategy>auto</icfcldap:pagingStrategy>
                  </icfc:configurationProperties>
              </connectorConfiguration>
          </resource>
          XMLEOF
          
            # Replace placeholder with actual connector OID
            sed -i "s/CONNECTOR_OID_PLACEHOLDER/$CONNECTOR_OID/g" /tmp/stage1-resource.xml
            
            echo "Submitting Stage 1 resource..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
              -H "Content-Type: application/xml" \
              -H "Accept: application/xml" \
              -X POST "${MIDPOINT_URL}/ws/rest/resources" \
              -d @/tmp/stage1-resource.xml)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            echo "Response code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "201" ]; then
              echo "✅ Stage 1: Resource created"
              RESOURCE_OID=$(echo "$BODY" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//')
              echo "Resource OID: $RESOURCE_OID"
            elif [ "$HTTP_CODE" = "409" ]; then
              echo "Resource already exists (409)"
              RESOURCE_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" \
                "${MIDPOINT_URL}/ws/rest/resources" | \
                grep -B1 "FreeIPA" | grep "oid=" | head -1 | \
                sed 's/.*oid="\([^"]*\)".*/\1/')
            else
              echo "❌ Stage 1 failed"
              echo "$BODY" | head -30
              exit 1
            fi
          fi
          
          if [ -z "$RESOURCE_OID" ]; then
            echo "ERROR: Could not get resource OID"
            exit 1
          fi
          
          # =============================================
          # Stage 1.5: Test Connection
          # =============================================
          echo ""
          echo "Stage 1.5: Testing resource connection..."
          
          TEST_RESPONSE=$(curl -s -u "$AUTH" \
            -H "Content-Type: application/xml" \
            -H "Accept: application/xml" \
            -X POST "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}/test")
          
          if echo "$TEST_RESPONSE" | grep -q "success"; then
            echo "✅ Connection test successful"
          else
            echo "Connection test result:"
            echo "$TEST_RESPONSE" | head -20
            # Continue anyway - we'll add schemaHandling
          fi
          
          # =============================================
          # Stage 2: Add schemaHandling via object modification
          # =============================================
          echo ""
          echo "Stage 2: Adding schemaHandling..."
          
          cat > /tmp/stage2-schema.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <objectModification xmlns="http://midpoint.evolveum.com/xml/ns/public/common/api-types-3"
                              xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                              xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3"
                              xmlns:ri="http://midpoint.evolveum.com/xml/ns/public/resource/instance-3">
              <itemDelta>
                  <t:modificationType>add</t:modificationType>
                  <t:path>c:schemaHandling</t:path>
                  <t:value>
                      <c:objectType>
                          <c:kind>account</c:kind>
                          <c:intent>default</c:intent>
                          <c:displayName>FreeIPA User Account</c:displayName>
                          <c:default>true</c:default>
                          <c:objectClass>ri:inetOrgPerson</c:objectClass>
                          <c:attribute>
                              <c:ref>ri:uid</c:ref>
                              <c:displayName>Username</c:displayName>
                              <c:outbound>
                                  <c:source>
                                      <c:path>$user/name</c:path>
                                  </c:source>
                              </c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:cn</c:ref>
                              <c:displayName>Full Name</c:displayName>
                              <c:outbound>
                                  <c:source>
                                      <c:path>$user/fullName</c:path>
                                  </c:source>
                              </c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:sn</c:ref>
                              <c:displayName>Last Name</c:displayName>
                              <c:outbound>
                                  <c:source>
                                      <c:path>$user/familyName</c:path>
                                  </c:source>
                              </c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:givenName</c:ref>
                              <c:displayName>First Name</c:displayName>
                              <c:outbound>
                                  <c:source>
                                      <c:path>$user/givenName</c:path>
                                  </c:source>
                              </c:outbound>
                          </c:attribute>
                          <c:attribute>
                              <c:ref>ri:mail</c:ref>
                              <c:displayName>Email</c:displayName>
                              <c:outbound>
                                  <c:source>
                                      <c:path>$user/emailAddress</c:path>
                                  </c:source>
                              </c:outbound>
                          </c:attribute>
                      </c:objectType>
                  </t:value>
              </itemDelta>
          </objectModification>
          XMLEOF
          
          PATCH_RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
            -H "Content-Type: application/xml" \
            -H "Accept: application/xml" \
            -X PATCH "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}" \
            -d @/tmp/stage2-schema.xml)
          
          PATCH_CODE=$(echo "$PATCH_RESPONSE" | tail -1)
          
          if [ "$PATCH_CODE" = "200" ] || [ "$PATCH_CODE" = "204" ]; then
            echo "✅ Stage 2: schemaHandling added"
          else
            echo "Stage 2 response: $PATCH_CODE"
            echo "$PATCH_RESPONSE" | head -20
            # Continue - schemaHandling might already exist
          fi
          
          # =============================================
          # Final: Verify and test again
          # =============================================
          echo ""
          echo "Final: Verifying resource..."
          
          FINAL_TEST=$(curl -s -u "$AUTH" \
            -H "Accept: application/xml" \
            -X POST "${MIDPOINT_URL}/ws/rest/resources/${RESOURCE_OID}/test")
          
          if echo "$FINAL_TEST" | grep -q "success"; then
            echo "✅ FreeIPA resource ready for provisioning"
            echo "Resource OID: $RESOURCE_OID"
          else
            echo "Final test result:"
            echo "$FINAL_TEST" | grep -E "status|message" | head -10
          fi
          
          echo ""
          echo "=========================================="
          echo "Two-Stage Resource Creation Complete"
          echo "=========================================="
      restartPolicy: OnFailure
  backoffLimit: 3
