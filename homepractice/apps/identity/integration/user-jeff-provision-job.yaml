apiVersion: batch/v1
kind: Job
metadata:
  name: user-jeff-provision
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: provision
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl jq openldap-clients >/dev/null 2>&1
          
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          AUTH="administrator:2MEcz|Ra"
          KEYCLOAK_URL="http://keycloak.identity.svc.cluster.local"
          KC_PASSWORD="KeycloakAdmin2024!"
          IPA_SERVER="10.10.10.212"
          DM_PASSWORD="DirectoryServer2024!"
          
          echo "=========================================="
          echo "MidPoint IGA User Provisioning"
          echo "=========================================="
          
          # Step 1: Get FreeIPA User role OID
          echo ""
          echo "Step 1: Getting FreeIPA User role..."
          ROLE_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/roles" | \
            grep -E "oid=.*RoleType" | tail -1 | sed 's/.*oid="\([^"]*\)".*/\1/')
          
          if [ -z "$ROLE_OID" ]; then
            echo "ERROR: FreeIPA User role not found. Run midpoint-freeipa-setup first."
            exit 1
          fi
          echo "Role OID: $ROLE_OID"
          
          # Step 2: Check if jeff exists
          echo ""
          echo "Step 2: Checking if user exists..."
          JEFF_EXISTS=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/users" | grep "<name>jeff</name>")
          
          if [ -n "$JEFF_EXISTS" ]; then
            echo "User jeff already exists in MidPoint"
            JEFF_OID=$(curl -s -u "$AUTH" -H "Accept: application/xml" "${MIDPOINT_URL}/ws/rest/users" | \
              grep -B1 "<name>jeff</name>" | head -1 | sed 's/.*oid="\([^"]*\)".*/\1/')
            echo "User OID: $JEFF_OID"
          else
            echo "Creating user jeff with FreeIPA User role..."
            
            cat > /tmp/jeff.xml << XMLEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <user xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                xmlns:c="http://midpoint.evolveum.com/xml/ns/public/common/common-3"
                xmlns:t="http://prism.evolveum.com/xml/ns/public/types-3">
              <name>jeff</name>
              <givenName>Jeff</givenName>
              <familyName>Louis</familyName>
              <fullName>Jeff Louis</fullName>
              <emailAddress>jeff@practice.local</emailAddress>
              <credentials>
                  <password>
                      <value>
                          <t:clearValue>Gitready1!</t:clearValue>
                      </value>
                  </password>
              </credentials>
              <assignment>
                  <targetRef oid="$ROLE_OID" type="c:RoleType"/>
              </assignment>
          </user>
          XMLEOF
          
            RESPONSE=$(curl -s -w "\n%{http_code}" -u "$AUTH" \
              -H "Content-Type: application/xml" \
              -X POST "${MIDPOINT_URL}/ws/rest/users" \
              -d @/tmp/jeff.xml)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            if [ "$HTTP_CODE" = "201" ]; then
              echo "✅ User jeff created in MidPoint"
              JEFF_OID=$(echo "$RESPONSE" | grep -o 'oid="[^"]*"' | head -1 | sed 's/oid="//;s/"//')
            else
              echo "Create response: $HTTP_CODE"
            fi
          fi
          
          # Step 3: Trigger reconciliation
          echo ""
          echo "Step 3: Triggering provisioning reconciliation..."
          if [ -n "$JEFF_OID" ]; then
            curl -s -u "$AUTH" -X POST "${MIDPOINT_URL}/ws/rest/users/${JEFF_OID}?options=reconcile" \
              -H "Content-Type: application/xml" \
              -d '<objectModification xmlns="http://midpoint.evolveum.com/xml/ns/public/common/api-types-3"/>' >/dev/null
            echo "Reconciliation triggered"
          fi
          
          # Step 4: Verify FreeIPA provisioning
          echo ""
          echo "Step 4: Waiting for FreeIPA provisioning..."
          sleep 15
          
          if ldapsearch -x -H ldap://${IPA_SERVER}:389 -D "cn=Directory Manager" -w "${DM_PASSWORD}" \
            -b "cn=users,cn=accounts,dc=practice,dc=local" "(uid=jeff)" uid 2>&1 | grep -q "uid: jeff"; then
            echo "✅ User jeff provisioned to FreeIPA"
          else
            echo "❌ User not in FreeIPA yet"
          fi
          
          # Step 5: Trigger Keycloak sync
          echo ""
          echo "Step 5: Syncing to Keycloak..."
          
          TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=${KC_PASSWORD}&grant_type=password&client_id=admin-cli" | jq -r .access_token)
          
          LDAP_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "${KEYCLOAK_URL}/admin/realms/practice/components?type=org.keycloak.storage.UserStorageProvider" | jq -r ".[0].id")
          
          SYNC=$(curl -s -X POST -H "Authorization: Bearer ${TOKEN}" \
            "${KEYCLOAK_URL}/admin/realms/practice/user-storage/${LDAP_ID}/sync?action=triggerFullSync")
          echo "Sync: $SYNC"
          
          sleep 5
          
          # Step 6: Set WebAuthn required actions
          echo ""
          echo "Step 6: Setting WebAuthn required actions..."
          
          JEFF_KC=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "${KEYCLOAK_URL}/admin/realms/practice/users?username=jeff" | jq -r ".[0].id")
          
          if [ -n "$JEFF_KC" ] && [ "$JEFF_KC" != "null" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/users/${JEFF_KC}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"requiredActions": ["UPDATE_PASSWORD", "webauthn-register-passwordless"]}'
            echo "✅ WebAuthn required actions set"
          fi
          
          echo ""
          echo "=========================================="
          echo "Provisioning Complete"
          echo "=========================================="
          echo "Flow: MidPoint → FreeIPA → Keycloak"
          echo "User: jeff"
          echo "Password: Gitready1!"
          echo "Required: Change password + Register WebAuthn"
          echo "=========================================="
      restartPolicy: OnFailure
  backoffLimit: 3
