apiVersion: batch/v1
kind: Job
metadata:
  name: provision-user-jeff
  namespace: identity
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: alpine:3.19
          env:
            - name: MIDPOINT_URL
              value: "http://midpoint.identity.svc.cluster.local/midpoint"
            - name: MIDPOINT_USER
              value: "administrator"
            - name: MIDPOINT_PASSWORD
              value: "5ecr3t"
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              
              echo "=========================================="
              echo "Provisioning User 'jeff' via MidPoint"
              echo "=========================================="
              
              echo "Waiting for MidPoint to be ready..."
              until curl -sf ${MIDPOINT_URL}/actuator/health 2>&1 | grep -q "UP"; do
                echo "MidPoint not ready, waiting..."
                sleep 10
              done
              echo "MidPoint is ready"
              
              # Check if user already exists
              echo "Checking if user 'jeff' already exists..."
              EXISTING=$(curl -s -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                -H "Accept: application/json" \
                "${MIDPOINT_URL}/ws/rest/users?name=jeff" 2>&1)
              
              if echo "$EXISTING" | grep -q '"name":"jeff"'; then
                echo "User 'jeff' already exists in MidPoint"
                exit 0
              fi
              
              echo "Creating user 'jeff' in MidPoint..."
              
              # Create user XML payload (MidPoint prefers XML for complex objects)
              cat > /tmp/user-jeff.xml << 'USERXML'
              <?xml version="1.0" encoding="UTF-8"?>
              <user xmlns="http://midpoint.evolveum.com/xml/ns/public/common/common-3">
                  <name>jeff</name>
                  <fullName>Jeff Louis</fullName>
                  <givenName>Jeff</givenName>
                  <familyName>Louis</familyName>
                  <emailAddress>jeff@practice.local</emailAddress>
                  <credentials>
                      <password>
                          <value>
                              <clearValue>gitready</clearValue>
                          </value>
                          <forceChange>true</forceChange>
                      </password>
                  </credentials>
                  <activation>
                      <administrativeStatus>enabled</administrativeStatus>
                  </activation>
              </user>
              USERXML
              
              # Create user via REST API
              RESPONSE=$(curl -s -w "\n%{http_code}" -u ${MIDPOINT_USER}:${MIDPOINT_PASSWORD} \
                -H "Content-Type: application/xml" \
                -X POST "${MIDPOINT_URL}/ws/rest/users" \
                -d @/tmp/user-jeff.xml 2>&1)
              
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')
              
              echo "Response code: $HTTP_CODE"
              echo "Response body: $BODY"
              
              if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ User 'jeff' created successfully in MidPoint"
              else
                echo "⚠️ User creation response: $HTTP_CODE"
              fi
              
              # Wait for provisioning to FreeIPA (MidPoint clockwork)
              echo ""
              echo "Waiting for MidPoint to provision user to FreeIPA..."
              sleep 30
              
              # Verify user was provisioned to FreeIPA
              echo "Verifying user in FreeIPA LDAP..."
              apk add --no-cache openldap-clients
              
              if ldapsearch -x -H ldap://10.10.10.212:389 \
                -D "cn=Directory Manager" \
                -w "DirectoryServer2024!" \
                -b "cn=users,cn=accounts,dc=practice,dc=local" \
                "(uid=jeff)" uid mail 2>&1 | grep -q "uid: jeff"; then
                echo "✅ User 'jeff' found in FreeIPA LDAP - provisioning complete!"
              else
                echo "⚠️ User 'jeff' not yet in FreeIPA (may need resource assignment)"
              fi
              
              echo ""
              echo "=========================================="
              echo "User Provisioning Complete"
              echo "=========================================="
