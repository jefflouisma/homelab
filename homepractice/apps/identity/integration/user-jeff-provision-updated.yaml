apiVersion: batch/v1
kind: Job
metadata:
  name: user-jeff-provision-updated
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: provision-user
        image: alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          apk add --no-cache curl jq openldap-clients >/dev/null 2>&1
          
          # Configuration
          MIDPOINT_URL="http://midpoint.identity.svc.cluster.local/midpoint"
          MIDPOINT_USER="administrator"
          MIDPOINT_PASSWORD="2MEcz|Ra"
          IPA_SERVER="10.10.10.212"
          IPA_DM_PASSWORD="DirectoryServer2024!"
          KEYCLOAK_URL="http://keycloak.identity.svc.cluster.local"
          KEYCLOAK_ADMIN_PASSWORD="KeycloakAdmin2024!"
          
          echo "=========================================="
          echo "MidPoint IGA User Provisioning"
          echo "=========================================="
          echo ""
          
          # Step 1: Check if user already exists
          echo "Step 1: Checking if user 'jeff' exists in MidPoint..."
          EXISTING=$(curl -s -u "${MIDPOINT_USER}:${MIDPOINT_PASSWORD}" \
            -H "Accept: application/json" \
            "${MIDPOINT_URL}/ws/rest/users?name=jeff" 2>&1)
          
          if echo "$EXISTING" | grep -q '"name".*jeff'; then
            echo "User 'jeff' already exists in MidPoint"
            USER_OID=$(echo "$EXISTING" | jq -r '.object[0].oid // empty')
            echo "User OID: $USER_OID"
          else
            echo "Creating user jeff in MidPoint with FreeIPA role assignment..."
            
            # First get the FreeIPA User role OID
            ROLE_OID=$(curl -s -u "${MIDPOINT_USER}:${MIDPOINT_PASSWORD}" -H "Accept: application/json" "${MIDPOINT_URL}/ws/rest/roles?name=FreeIPA%20User" | \
              jq -r '.object[0].oid // empty')
            
            if [ -z "$ROLE_OID" ]; then
              echo "ERROR: FreeIPA User role not found"
              exit 1
            fi
            
            echo "FreeIPA User Role OID: $ROLE_OID"
            
            # Create user with role assignment
            cat > /tmp/user.json << EOF
          {
            "user": {
              "name": "jeff",
              "givenName": "Jeff",
              "familyName": "Louis",
              "fullName": "Jeff Louis",
              "emailAddress": "jeff@practice.local",
              "credentials": {
                "password": {
                  "value": {
                    "clearValue": "Gitready1!"
                  }
                }
              },
              "assignment": [
                {
                  "targetRef": {
                    "oid": "$ROLE_OID",
                    "type": "c:RoleType"
                  }
                }
              ]
            }
          }
          EOF
          
            RESPONSE=$(curl -s -w "\n%{http_code}" -u "${MIDPOINT_USER}:${MIDPOINT_PASSWORD}" \
              -H "Content-Type: application/json" \
              -X POST "${MIDPOINT_URL}/ws/rest/users" \
              -d @/tmp/user.json 2>&1)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            if [ "$HTTP_CODE" = "201" ]; then
              echo "✅ User 'jeff' created in MidPoint IGA"
              USER_OID=$(echo "$BODY" | jq -r '.oid // empty')
              echo "User OID: $USER_OID"
            else
              echo "❌ Failed to create user"
              echo "Response: $HTTP_CODE"
              echo "$BODY"
              exit 1
            fi
          fi
          
          # Step 2: Trigger reconciliation to ensure provisioning
          echo ""
          echo "Step 2: Triggering reconciliation for user provisioning..."
          RECONCILE=$(curl -s -u "${MIDPOINT_USER}:${MIDPOINT_PASSWORD}" \
            -X POST "${MIDPOINT_URL}/ws/rest/users/${USER_OID}?options=reconcile" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Reconciliation triggered"
          
          # Step 3: Verify user propagated to FreeIPA
          echo ""
          echo "Step 3: Waiting for MidPoint to provision to FreeIPA..."
          sleep 15
          
          echo "Checking FreeIPA LDAP for user 'jeff'..."
          if ldapsearch -x -H ldap://${IPA_SERVER}:389 \
            -D "cn=Directory Manager" \
            -w "${IPA_DM_PASSWORD}" \
            -b "cn=users,cn=accounts,dc=practice,dc=local" \
            "(uid=jeff)" uid 2>&1 | grep -q "uid: jeff"; then
            echo "✅ User 'jeff' found in FreeIPA (provisioned by MidPoint)"
          else
            echo "❌ User not yet in FreeIPA - checking MidPoint resource status"
            echo "   (User exists in MidPoint IGA - resource may need manual configuration)"
          fi
          
          # Step 4: Trigger Keycloak LDAP sync
          echo ""
          echo "Step 4: Triggering Keycloak LDAP federation sync..."
          
          TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin" \
            -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
            -d "grant_type=password" \
            -d "client_id=admin-cli" | jq -r '.access_token')
          
          LDAP_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "${KEYCLOAK_URL}/admin/realms/practice/components?type=org.keycloak.storage.UserStorageProvider" | \
            jq -r '.[0].id // empty')
          
          if [ -n "$LDAP_ID" ]; then
            SYNC_RESULT=$(curl -s -X POST -H "Authorization: Bearer ${TOKEN}" \
              "${KEYCLOAK_URL}/admin/realms/practice/user-storage/${LDAP_ID}/sync?action=triggerFullSync")
            echo "LDAP Sync result: $SYNC_RESULT"
          fi
          
          # Step 5: Set Keycloak required actions
          echo ""
          echo "Step 5: Setting WebAuthn required actions in Keycloak..."
          sleep 5
          
          JEFF_KC_ID=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
            "${KEYCLOAK_URL}/admin/realms/practice/users?username=jeff" | jq -r '.[0].id // empty')
          
          if [ -n "$JEFF_KC_ID" ]; then
            echo "Found jeff in Keycloak: $JEFF_KC_ID"
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/users/${JEFF_KC_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"requiredActions": ["UPDATE_PASSWORD", "webauthn-register-passwordless"]}'
            echo "✅ WebAuthn required actions set"
          else
            echo "Jeff not yet in Keycloak (will sync on next LDAP interval)"
          fi
          
          echo ""
          echo "=========================================="
          echo "Enterprise IGA Provisioning Complete"
          echo "=========================================="
          echo ""
          echo "Source of Truth: MidPoint IGA"
          echo "User: jeff"
          echo "Temp Password: Gitready1!"
          echo "Required: Change password + Register WebAuthn"
          echo "=========================================="
      restartPolicy: OnFailure
  backoffLimit: 3
