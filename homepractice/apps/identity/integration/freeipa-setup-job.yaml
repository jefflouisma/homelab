apiVersion: batch/v1
kind: Job
metadata:
  name: freeipa-service-accounts-setup
  namespace: identity
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine:3.19
          env:
            - name: IPA_SERVER
              value: "10.10.10.212"
            - name: IPA_DM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin-secret
                  key: ds-password
            - name: KEYCLOAK_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin-secret
                  key: keycloak-ldap-password
            - name: MIDPOINT_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin-secret
                  key: midpoint-ldap-password
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache openldap-clients
              
              echo "Waiting for FreeIPA LDAP to be ready..."
              until ldapsearch -x -H ldap://${IPA_SERVER}:389 -b "" -s base "(objectclass=*)" >/dev/null 2>&1; do
                echo "FreeIPA not ready, waiting..."
                sleep 10
              done
              echo "FreeIPA LDAP is ready"
              
              echo "Creating system accounts in FreeIPA cn=sysaccounts..."
              
              # Create keycloak-service system account
              cat > /tmp/keycloak-sysaccount.ldif << EOF
              dn: uid=keycloak-service,cn=sysaccounts,cn=etc,dc=practice,dc=local
              changetype: add
              objectClass: account
              objectClass: simpleSecurityObject
              uid: keycloak-service
              userPassword: ${KEYCLOAK_LDAP_PASSWORD}
              passwordExpirationTime: 20380119031407Z
              nsIdleTimeout: 0
              EOF
              
              # Create midpoint-service system account
              cat > /tmp/midpoint-sysaccount.ldif << EOF
              dn: uid=midpoint-service,cn=sysaccounts,cn=etc,dc=practice,dc=local
              changetype: add
              objectClass: account
              objectClass: simpleSecurityObject
              uid: midpoint-service
              userPassword: ${MIDPOINT_LDAP_PASSWORD}
              passwordExpirationTime: 20380119031407Z
              nsIdleTimeout: 0
              EOF
              
              # Apply via ldapmodify as Directory Manager
              ldapmodify -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                -f /tmp/keycloak-sysaccount.ldif 2>&1 || echo "Keycloak sysaccount may already exist"
              
              ldapmodify -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                -f /tmp/midpoint-sysaccount.ldif 2>&1 || echo "MidPoint sysaccount may already exist"
              
              echo "Verifying service accounts..."
              ldapsearch -x -H ldap://${IPA_SERVER}:389 \
                -D "cn=Directory Manager" \
                -w "${IPA_DM_PASSWORD}" \
                -b "cn=sysaccounts,cn=etc,dc=practice,dc=local" "(objectclass=account)" uid
              
              echo "Service accounts setup complete"
