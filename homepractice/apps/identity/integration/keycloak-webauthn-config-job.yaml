apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-webauthn-config
  namespace: identity
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: config
          image: alpine:3.19
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.identity.svc.cluster.local"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-password
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq
              
              echo "=========================================="
              echo "Configuring Keycloak WebAuthn Passwordless"
              echo "=========================================="
              
              echo "Waiting for Keycloak to be ready..."
              until curl -sf ${KEYCLOAK_URL}/realms/master >/dev/null 2>&1; do
                echo "Keycloak not ready, waiting..."
                sleep 10
              done
              echo "Keycloak is ready"
              
              # Get admin token
              echo "Getting admin token..."
              TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=admin" \
                -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | jq -r '.access_token')
              
              if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
                echo "Failed to get admin token"
                exit 1
              fi
              echo "Got admin token"
              
              # Check if practice realm exists
              if ! curl -sf -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice" >/dev/null 2>&1; then
                echo "Practice realm does not exist, skipping WebAuthn config"
                exit 0
              fi
              
              # Step 1: Enable WebAuthn Register Passwordless as default required action
              echo ""
              echo "Step 1: Enabling WebAuthn Register Passwordless required action..."
              curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/required-actions/webauthn-register-passwordless" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{
                  "alias": "webauthn-register-passwordless",
                  "name": "Webauthn Register Passwordless",
                  "providerId": "webauthn-register-passwordless",
                  "enabled": true,
                  "defaultAction": true,
                  "priority": 70
                }'
              echo "✅ WebAuthn Passwordless required action enabled"
              
              # Step 2: Configure WebAuthn Passwordless Policy
              echo ""
              echo "Step 2: Configuring WebAuthn Passwordless Policy..."
              curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{
                  "webAuthnPolicyPasswordlessRpEntityName": "Practice Homelab",
                  "webAuthnPolicyPasswordlessSignatureAlgorithms": ["ES256", "RS256"],
                  "webAuthnPolicyPasswordlessRpId": "",
                  "webAuthnPolicyPasswordlessAttestationConveyancePreference": "not specified",
                  "webAuthnPolicyPasswordlessAuthenticatorAttachment": "not specified",
                  "webAuthnPolicyPasswordlessRequireResidentKey": "not specified",
                  "webAuthnPolicyPasswordlessUserVerificationRequirement": "required",
                  "webAuthnPolicyPasswordlessCreateTimeout": 0,
                  "webAuthnPolicyPasswordlessAvoidSameAuthenticatorRegister": false
                }'
              echo "✅ WebAuthn Passwordless policy configured"
              
              # Step 3: Create Passwordless First authentication flow
              # This flow structure:
              #   Cookie (ALTERNATIVE) - for existing sessions
              #   Username Form (REQUIRED) - identify user first
              #   Auth Choice (REQUIRED) - subflow for auth method
              #     ├── WebAuthn Passwordless (ALTERNATIVE) - passkey option
              #     └── Password Form (ALTERNATIVE) - password fallback
              echo ""
              echo "Step 3: Creating Passwordless First authentication flow..."
              
              # Delete old flow if exists
              OLD_FLOW=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows" | \
                jq -r '.[] | select(.alias=="Passwordless First") | .id')
              if [ -n "$OLD_FLOW" ]; then
                curl -s -X DELETE "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/$OLD_FLOW" \
                  -H "Authorization: Bearer ${TOKEN}"
                echo "Deleted existing Passwordless First flow"
              fi
              
              # Create new flow
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"alias":"Passwordless First","providerId":"basic-flow","topLevel":true}'
              echo "Created Passwordless First flow"
              
              # Step 4: Add executions to the flow
              echo ""
              echo "Step 4: Adding authenticators to flow..."
              
              # Add cookie authenticator
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions/execution" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"provider":"auth-cookie"}'
              
              # Add username form
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions/execution" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"provider":"auth-username-form"}'
              
              # Add auth choice subflow
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions/flow" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"alias":"Auth Choice","type":"basic-flow"}'
              
              # Add WebAuthn Passwordless to subflow
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Auth%20Choice/executions/execution" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"provider":"webauthn-authenticator-passwordless"}'
              
              # Add password form to subflow
              curl -s -X POST "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Auth%20Choice/executions/execution" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"provider":"auth-password-form"}'
              echo "✅ Authenticators added"
              
              # Step 5: Set execution requirements
              echo ""
              echo "Step 5: Setting execution requirements..."
              EXECS=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions")
              
              # Cookie -> ALTERNATIVE
              echo "$EXECS" | jq -r '.[] | select(.providerId=="auth-cookie") | .id' | while read ID; do
                curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$ID\",\"requirement\":\"ALTERNATIVE\"}"
              done
              
              # Username Form -> REQUIRED
              echo "$EXECS" | jq -r '.[] | select(.providerId=="auth-username-form") | .id' | while read ID; do
                curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$ID\",\"requirement\":\"REQUIRED\"}"
              done
              
              # Auth Choice subflow -> REQUIRED
              echo "$EXECS" | jq -r '.[] | select(.displayName=="Auth Choice") | .id' | while read ID; do
                curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$ID\",\"requirement\":\"REQUIRED\"}"
              done
              
              # WebAuthn Passwordless -> ALTERNATIVE
              echo "$EXECS" | jq -r '.[] | select(.providerId=="webauthn-authenticator-passwordless") | .id' | while read ID; do
                curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$ID\",\"requirement\":\"ALTERNATIVE\"}"
              done
              
              # Password Form -> ALTERNATIVE
              echo "$EXECS" | jq -r '.[] | select(.providerId=="auth-password-form") | .id' | while read ID; do
                curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/flows/Passwordless%20First/executions" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"id\":\"$ID\",\"requirement\":\"ALTERNATIVE\"}"
              done
              echo "✅ Execution requirements set"
              
              # Step 6: Bind flow as browser flow
              echo ""
              echo "Step 6: Binding Passwordless First as browser flow..."
              curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"browserFlow":"Passwordless First"}'
              echo "✅ Browser flow bound"
              
              # Step 7: Enable UPDATE_PASSWORD required action for first login
              echo ""
              echo "Step 7: Enabling UPDATE_PASSWORD required action..."
              curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/practice/authentication/required-actions/UPDATE_PASSWORD" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{
                  "alias": "UPDATE_PASSWORD",
                  "name": "Update Password",
                  "providerId": "UPDATE_PASSWORD",
                  "enabled": true,
                  "defaultAction": false,
                  "priority": 30
                }'
              echo "✅ UPDATE_PASSWORD action enabled"
              
              echo ""
              echo "=========================================="
              echo "WebAuthn Configuration Complete"
              echo "=========================================="
              echo ""
              echo "Authentication Flow Structure:"
              echo "  Passwordless First (browser flow)"
              echo "  ├── Cookie (ALTERNATIVE)"
              echo "  ├── Username Form (REQUIRED)"
              echo "  └── Auth Choice (REQUIRED)"
              echo "      ├── WebAuthn Passwordless (ALTERNATIVE)"
              echo "      └── Password Form (ALTERNATIVE)"
              echo ""
              echo "User onboarding flow:"
              echo "1. Login with temp password"
              echo "2. Forced to change password"
              echo "3. Prompted to register WebAuthn (passkey)"
              echo "4. Future logins show passkey first, password as fallback"
