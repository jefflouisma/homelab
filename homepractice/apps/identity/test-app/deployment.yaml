apiVersion: v1
kind: Namespace
metadata:
  name: test-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-app-config
  namespace: test-app
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        location /api/userinfo {
            default_type application/json;
            return 200 '{"authenticated": true, "source": "nginx-test-app"}';
        }
    }
  
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HomePractice SSO Test App</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/keycloak-js@26.0.0/dist/keycloak.min.js"></script>
    </head>
    <body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen">
        <div class="container mx-auto px-4 py-8">
            <div class="max-w-2xl mx-auto">
                <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold text-white mb-2">🔐 HomePractice SSO Test</h1>
                        <p class="text-slate-400">WebAuthn Passwordless Authentication Demo</p>
                    </div>
                    
                    <div id="loading" class="text-center py-8">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                        <p class="text-slate-400 mt-4">Initializing Keycloak...</p>
                    </div>
                    
                    <div id="login-section" class="hidden">
                        <div class="text-center py-8">
                            <div class="w-20 h-20 bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </div>
                            <p class="text-slate-400 mb-6">Please authenticate to continue</p>
                            <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition-all duration-200 transform hover:scale-105">
                                Login with Keycloak
                            </button>
                        </div>
                    </div>
                    
                    <div id="user-section" class="hidden">
                        <div class="bg-green-900/30 border border-green-700 rounded-xl p-4 mb-6">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-green-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span class="text-green-400 font-semibold">Authentication Successful!</span>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            <div class="bg-slate-700/50 rounded-lg p-4">
                                <label class="text-slate-400 text-sm">Username</label>
                                <p id="user-name" class="text-white text-lg font-semibold"></p>
                            </div>
                            
                            <div class="bg-slate-700/50 rounded-lg p-4">
                                <label class="text-slate-400 text-sm">Full Name</label>
                                <p id="user-fullname" class="text-white text-lg font-semibold"></p>
                            </div>
                            
                            <div class="bg-slate-700/50 rounded-lg p-4">
                                <label class="text-slate-400 text-sm">Email</label>
                                <p id="user-email" class="text-white text-lg font-semibold"></p>
                            </div>
                            
                            <div class="bg-slate-700/50 rounded-lg p-4">
                                <label class="text-slate-400 text-sm">Roles</label>
                                <p id="user-roles" class="text-white text-lg font-semibold"></p>
                            </div>
                            
                            <div class="bg-slate-700/50 rounded-lg p-4">
                                <label class="text-slate-400 text-sm">Token Expires</label>
                                <p id="token-exp" class="text-white text-lg font-semibold"></p>
                            </div>
                        </div>
                        
                        <div class="mt-6 flex gap-4">
                            <button id="refresh-btn" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-3 px-6 rounded-lg transition-all">
                                Refresh Token
                            </button>
                            <button id="logout-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition-all">
                                Logout
                            </button>
                        </div>
                    </div>
                    
                    <div id="error-section" class="hidden">
                        <div class="bg-red-900/30 border border-red-700 rounded-xl p-4">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span class="text-red-400 font-semibold">Authentication Error</span>
                            </div>
                            <p id="error-message" class="text-red-300 mt-2"></p>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-6 text-slate-500 text-sm">
                    <p>HomePractice Identity Stack • Keycloak + FreeIPA + MidPoint</p>
                </div>
            </div>
        </div>
        
        <script>
            // Keycloak configuration - using external IP for browser access
            const keycloakConfig = {
                url: 'http://192.168.1.40:8080',
                realm: 'practice',
                clientId: 'test-app'
            };
            
            let keycloak;
            
            function showSection(sectionId) {
                ['loading', 'login-section', 'user-section', 'error-section'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
                document.getElementById(sectionId).classList.remove('hidden');
            }
            
            function showError(message) {
                document.getElementById('error-message').textContent = message;
                showSection('error-section');
            }
            
            function displayUserInfo() {
                const tokenParsed = keycloak.tokenParsed;
                document.getElementById('user-name').textContent = tokenParsed.preferred_username || 'N/A';
                document.getElementById('user-fullname').textContent = tokenParsed.name || `${tokenParsed.given_name || ''} ${tokenParsed.family_name || ''}`.trim() || 'N/A';
                document.getElementById('user-email').textContent = tokenParsed.email || 'N/A';
                document.getElementById('user-roles').textContent = (tokenParsed.realm_access?.roles || []).join(', ') || 'None';
                
                const expDate = new Date(tokenParsed.exp * 1000);
                document.getElementById('token-exp').textContent = expDate.toLocaleString();
                
                showSection('user-section');
            }
            
            async function initKeycloak() {
                try {
                    keycloak = new Keycloak(keycloakConfig);
                    
                    const authenticated = await keycloak.init({
                        onLoad: 'check-sso',
                        silentCheckSsoRedirectUri: window.location.origin + '/silent-check-sso.html',
                        checkLoginIframe: false
                    });
                    
                    if (authenticated) {
                        displayUserInfo();
                    } else {
                        showSection('login-section');
                    }
                } catch (error) {
                    console.error('Keycloak init failed:', error);
                    showError(`Failed to initialize Keycloak: ${error.message || error}`);
                }
            }
            
            document.getElementById('login-btn').addEventListener('click', () => {
                keycloak.login();
            });
            
            document.getElementById('logout-btn').addEventListener('click', () => {
                keycloak.logout({ redirectUri: window.location.origin });
            });
            
            document.getElementById('refresh-btn').addEventListener('click', async () => {
                try {
                    await keycloak.updateToken(30);
                    displayUserInfo();
                } catch (error) {
                    showError('Failed to refresh token');
                }
            });
            
            // Initialize on page load
            initKeycloak();
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: config
          configMap:
            name: test-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: test-app
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.10.10.220"
spec:
  type: LoadBalancer
  selector:
    app: test-app
  ports:
    - port: 80
      targetPort: 80
