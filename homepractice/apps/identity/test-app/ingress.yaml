---
# TLS Secret for Test App namespace
apiVersion: v1
kind: Secret
metadata:
  name: testapp-tls
  namespace: test-app
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# Test App Ingress - HTTPS with TLS termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testapp-ingress
  namespace: test-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - testapp.practice.local
      secretName: testapp-tls
  rules:
    - host: testapp.practice.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-app
                port:
                  number: 80
