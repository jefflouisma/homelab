apiVersion: v1
kind: Service
metadata:
  name: midpoint
  namespace: identity
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.10.211
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: midpoint
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: midpoint-home-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: midpoint
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midpoint
  template:
    metadata:
      labels:
        app: midpoint
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-postgres-secret
                  key: midpoint-password
          command:
            - sh
            - -c
            - |
              until pg_isready -h identity-postgres-postgresql.identity.svc.cluster.local -p 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
      containers:
        - name: midpoint
          image: evolveum/midpoint:4.9.1-alpine
          ports:
            - containerPort: 8080
          env:
            - name: MP_SET_midpoint_repository_type
              value: native
            - name: MP_SET_midpoint_repository_database
              value: postgresql
            - name: MP_SET_midpoint_repository_jdbcUrl
              value: jdbc:postgresql://identity-postgres-postgresql.identity.svc.cluster.local:5432/midpoint
            - name: MP_SET_midpoint_repository_jdbcUsername
              value: midpoint
            - name: MP_SET_midpoint_repository_jdbcPassword
              valueFrom:
                secretKeyRef:
                  name: identity-postgres-secret
                  key: midpoint-password
            - name: MP_SET_midpoint_keystore_keyStorePath
              value: /opt/midpoint/var/keystore.jceks
            - name: MP_SET_midpoint_keystore_keyStorePassword
              value: changeit
            - name: MP_SET_midpoint_keystore_encryptionKeyAlias
              value: default
            - name: MP_MEM_MAX
              value: 2048m
            - name: MP_MEM_INIT
              value: 1024m
          volumeMounts:
            - name: midpoint-home
              mountPath: /opt/midpoint/var
            - name: keystore
              mountPath: /opt/midpoint/var/keystore.jceks
              subPath: keystore.jceks
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: midpoint-home
          persistentVolumeClaim:
            claimName: midpoint-home-pvc
        - name: keystore
          secret:
            secretName: midpoint-keystore
