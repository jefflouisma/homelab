apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-postgres-postgresql
  namespace: identity
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.10.213
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: identity
data:
  init.sql: |
    -- Create databases for identity stack
    CREATE DATABASE keycloak;
    CREATE DATABASE midpoint;
    -- Create users
    CREATE USER keycloak WITH PASSWORD 'KeycloakDB2024!';
    CREATE USER midpoint WITH PASSWORD 'MidPointDB2024!';
    -- Grant privileges
    GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    GRANT ALL PRIVILEGES ON DATABASE midpoint TO midpoint;
    -- Connect to each database and grant schema privileges
    \c keycloak
    GRANT ALL ON SCHEMA public TO keycloak;
    \c midpoint
    GRANT ALL ON SCHEMA public TO midpoint;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-postgres-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init
