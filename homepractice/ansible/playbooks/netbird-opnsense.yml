---
# Ansible playbook to configure NetBird on OPNsense via REST API
# This enables GitOps-style management of the OPNsense NetBird plugin
#
# Usage:
#   ansible-playbook -i inventory.yml playbooks/netbird-opnsense.yml
#
# Prerequisites:
#   - OPNsense os-netbird plugin installed
#   - OPNsense API key and secret configured
#   - NetBird setup key created (via setup-keys-job or manually)

- name: Configure NetBird on OPNsense
  hosts: opnsense
  gather_facts: false
  vars:
    netbird_management_url: "https://netbird-api.practice.local"
    netbird_hostname: "opnsense-gateway"
    netbird_port: 51820
    netbird_disable_server_routes: false
    # Setup key should be provided via extra vars or vault
    # ansible-playbook ... -e "netbird_setup_key=xxx"
    
  tasks:
    - name: Get current NetBird configuration
      uri:
        url: "https://{{ ansible_host }}/api/netbird/settings/get"
        method: GET
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: current_config
      
    - name: Display current NetBird config
      debug:
        var: current_config.json
        verbosity: 1

    - name: Configure NetBird settings
      uri:
        url: "https://{{ ansible_host }}/api/netbird/settings/set"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          netbird:
            general:
              enabled: "1"
              managementurl: "{{ netbird_management_url }}"
              setupkey: "{{ netbird_setup_key }}"
              hostname: "{{ netbird_hostname }}"
              port: "{{ netbird_port }}"
              disableserverroutes: "{{ '1' if netbird_disable_server_routes else '0' }}"
              carpinterface: ""
        status_code: [200]
      register: set_result
      when: netbird_setup_key is defined

    - name: Apply NetBird configuration
      uri:
        url: "https://{{ ansible_host }}/api/netbird/service/reconfigure"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: reconfigure_result
      when: set_result is changed

    - name: Wait for NetBird service to start
      pause:
        seconds: 10
      when: reconfigure_result is changed

    - name: Check NetBird service status
      uri:
        url: "https://{{ ansible_host }}/api/netbird/service/status"
        method: GET
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: service_status
      
    - name: Display NetBird service status
      debug:
        msg: "NetBird service status: {{ service_status.json }}"

    - name: Get NetBird interface assignment info
      uri:
        url: "https://{{ ansible_host }}/api/interfaces/overview/export"
        method: GET
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: interfaces
      
    - name: Check if wt0 interface exists
      set_fact:
        wt0_exists: "{{ interfaces.json | json_query(\"rows[?device=='wt0']\") | length > 0 }}"
        
    - name: Display interface status
      debug:
        msg: "NetBird wt0 interface exists: {{ wt0_exists }}"

- name: Configure NetBird interface assignment on OPNsense
  hosts: opnsense
  gather_facts: false
  vars:
    netbird_interface_name: "NETBIRD"
    
  tasks:
    - name: Check if NETBIRD interface is already assigned
      uri:
        url: "https://{{ ansible_host }}/api/interfaces/overview/export"
        method: GET
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: interfaces
      
    - name: Check NETBIRD assignment
      set_fact:
        netbird_assigned: "{{ interfaces.json | json_query(\"rows[?descr=='NETBIRD']\") | length > 0 }}"
        
    - name: Display assignment status
      debug:
        msg: "NETBIRD interface assigned: {{ netbird_assigned }}"
        
    - name: Note about interface assignment
      debug:
        msg: |
          If the NETBIRD interface is not assigned, you may need to:
          1. Go to Interfaces > Assignments in OPNsense
          2. Add wt0 as a new interface named 'NETBIRD'
          3. Enable the interface with 'Prevent interface removal' checked
          
          The OPNsense API for interface assignment varies by version.
          Manual assignment may be required for initial setup.
      when: not netbird_assigned
