---
# OPNsense Configuration Playbook
#
# This playbook configures OPNsense firewall via API.
# Designed to run from self-hosted runner on K3s (10.10.10.10) which has
# direct access to OPNsense LAN interface (10.10.10.1).
#
# BOOTSTRAP MODE (from workstation):
#   Run with: ansible-playbook -i inventory.yml playbooks/opnsense-configure.yml -e "bootstrap_mode=true"
#   Uses SSH through Proxmox jump host for initial setup
#
# CI/CD MODE (from self-hosted runner):
#   Run with: ansible-playbook -i inventory.yml playbooks/opnsense-configure.yml
#   Uses API directly (runner is on same LAN as OPNsense)
#
# Prerequisites:
#   ansible-galaxy collection install ansibleguy.opnsense
#   pip install httpx

# =============================================================================
# Play 1: Bootstrap via SSH (only runs with bootstrap_mode=true)
# Run manually: ansible-playbook -e bootstrap_mode=true ...
# =============================================================================
- name: Bootstrap OPNsense via SSH
  hosts: opnsense
  gather_facts: false

  vars:
    hostname: "perimeter-fw"
    domain: "practice.local"
    lan_ip: "10.10.10.1"
    lan_if: "vtnet1"
    wan_if: "vtnet0"
    wan_ip: "192.168.1.40"
    wan_subnet: "24"
    wan_gateway: "192.168.1.254"

  tasks:
    - name: Skip bootstrap in CI/CD mode
      ansible.builtin.meta: end_play
      when: not (bootstrap_mode | default(false) | bool)

    - name: Create interface config script
      ansible.builtin.raw: |
        echo '<?php' > /tmp/setip.php
        echo 'require_once("/usr/local/etc/inc/config.inc");' >> /tmp/setip.php
        echo 'require_once("/usr/local/etc/inc/interfaces.inc");' >> /tmp/setip.php
        echo 'global $config;' >> /tmp/setip.php
        echo '$config["interfaces"]["wan"]["ipaddr"]="{{ wan_ip }}";' >> /tmp/setip.php
        echo '$config["interfaces"]["wan"]["subnet"]="{{ wan_subnet }}";' >> /tmp/setip.php
        echo '$config["interfaces"]["wan"]["gateway"]="WAN_GW";' >> /tmp/setip.php
        echo 'unset($config["interfaces"]["wan"]["dhcp"]);' >> /tmp/setip.php
        echo '$config["interfaces"]["lan"]["ipaddr"]="{{ lan_ip }}";' >> /tmp/setip.php
        echo '$config["interfaces"]["lan"]["subnet"]="24";' >> /tmp/setip.php
        echo 'if(empty($config["gateways"])){$config["gateways"]=array();}' >> /tmp/setip.php
        echo 'if(empty($config["gateways"]["gateway_item"])){$config["gateways"]["gateway_item"]=array();}' >> /tmp/setip.php
        echo '$found=false;foreach($config["gateways"]["gateway_item"] as $g){if($g["name"]=="WAN_GW"){$found=true;}}' >> /tmp/setip.php
        echo 'if($found==false){$config["gateways"]["gateway_item"][]=array("interface"=>"wan","gateway"=>"{{ wan_gateway }}","name"=>"WAN_GW","ipprotocol"=>"inet","defaultgw"=>"1");}' >> /tmp/setip.php
        echo 'write_config("Set static IPs");' >> /tmp/setip.php
        echo 'interface_configure("wan");' >> /tmp/setip.php
        echo 'interface_configure("lan");' >> /tmp/setip.php
        echo 'system_routing_configure();' >> /tmp/setip.php
        echo 'echo "Done";' >> /tmp/setip.php
        echo '?>' >> /tmp/setip.php
      changed_when: true

    - name: Execute interface config script
      ansible.builtin.raw: /usr/local/bin/php /tmp/setip.php && rm /tmp/setip.php
      register: interface_config
      changed_when: true

    - name: Verify interface configuration
      ansible.builtin.raw: |
        echo "WAN:" && ifconfig {{ wan_if }} | grep "inet " | head -1
        echo "LAN:" && ifconfig {{ lan_if }} | grep "inet " | head -1
      register: if_verify
      changed_when: false

    - name: Display interface configuration
      ansible.builtin.debug:
        msg: "{{ if_verify.stdout }}"

    - name: Install QEMU Guest Agent
      ansible.builtin.raw: |
        pkg install -y qemu-guest-agent && sysrc qemu_guest_agent_enable=YES && service qemu-guest-agent start 2>/dev/null || true
      register: qemu_install
      changed_when: "'already installed' not in qemu_install.stdout"
      ignore_errors: true

    - name: Set hostname
      ansible.builtin.raw: |
        sed -i '' "s|<hostname>[^<]*</hostname>|<hostname>{{ hostname }}</hostname>|" /conf/config.xml
        sed -i '' "s|<domain>[^<]*</domain>|<domain>{{ domain }}</domain>|" /conf/config.xml
        hostname {{ hostname }}.{{ domain }}
      changed_when: true

    - name: Reload all services
      ansible.builtin.raw: |
        /usr/local/etc/rc.reload_all 2>/dev/null || configctl filter reload
      changed_when: true
      ignore_errors: true

    - name: Verify LAN interface
      ansible.builtin.raw: |
        ifconfig {{ lan_if }} | grep inet | head -1
      register: lan_ip_result
      changed_when: false

    - name: Display LAN IP
      ansible.builtin.debug:
        msg: "LAN interface ({{ lan_if }}): {{ lan_ip_result.stdout | trim }}"

# =============================================================================
# Play 2: Configure via API (works from runner or workstation)
# =============================================================================
- name: Configure OPNsense via API
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # OPNsense LAN IP (accessible from runner on same network)
    opn_host: "{{ opnsense_api_host | default('10.10.10.1') }}"
    opn_api_key: "{{ opnsense_api_key | default('C9HdbF5A8zWsw+ZV1fzQ0aDbgQlaWEIGbwh7Cq7kq/hSz+rvpxNQa5vUylm3zi8an9UdNVPfzJiHqKtr') }}"
    opn_api_secret: "{{ opnsense_api_secret | default('pHKan7aagfg6F4H8zG8Vnja97n0pIaz4MexuetCmcDq/Qy9v3Dk1JByi7p4Tb0SWEJXd02RKJUNtHZoZ') }}"

    # Interface Configuration
    internal_ip: "10.10.10.1"
    internal_subnet: "24"
    
    # DHCP Configuration
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.199"
    
    # Networks
    lan_network: "10.10.10.0/24"
    management_network: "192.168.1.0/24"

  module_defaults:
    group/ansibleguy.opnsense.all:
      firewall: "{{ opn_host }}"
      api_key: "{{ opn_api_key }}"
      api_secret: "{{ opn_api_secret }}"
      ssl_verify: false

  tasks:
    # =========================================================================
    # Phase 1: Test API Connectivity
    # =========================================================================
    - name: Test API connectivity
      ansibleguy.opnsense.list:
        target: alias
      register: api_test

    - name: Display API connection status
      ansible.builtin.debug:
        msg: "API connection successful to {{ opn_host }}"

    # =========================================================================
    # Phase 2: Configure Firewall Aliases
    # =========================================================================
    - name: Create LAN network alias
      ansibleguy.opnsense.alias:
        name: "LAN_Network"
        type: "network"
        content: "{{ lan_network }}"
        description: "HomePractice internal network"
        state: present

    - name: Create Management network alias
      ansibleguy.opnsense.alias:
        name: "Management_Network"
        type: "network"
        content: "{{ management_network }}"
        description: "Home network for management access"
        state: present

    # =========================================================================
    # Phase 3: Configure Firewall Rules via direct API
    # Note: ansibleguy.opnsense.rule has bugs with OPNsense 25.1 API
    # =========================================================================
    - name: Add LAN to any firewall rule via API
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/addRule"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          rule:
            enabled: "1"
            action: "pass"
            interface: "lan"
            direction: "in"
            ipprotocol: "inet"
            protocol: "any"
            source_net: "lan"
            destination_net: "any"
            description: "Allow LAN to any"
      register: fw_lan_rule
      changed_when: fw_lan_rule.json.uuid is defined


    - name: Apply firewall rules
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/apply"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
      changed_when: true

    # =========================================================================
    # Phase 4: Configure DNS Host Override
    # =========================================================================
    - name: Add DNS entry for K3s
      ansibleguy.opnsense.unbound_host:
        hostname: "k3s"
        domain: "practice.local"
        server: "10.10.10.10"
        description: "HomePractice K3s node"
        state: present

    - name: Reload Unbound DNS
      ansibleguy.opnsense.reload:
        target: "unbound"

    # =========================================================================
    # Phase 6: Apply all changes
    # =========================================================================
    - name: Reload firewall rules
      ansibleguy.opnsense.reload:
        target: "rule"

    # =========================================================================
    # Phase 7: Summary
    # =========================================================================
    - name: List configured aliases
      ansibleguy.opnsense.list:
        target: alias
      register: final_aliases

    - name: Display configuration summary
      ansible.builtin.debug:
        msg: |
          ============================================
          OPNsense Configuration Complete
          ============================================
          
          Configured via SSH (bootstrap_mode=true):
          - Hostname: perimeter-fw.practice.local
          - QEMU Guest Agent installed
          
          Configured via API:
          - Aliases: {{ final_aliases.data | length }}
          - Firewall rule: Allow LAN to any
          - DNS: k3s.practice.local → 10.10.10.10
          
          API: https://{{ opn_host }}
          ============================================
