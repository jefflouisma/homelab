---
# OPNsense Configuration Playbook (2-NIC Setup)
# WAN (vtnet0/vmbr0): DHCP, gateway, WireGuard + management
# LAN (vtnet1/vmbr1): 10.10.10.1/24, internal network
#
# Prerequisites:
#   ansible-galaxy collection install ansibleguy.opnsense
#   pip install httpx
#
# Run: ansible-playbook -i inventory.yml playbooks/opnsense-configure.yml

# =============================================================================
# Play 1: Configure LAN interface via SSH (API doesn't support interface config)
# =============================================================================
- name: Configure OPNsense LAN Interface via SSH
  hosts: opnsense
  gather_facts: false

  vars:
    hostname: "perimeter-fw"
    domain: "local"
    lan_ip: "10.10.10.1"
    lan_subnet: "24"
    lan_if: "vtnet1"
    wan_gateway: "192.168.1.254"
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.199"

  tasks:
    - name: Install QEMU Guest Agent
      ansible.builtin.raw: |
        pkg install -y qemu-guest-agent && sysrc qemu_guest_agent_enable=YES && service qemu-guest-agent start
      register: qemu_install
      changed_when: "'already installed' not in qemu_install.stdout"
      ignore_errors: true

    - name: Set hostname
      ansible.builtin.raw: |
        sed -i '' "s|<hostname>[^<]*</hostname>|<hostname>{{ hostname }}</hostname>|" /conf/config.xml
        sed -i '' "s|<domain>[^<]*</domain>|<domain>{{ domain }}</domain>|" /conf/config.xml
        hostname {{ hostname }}.{{ domain }}
      changed_when: true

    - name: Backup config.xml
      ansible.builtin.raw: |
        /bin/sh -c 'cp /conf/config.xml /conf/config.xml.bak.`date +%Y%m%d_%H%M%S`'
      changed_when: true

    - name: Check current LAN IP
      ansible.builtin.raw: |
        /bin/sh -c 'grep -A5 "<lan>" /conf/config.xml | grep "<ipaddr>" | head -1'
      register: current_lan
      changed_when: false

    - name: Display current LAN config
      ansible.builtin.debug:
        msg: "Current LAN: {{ current_lan.stdout | trim }}"

    - name: Configure LAN interface IP
      ansible.builtin.raw: |
        sed -i '' 's|<lan>|<lan_backup>|g; s|</lan>|</lan_backup>|g' /conf/config.xml 2>/dev/null || true
        grep -q "<ipaddr>{{ lan_ip }}</ipaddr>" /conf/config.xml || sed -i '' "s|<lan_backup>|<lan>|g; s|</lan_backup>|</lan>|g" /conf/config.xml
      ignore_errors: true

    - name: Ensure LAN has correct IP (update if needed)
      ansible.builtin.raw: |
        grep -q "<lan>" /conf/config.xml && sed -i '' "/<lan>/,/<\/lan>/s|<ipaddr>[^<]*</ipaddr>|<ipaddr>{{ lan_ip }}</ipaddr>|" /conf/config.xml
      ignore_errors: true

    - name: Ensure LAN DHCP is configured
      ansible.builtin.raw: |
        grep -q "<lan>" /conf/config.xml && grep -A20 "<dhcpd>" /conf/config.xml | grep -q "<lan>" || echo "DHCP may need manual config"
      ignore_errors: true

    - name: Verify WAN gateway is set (DHCP provides this)
      ansible.builtin.raw: |
        netstat -rn | grep default
      register: gateway_check
      changed_when: false

    - name: Display gateway
      ansible.builtin.debug:
        msg: "Default gateway: {{ gateway_check.stdout | trim }}"

    - name: Verify NAT is automatic (uses WAN interface)
      ansible.builtin.raw: |
        grep -A2 "<outbound>" /conf/config.xml | grep mode
      register: nat_mode
      changed_when: false

    - name: Display NAT mode
      ansible.builtin.debug:
        msg: "NAT mode: {{ nat_mode.stdout | trim }}"

    - name: Reload all services
      ansible.builtin.raw: |
        /usr/local/etc/rc.reload_all
      changed_when: true
      ignore_errors: true

    - name: Verify LAN interface
      ansible.builtin.raw: |
        /bin/sh -c 'ifconfig {{ lan_if }} | grep inet | head -1'
      register: lan_ip_result
      changed_when: false

    - name: Display LAN IP
      ansible.builtin.debug:
        msg: "LAN interface ({{ lan_if }}): {{ lan_ip_result.stdout | trim }}"

# =============================================================================
# Play 2: Configure via API (firewall rules, aliases, DNS, WireGuard)
# =============================================================================
- name: Configure OPNsense via API
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # OPNsense connection - WAN IP from DHCP
    opn_host: "{{ opnsense_wan_ip | default('192.168.1.1') }}"
    opn_api_key: "C9HdbF5A8zWsw+ZV1fzQ0aDbgQlaWEIGbwh7Cq7kq/hSz+rvpxNQa5vUylm3zi8an9UdNVPfzJiHqKtr"
    opn_api_secret: "pHKan7aagfg6F4H8zG8Vnja97n0pIaz4MexuetCmcDq/Qy9v3Dk1JByi7p4Tb0SWEJXd02RKJUNtHZoZ"

    # Interface Configuration
    internal_ip: "10.10.10.1"
    internal_subnet: "24"
    
    # DHCP Configuration
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.199"
    
    # Networks
    lan_network: "10.10.10.0/24"
    management_network: "192.168.1.0/24"
    
    # WireGuard VPN
    wireguard_port: 51820

  module_defaults:
    group/ansibleguy.opnsense.all:
      firewall: "{{ opn_host }}"
      api_key: "{{ opn_api_key }}"
      api_secret: "{{ opn_api_secret }}"
      ssl_verify: false

  tasks:
    # =========================================================================
    # Phase 1: Test API Connectivity
    # =========================================================================
    - name: Test API connectivity
      ansibleguy.opnsense.list:
        target: alias
      register: api_test

    - name: Display API connection status
      ansible.builtin.debug:
        msg: "API connection successful to {{ opn_host }}"

    # =========================================================================
    # Phase 2: Configure Firewall Aliases
    # =========================================================================
    - name: Create LAN network alias
      ansibleguy.opnsense.alias:
        name: "LAN_Network"
        type: "network"
        content: "{{ lan_network }}"
        description: "HomePractice internal network"
        state: present

    - name: Create Management network alias
      ansibleguy.opnsense.alias:
        name: "Management_Network"
        type: "network"
        content: "{{ management_network }}"
        description: "Home network for management access"
        state: present

    # =========================================================================
    # Phase 3: Configure Firewall Rules via direct API
    # Note: ansibleguy.opnsense.rule has bugs with OPNsense 25.1 API
    # =========================================================================
    - name: Add LAN to any firewall rule via API
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/addRule"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          rule:
            enabled: "1"
            action: "pass"
            interface: "lan"
            direction: "in"
            ipprotocol: "inet"
            protocol: "any"
            source_net: "lan"
            destination_net: "any"
            description: "Allow LAN to any"
      register: fw_lan_rule
      changed_when: fw_lan_rule.json.uuid is defined


    - name: Apply firewall rules
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/apply"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
      changed_when: true

    # =========================================================================
    # Phase 4: Configure WireGuard VPN (built into OPNsense 25.1+)
    # =========================================================================
    - name: Enable WireGuard
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/general/set"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          general:
            enabled: "1"
      register: wg_enable

    - name: Create WireGuard server instance
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/server/addServer"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          server:
            enabled: "1"
            name: "wg0"
            port: "{{ wireguard_port }}"
            tunneladdress: "10.10.20.1/24"
            dns: "10.10.10.1"
      register: wg_server
      changed_when: wg_server.json.uuid is defined
      ignore_errors: true

    - name: Apply WireGuard configuration
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/service/reconfigure"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
      changed_when: true

    # =========================================================================
    # Phase 5: Configure DNS Host Override
    # =========================================================================
    - name: Add DNS entry for K3s
      ansibleguy.opnsense.unbound_host:
        hostname: "k3s"
        domain: "practice.homelab.local"
        server: "10.10.10.10"
        description: "HomePractice K3s node"
        state: present

    - name: Reload Unbound DNS
      ansibleguy.opnsense.reload:
        target: "unbound"

    # =========================================================================
    # Phase 6: Apply all changes
    # =========================================================================
    - name: Reload firewall rules
      ansibleguy.opnsense.reload:
        target: "rule"

    # =========================================================================
    # Phase 7: Summary
    # =========================================================================
    - name: List configured aliases
      ansibleguy.opnsense.list:
        target: alias
      register: final_aliases

    - name: Display configuration summary
      ansible.builtin.debug:
        msg: |
          ============================================
          OPNsense Configuration Complete
          ============================================
          
          Configured via SSH (Play 1):
          - LAN interface: 10.10.10.1/24 (vtnet1)
          - DHCP range: 10.10.10.100-199
          
          Configured via API (Play 2):
          - Aliases: {{ final_aliases.data | length }}
          - Firewall rule: Allow LAN to any
          - DNS: k3s.practice.homelab.local → 10.10.10.10
          - WireGuard VPN: Enabled on port {{ wireguard_port }}
          
          API: https://{{ opn_host }}
          ============================================
