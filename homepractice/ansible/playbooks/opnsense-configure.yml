---
# OPNsense Configuration Playbook
# Configures interfaces, DHCP, firewall rules, and WireGuard VPN
#
# Prerequisites:
#   ansible-galaxy collection install ansibleguy.opnsense
#   pip install httpx
#
# Run: ansible-playbook -i inventory.yml playbooks/opnsense-configure.yml

# =============================================================================
# Play 1: Configure Interface IPs via SSH (API doesn't support this)
# =============================================================================
- name: Configure OPNsense Interfaces via SSH
  hosts: opnsense
  gather_facts: false

  vars:
    lan_ip: "10.10.10.1"
    lan_subnet: "24"
    wan_gateway: "192.168.1.254"
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.199"

  tasks:
    - name: Backup config.xml
      ansible.builtin.raw: |
        /bin/sh -c 'cp /conf/config.xml /conf/config.xml.bak.`date +%Y%m%d_%H%M%S`'
      changed_when: true

    - name: Check current LAN IP
      ansible.builtin.raw: |
        /bin/sh -c 'grep -A5 "<lan>" /conf/config.xml | grep "<ipaddr>" | head -1'
      register: current_lan_ip
      changed_when: false

    - name: Display current LAN IP
      ansible.builtin.debug:
        msg: "Current LAN config: {{ current_lan_ip.stdout | trim }}"

    - name: Update LAN interface IP to {{ lan_ip }}
      ansible.builtin.raw: |
        /bin/sh -c 'sed -i.tmp "s|<ipaddr>192.168.1.1</ipaddr>|<ipaddr>{{ lan_ip }}</ipaddr>|" /conf/config.xml'
      when: "'192.168.1.1' in current_lan_ip.stdout"
      register: lan_updated

    - name: Configure DHCP range on LAN
      ansible.builtin.raw: |
        /bin/sh -c 'sed -i.tmp "s|<from>192.168.1.100</from>|<from>{{ dhcp_range_start }}</from>|" /conf/config.xml'
        /bin/sh -c 'sed -i.tmp "s|<to>192.168.1.199</to>|<to>{{ dhcp_range_end }}</to>|" /conf/config.xml'
      when: lan_updated is changed
      ignore_errors: true

    - name: Reload all services
      ansible.builtin.raw: |
        /usr/local/etc/rc.reload_all
      when: lan_updated is changed
      ignore_errors: true

    - name: Verify new LAN IP
      ansible.builtin.raw: |
        /bin/sh -c 'grep -A5 "<lan>" /conf/config.xml | grep "<ipaddr>" | head -1'
      register: new_lan_ip
      changed_when: false

    - name: Display new LAN IP
      ansible.builtin.debug:
        msg: "New LAN config: {{ new_lan_ip.stdout | trim }}"

# =============================================================================
# Play 2: Configure via API (firewall rules, aliases, DNS, WireGuard)
# =============================================================================
- name: Configure OPNsense via API
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # OPNsense connection
    opn_host: "192.168.1.1"
    opn_api_key: "O0bQQHhpy4ASk72A8aOJai6p8G76ZErSDDWgq4rsrvappqk2o/Wt6LiOv1pSWFvATHJy7xEkAI7kZj6T"
    opn_api_secret: "lfepNn2EIapayr0kHmtDMXcjy3s7QzBB6YuWSYepHEnR+zAjHPnztzvKI9MUoopmwGovNAhtZ9HGOyOo"

    # Interface Configuration
    internal_ip: "10.10.10.1"
    internal_subnet: "24"
    
    # DHCP Configuration
    dhcp_range_start: "10.10.10.100"
    dhcp_range_end: "10.10.10.199"
    
    # Networks
    lan_network: "10.10.10.0/24"
    management_network: "192.168.1.0/24"
    
    # WireGuard VPN
    wireguard_port: 51820

  module_defaults:
    group/ansibleguy.opnsense.all:
      firewall: "{{ opn_host }}"
      api_key: "{{ opn_api_key }}"
      api_secret: "{{ opn_api_secret }}"
      ssl_verify: false

  tasks:
    # =========================================================================
    # Phase 1: Test API Connectivity
    # =========================================================================
    - name: Test API connectivity
      ansibleguy.opnsense.list:
        target: alias
      register: api_test

    - name: Display API connection status
      ansible.builtin.debug:
        msg: "API connection successful to {{ opn_host }}"

    # =========================================================================
    # Phase 2: Configure Firewall Aliases
    # =========================================================================
    - name: Create LAN network alias
      ansibleguy.opnsense.alias:
        name: "LAN_Network"
        type: "network"
        content: "{{ lan_network }}"
        description: "HomePractice internal network"
        state: present

    - name: Create Management network alias
      ansibleguy.opnsense.alias:
        name: "Management_Network"
        type: "network"
        content: "{{ management_network }}"
        description: "Home network for management access"
        state: present

    # =========================================================================
    # Phase 3: Configure Firewall Rules via direct API
    # Note: ansibleguy.opnsense.rule has bugs with OPNsense 25.1 API
    # =========================================================================
    - name: Add LAN to any firewall rule via API
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/addRule"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          rule:
            enabled: "1"
            action: "pass"
            interface: "lan"
            direction: "in"
            ipprotocol: "inet"
            protocol: "any"
            source_net: "lan"
            destination_net: "any"
            description: "Allow LAN to any (Ansible)"
      register: fw_lan_rule
      changed_when: fw_lan_rule.json.uuid is defined

    - name: Apply firewall rules
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/firewall/filter/apply"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
      changed_when: true

    # =========================================================================
    # Phase 4: Configure WireGuard VPN (built into OPNsense 25.1+)
    # =========================================================================
    - name: Enable WireGuard
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/general/set"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          general:
            enabled: "1"
      register: wg_enable

    - name: Create WireGuard server instance
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/server/addServer"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          server:
            enabled: "1"
            name: "wg0"
            port: "{{ wireguard_port }}"
            tunneladdress: "10.10.20.1/24"
            dns: "10.10.10.1"
      register: wg_server
      changed_when: wg_server.json.uuid is defined
      ignore_errors: true

    - name: Apply WireGuard configuration
      ansible.builtin.uri:
        url: "https://{{ opn_host }}/api/wireguard/service/reconfigure"
        method: POST
        user: "{{ opn_api_key }}"
        password: "{{ opn_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
      changed_when: true

    # =========================================================================
    # Phase 5: Configure DNS Host Override
    # =========================================================================
    - name: Add DNS entry for K3s
      ansibleguy.opnsense.unbound_host:
        hostname: "k3s"
        domain: "practice.homelab.local"
        server: "10.10.10.10"
        description: "HomePractice K3s node"
        state: present

    - name: Reload Unbound DNS
      ansibleguy.opnsense.reload:
        target: "unbound"

    # =========================================================================
    # Phase 6: Apply all changes
    # =========================================================================
    - name: Reload firewall rules
      ansibleguy.opnsense.reload:
        target: "rule"

    # =========================================================================
    # Phase 7: Summary
    # =========================================================================
    - name: List configured aliases
      ansibleguy.opnsense.list:
        target: alias
      register: final_aliases

    - name: Display configuration summary
      ansible.builtin.debug:
        msg: |
          ============================================
          OPNsense Configuration Complete
          ============================================
          
          Configured via SSH (Play 1):
          - LAN interface: {{ internal_ip }}/{{ internal_subnet }}
          - DHCP range: {{ dhcp_range_start }}-{{ dhcp_range_end }}
          
          Configured via API (Play 2):
          - Aliases: {{ final_aliases.data | length }}
          - Firewall rule: Allow LAN to any
          - DNS: k3s.practice.homelab.local → 10.10.10.10
          - WireGuard VPN: Enabled on port {{ wireguard_port }}
          
          API: https://{{ opn_host }}
          ============================================
