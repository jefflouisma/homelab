---
# FreeIPA Server Installation Playbook
# Installs and configures FreeIPA on Fedora VM
#
# Prerequisites:
#   - Fedora VM deployed via Terraform
#   - SSH access configured
#   - Network connectivity to practice.local domain
#
# Usage:
#   ansible-playbook -i inventory.yml playbooks/freeipa-install.yml

- name: Install and Configure FreeIPA Server
  hosts: freeipa
  become: true
  gather_facts: true

  vars:
    ipa_realm: "PRACTICE.LOCAL"
    ipa_domain: "practice.local"
    ipa_hostname: "ipa.practice.local"
    ipa_admin_password: "{{ lookup('env', 'FREEIPA_ADMIN_PASSWORD') | default('FreeIPAAdmin2024!', true) }}"
    ipa_ds_password: "{{ lookup('env', 'FREEIPA_DS_PASSWORD') | default('DirectoryServer2024!', true) }}"

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ ipa_hostname }}"

    - name: Update /etc/hosts with FreeIPA hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} {{ ipa_hostname }} ipa"
        state: present

    - name: Install FreeIPA server packages
      ansible.builtin.dnf:
        name:
          - freeipa-server
          - freeipa-server-dns
          - freeipa-server-trust-ad
        state: present
      register: ipa_packages

    - name: Check if FreeIPA is already installed
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: ipa_installed

    - name: Install FreeIPA server
      ansible.builtin.command:
        cmd: >
          ipa-server-install
          --realm={{ ipa_realm }}
          --domain={{ ipa_domain }}
          --hostname={{ ipa_hostname }}
          --ds-password={{ ipa_ds_password }}
          --admin-password={{ ipa_admin_password }}
          --mkhomedir
          --no-ntp
          --no-host-dns
          --unattended
      when: not ipa_installed.stat.exists
      register: ipa_install
      failed_when: ipa_install.rc != 0 and 'already exists' not in ipa_install.stderr

    - name: Enable and start FreeIPA services
      ansible.builtin.systemd:
        name: ipa
        state: started
        enabled: true

    - name: Configure firewall for FreeIPA
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - freeipa-ldap
        - freeipa-ldaps
        - freeipa-replication
        - dns
        - http
        - https
        - kerberos
        - kpasswd
      ignore_errors: true

    - name: Wait for FreeIPA services to be ready
      ansible.builtin.uri:
        url: "https://{{ ipa_hostname }}/ipa/ui/"
        validate_certs: false
        status_code: 200
      register: ipa_ui
      until: ipa_ui.status == 200
      retries: 30
      delay: 10

    - name: Display FreeIPA installation summary
      ansible.builtin.debug:
        msg: |
          ============================================
          FreeIPA Installation Complete!
          ============================================
          Server: {{ ipa_hostname }}
          Realm: {{ ipa_realm }}
          Domain: {{ ipa_domain }}
          
          Web UI: https://{{ ansible_default_ipv4.address }}/ipa/ui/
          Admin User: admin
          
          LDAP: ldap://{{ ansible_default_ipv4.address }}:389
          LDAPS: ldaps://{{ ansible_default_ipv4.address }}:636
          
          Kerberos: {{ ipa_realm }}
          ============================================
