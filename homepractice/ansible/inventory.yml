---
# HomePractice Ansible Inventory
all:
  children:
    opnsense:
      hosts:
        practice-opnsense:
          ansible_host: 192.168.1.1
          ansible_user: root
          ansible_password: "opnsense"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o PubkeyAuthentication=no'
    
    k3s:
      hosts:
        practice-k3s:
          ansible_host: 10.10.10.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o ProxyJump=root@192.168.1.30'
    
    proxmox:
      hosts:
        g913-proxmox:
          ansible_host: 192.168.1.30
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_cloudstack_ed25519
