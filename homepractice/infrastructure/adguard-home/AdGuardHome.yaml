# AdGuard Home Configuration
# GitOps managed - deployed via Terraform + cloud-init
# 
# DNS Forwarding:
#   - practice.local → OPNsense (192.168.1.40)
#   - Everything else → Home Router (192.168.1.254)

http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:3000
  session_ttl: 720h

users:
  - name: admin
    password: $2a$10$placeholder_hash_replace_on_first_login

auth_attempts: 5
block_auth_min: 15

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  
  # Upstream DNS with conditional forwarding
  # Syntax: [/domain/]server
  upstream_dns:
    # Forward practice.local to OPNsense
    - '[/practice.local/]192.168.1.40'
    # Forward reverse DNS for 10.10.10.x to OPNsense
    - '[/10.10.10.in-addr.arpa/]192.168.1.40'
    # Everything else goes to home router
    - '192.168.1.254'
  
  # Fallback DNS (used if upstream fails)
  fallback_dns:
    - '1.1.1.1'
    - '8.8.8.8'
  
  # Bootstrap DNS (used to resolve upstream hostnames)
  bootstrap_dns:
    - '192.168.1.254'
    - '1.1.1.1'
  
  upstream_dns_file: ""
  upstream_mode: load_balance
  fastest_timeout: 1s
  
  # Cache settings
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: true
  
  # DNSSEC
  enable_dnssec: false
  
  # Rate limiting
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  
  # Logging
  querylog_enabled: true
  querylog_file_enabled: true
  querylog_interval: 24h
  querylog_size_memory: 1000
  
  # Statistics
  statistics:
    enabled: true
    interval: 24h
  
  # Local PTR resolvers
  local_ptr_upstreams: []
  use_private_ptr_resolvers: false
  
  # Blocking
  blocked_response_ttl: 10
  protection_enabled: true
  blocking_mode: default
  blocking_ipv4: ""
  blocking_ipv6: ""
  
  # EDNS
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false

# Filtering (ad blocking)
filtering:
  filtering_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  safe_search:
    enabled: false
  
  # Block lists
  rewrites: []
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  
  # Update interval for blocklists (24 hours)
  filters_update_interval: 24

# Default filter lists
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2

# Whitelist
whitelist_filters: []

# User rules (custom blocking/allowing)
user_rules: []

# DHCP (disabled - using router DHCP)
dhcp:
  enabled: false

# Clients (per-client settings)
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []

# Schema version
schema_version: 29

# OS settings
os:
  group: ""
  user: ""
  rlimit_nofile: 0

# Logging
log:
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
