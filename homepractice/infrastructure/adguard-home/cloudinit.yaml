#cloud-config
# AdGuard Home Installation via Cloud-Init
# Deployed on Debian LXC container

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - ca-certificates

write_files:
  - path: /opt/AdGuardHome/AdGuardHome.yaml
    permissions: '0644'
    content: |
      # AdGuard Home Configuration
      # GitOps managed - practice.local → OPNsense, else → home router
      
      http:
        pprof:
          port: 6060
          enabled: false
        address: 0.0.0.0:3000
        session_ttl: 720h
      
      users:
        - name: admin
          password: $2a$10$Wd0XqoNv.h8xOdKYoK8pS.OoHmC0qO3GXhgpqZjQQpDPEh3n5.G2i
      
      auth_attempts: 5
      block_auth_min: 15
      
      dns:
        bind_hosts:
          - 0.0.0.0
        port: 53
        upstream_dns:
          - '[/practice.local/]192.168.1.40'
          - '[/10.10.10.in-addr.arpa/]192.168.1.40'
          - '192.168.1.254'
        fallback_dns:
          - '1.1.1.1'
          - '8.8.8.8'
        bootstrap_dns:
          - '192.168.1.254'
          - '1.1.1.1'
        upstream_mode: load_balance
        fastest_timeout: 1s
        cache_size: 4194304
        cache_optimistic: true
        enable_dnssec: false
        ratelimit: 0
        querylog_enabled: true
        querylog_file_enabled: true
        querylog_interval: 24h
        statistics:
          enabled: true
          interval: 24h
        protection_enabled: true
        blocking_mode: default
      
      filtering:
        filtering_enabled: true
        parental_enabled: false
        safebrowsing_enabled: false
        filters_update_interval: 24
      
      filters:
        - enabled: true
          url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
          name: AdGuard DNS filter
          id: 1
        - enabled: true
          url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
          name: AdAway Default Blocklist
          id: 2
      
      dhcp:
        enabled: false
      
      clients:
        runtime_sources:
          whois: true
          arp: true
          rdns: true
          dhcp: true
          hosts: true
        persistent: []
      
      schema_version: 29
      
      log:
        file: ""
        max_backups: 0
        max_size: 100
        max_age: 3
        compress: false
        local_time: false
        verbose: false

  - path: /opt/install-adguard.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      
      LOG=/var/log/adguard-install.log
      exec > >(tee -a $LOG) 2>&1
      
      echo "=== AdGuard Home Install Started $(date) ==="
      
      # Wait for network
      echo "Waiting for network..."
      for i in $(seq 1 30); do
        if ping -c 1 -W 2 1.1.1.1 >/dev/null 2>&1; then
          echo "Network is up"
          break
        fi
        sleep 2
      done
      
      # Create directory
      mkdir -p /opt/AdGuardHome
      cd /opt/AdGuardHome
      
      # Download AdGuard Home
      echo "Downloading AdGuard Home..."
      LATEST=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | grep -oP '"tag_name": "\K[^"]+')
      VERSION=${LATEST#v}
      
      curl -L -o AdGuardHome.tar.gz \
        "https://github.com/AdguardTeam/AdGuardHome/releases/download/${LATEST}/AdGuardHome_linux_amd64.tar.gz"
      
      tar -xzf AdGuardHome.tar.gz --strip-components=1
      rm AdGuardHome.tar.gz
      
      # Install as service
      echo "Installing as service..."
      ./AdGuardHome -s install
      
      # Start service
      systemctl enable AdGuardHome
      systemctl start AdGuardHome
      
      echo "=== AdGuard Home Install Complete $(date) ==="
      echo "Web UI: http://$(hostname -I | awk '{print $1}'):3000"
      echo "DNS: $(hostname -I | awk '{print $1}'):53"

runcmd:
  - /opt/install-adguard.sh
